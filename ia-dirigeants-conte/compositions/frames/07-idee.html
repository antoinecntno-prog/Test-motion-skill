    g += `<g transform="rotate(${f(p.head)},4,-500)"><path d="M-8,-506 C-26,-520 -30,-552 -20,-574 C-10,-594 18,-600 30,-588 C38,-580 41,-570 39,-561 L53,-545 L40,-541 C42,-535 40,-529 36,-526 L40,-517 C32,-511 20,-509 12,-507 L10,-494 L-6,-494 Z"/>` +
      `<path d="M-24,-560 C-30,-580 -14,-602 8,-603 C24,-604 34,-596 38,-586 C26,-592 10,-594 -2,-588 C-14,-582 -20,-572 -24,-560 Z"/></g>`;

  /* point de la main (bras 'F' avant, 'B' arrière) d'un père, dans le repère de la scène */
  function mainPere(o, bras = 'F') {

  /* ---------- la fillette (cinq ans, deux couettes ; échelle du film 0,76 : 251 u debout) */
  const FILLE = { epaF: [6, -226], epaB: [-2, -226], hanche: -124, hancheAssise: -118, bras: [56, 50], jambe: [62, 58], dos: [-14, -196] };
  function fille(o = {}) {

    };
    const arm = (sx, sy, [sh, el]) => {

    // robe trapèze
    g += `<path d="M-15,-238 L11,-238 C21,-234 24,-226 24,-214 L50,-118 C28,-110 -28,-110 -48,-118 L-24,-214 C-24,-228 -22,-235 -15,-238 Z"/>`;
    // tête ronde de profil, frange, couettes
    g += `<g transform="rotate(${f(p.head)},0,-240)">` +
      `<path d="M-26,-262 C-41,-280 -37,-312 -14,-322 C4,-330 30,-324 40,-304 C44,-296 45,-290 44,-284 L51,-277 L43,-272 C42,-264 38,-256 30,-252 C20,-246 6,-246 -4,-248 L-2,-236 L-14,-236 L-16,-250 C-22,-254 -24,-258 -26,-262 Z"/>` +
      `<path d="M-30,-300 C-26,-326 8,-336 30,-318 C40,-310 44,-300 44,-292 C36,-304 22,-312 6,-312 C-8,-312 -22,-306 -30,-300 Z"/>` +
      `<path d="M-30,-298 C-48,-306 -66,-296 -72,-276 C-70,-264 -64,-256 -58,-252 C-60,-264 -58,-276 -50,-282 C-46,-284 -40,-286 -34,-288 Z"/>` +
      `<circle cx="-34" cy="-294" r="7"/>` +
      `<path d="M-14,-322 C-20,-342 -36,-354 -54,-350 C-46,-344 -40,-336 -38,-328 C-30,-326 -22,-324 -14,-322 Z"/>` +
      `<circle cx="-16" cy="-324" r="6"/></g>`;

      g += `<path d="M2,-232 L12,-222 L70,-122 L60,-118 Z"/>`;

      g += `<circle cx="48" cy="-250" r="7.5"/><circle cx="55" cy="-247" r="7"/>` + (p.rivets ? rivet(64, -122, 2.2) : '');
    } else {

  /* ---------- engrenage, roue de bois à trois ajours (sa rotation se voit), le Temps perdu */
  function engrenage(cx, cy, r, dents = 10, rot = 0, trou = 0.32) {
    let d = '';
    const n = dents * 2;
    for (let i = 0; i < n; i++) {
      const a0 = rad(rot + (i / n) * 360), a1 = rad(rot + ((i + 1) / n) * 360);
      const rr = i % 2 === 0 ? r : r * 0.8;
      d += (i === 0 ? 'M' : 'L') + f(cx + rr * Math.cos(a0)) + ',' + f(cy + rr * Math.sin(a0)) + ' L' + f(cx + rr * Math.cos(a1)) + ',' + f(cy + rr * Math.sin(a1)) + ' ';
    }
    d += 'Z ';
    const h = r * trou;
    d += `M${f(cx + h)},${f(cy)} A${f(h)},${f(h)} 0 1 0 ${f(cx - h)},${f(cy)} A${f(h)},${f(h)} 0 1 0 ${f(cx + h)},${f(cy)} Z`;
    return `<path fill-rule="evenodd" d="${d}"/>`;
  }
  function roue(cx, cy, a, r = 21) {
    let d = `${disque(cx, cy, r)} ${disque(cx, cy, r * 0.17)} `;
    for (let i = 0; i < 3; i++) { const b = rad(a + i * 120); d += disque(cx + r * 0.6 * Math.cos(b), cy + r * 0.6 * Math.sin(b), r * 0.24) + ' '; }
    return `<path fill-rule="evenodd" d="${d}"/>`;
  }
  /* le Temps perdu : horloge comtoise trapue sur deux roulettes (échelle du film 0,70 ; cadran r 80 à 270 u du sol) */
  const HORLOGE = { cadran: -386, epaL: [-88, -190], epaR: [88, -190], bras: [52, 46], pivot: -262, lentille: 132 };
  /* partie : 'corps' (tout ce qui ne tourne pas), ou une pièce mobile tracée à l'angle 0 ('roueG', 'roueD', 'balancier',
     'engr1', 'engr2', 'heure', 'minute') que placerHorloge fait tourner par la matrice (PIECES_HORLOGE) : le corps garde la
     même liste, son sprite et son halo, quand l'horloge roule et que son balancier bat */
  function horloge(o = {}) {
    const p = Object.assign({ x: 0, y: 0, s: 0.70, heure: -60, minute: 140, balancier: 8, armL: [24, -30], armR: [-24, 30],
      roue: 0, engr: 0, fill: C.ombre, rivets: true, papier: C.papier, partie: null }, o);
    const pt = p.partie, tout = !pt, corps = tout || pt === 'corps';
    const ba = pt ? 0 : p.balancier, ro = pt ? 0 : p.roue, en = pt ? 0 : p.engr;
    let g = '';
    if (tout || pt === 'roueG') g += roue(-48, -21, ro);
    if (tout || pt === 'roueD') g += roue(48, -21, ro + 40);
    if (corps) {
      g += `<path d="M-80,-36 L80,-36 L72,-66 L-72,-66 Z"/>`;
      // ventre bombé et sa fenêtre en lentille (ajourée)
      g += `<path fill-rule="evenodd" d="M-70,-64 C-106,-112 -106,-204 -66,-252 C-60,-264 -60,-280 -54,-292 L54,-292 C60,-280 60,-264 66,-252 C106,-204 106,-112 70,-64 Z ` +
        `M0,-272 C42,-238 42,-118 0,-88 C-42,-118 -42,-238 0,-272 Z"/>`;
    }
    // balancier : tige, lentille ajourée, engrenages
    if (tout || pt === 'balancier') {
      const lx = -132 * Math.sin(rad(ba)), ly = -262 + 132 * Math.cos(rad(ba));
      g += `<path d="M-2,-262 L2,-262 L${f(lx + 2)},${f(ly)} L${f(lx - 2)},${f(ly)} Z"/>`;
      g += `<path fill-rule="evenodd" d="${disque(lx, ly, 22)} ${disque(lx, ly, 9)}"/>`;
    }
    if (tout || pt === 'engr1') g += engrenage(-14, -232, 17, 9, 12 + en);
    if (tout || pt === 'engr2') g += engrenage(14, -214, 12, 7, 30 - en * 9 / 7);
    const aig = (ang, len, w) => `<path d="M${-w / 2},4 L${f(-w / 3)},${-len} L0,${-len - 8} L${f(w / 3)},${-len} L${w / 2},4 Z" transform="translate(0,-386) rotate(${f(ang)})"/>`;
    if (pt === 'heure') g += aig(0, 30, 8);
    if (pt === 'minute') g += aig(0, 46, 5);
    if (corps) {
      g += `<path d="M-56,-290 L56,-290 L60,-312 L-60,-312 Z"/>`;
      // cadran : disque, fenêtre ronde, graduations et aiguilles dans la fenêtre
      g += `<path fill-rule="evenodd" d="${disque(0, -386, 80)} ${disque(0, -386, 58)}"/>`;
      if (p.papier) g += `<circle cx="0" cy="-386" r="58.5" fill="${p.papier}"/>`;   // cadran de papier, sous la lumière de sa case
      for (let i = 0; i < 12; i++) {
        const a = rad(i * 30), r0 = 48, r1 = i % 3 === 0 ? 58 : 54;
        g += `<path d="M${f(Math.sin(a) * r0 - 2)},${f(-386 - Math.cos(a) * r0)} L${f(Math.sin(a) * r1 - 2)},${f(-386 - Math.cos(a) * r1)} L${f(Math.sin(a) * r1 + 2)},${f(-386 - Math.cos(a) * r1)} L${f(Math.sin(a) * r0 + 2)},${f(-386 - Math.cos(a) * r0)} Z"/>`;
      }
      if (tout) g += aig(p.heure, 30, 8) + aig(p.minute, 46, 5);
      g += `<circle cx="0" cy="-386" r="7"/>`;
      // couronne à pommeaux
      g += `<path d="M-74,-430 C-52,-486 52,-486 74,-430 C60,-446 30,-458 0,-458 C-30,-458 -60,-446 -74,-430 Z"/>`;
      g += `<circle cx="-70" cy="-440" r="9"/><circle cx="70" cy="-440" r="9"/><circle cx="0" cy="-482" r="11"/>`;
      // bras courts sur tiges, mains rondes
      const arm = (sx, sy, [sh, el]) => {
        const [u, ex, ey] = seg(sx, sy, 52, 9, 8, sh);
        const [fa, wx, wy] = seg(ex, ey, 46, 8, 7, sh + el);
        return u + fa + `<g transform="translate(${f(wx)},${f(wy)}) rotate(${f(sh + el)})"><path d="M-7,0 L-7,13 A7,7 0 0 0 7,13 L7,0 Z"/></g>` + (p.rivets ? rivet(ex, ey, 2.4) : '');
      };
      g += arm(-88, -190, p.armL) + arm(88, -190, p.armR);
      if (p.rivets) g += rivet(-88, -190, 3) + rivet(88, -190, 3);

  }
  /* pièces mobiles de l'horloge : [partie, paramètre et signe de son angle, pivot (repère de l'horloge, avant l'échelle)] */
  const PIECES_HORLOGE = [['roueG', 'roue', 1, -48, -21], ['roueD', 'roue', 1, 48, -21], ['balancier', 'balancier', 1, 0, -262],
    ['engr1', 'engr', 1, -14, -232], ['engr2', 'engr', -9 / 7, 14, -214], ['heure', 'heure', 1, 0, -386], ['minute', 'minute', 1, 0, -386]];
  /* centre de la lentille du balancier, dans le repère de la scène (avant la rotation « penche ») */
  function lentille(o) {
    const p = Object.assign({ x: 0, y: 0, s: 0.70, balancier: 8 }, o);
    return [p.x - 132 * Math.sin(rad(p.balancier)) * p.s, p.y + (-262 + 132 * Math.cos(rad(p.balancier))) * p.s];
  }
  /* main d'un bras de l'horloge ('L' gauche, 'R' droite), repère de la scène */
  function mainHorloge(o, bras = 'R') {
    const p = Object.assign({ x: 0, y: 0, s: 0.70, armL: [24, -30], armR: [-24, 30] }, o);
    const [sx, sy] = bras === 'L' ? HORLOGE.epaL : HORLOGE.epaR, [sh, el] = bras === 'L' ? p.armL : p.armR;
    const ex = sx - 52 * Math.sin(rad(sh)), ey = sy + 52 * Math.cos(rad(sh));
    return [p.x + (ex - 46 * Math.sin(rad(sh + el))) * p.s, p.y + (ey + 46 * Math.cos(rad(sh + el)) + 10) * p.s];
  }

  /* ---------- chaîne de papier (maillons ajourés rx 9, ry 14, pas 19), posés à pas constant le long d'une polyligne */
  function chaine(pts, o = {}) {
    const p = Object.assign({ pas: 19, rx: 9, ry: 14, fill: C.ombre }, o);
    let g = '', k = 0, reste = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
      const Ls = Math.hypot(x1 - x0, y1 - y0);
      if (Ls < 1e-6) continue;
      const ang = Math.atan2(y1 - y0, x1 - x0) * 180 / Math.PI;
      let d = reste;
      while (d <= Ls) {
        const t = d / Ls, x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t;
        const plat = k % 2 === 1, rx = plat ? p.rx * 0.35 : p.rx, ry = p.ry;
        g += `<path fill-rule="evenodd" transform="translate(${f(x)},${f(y)}) rotate(${f(ang - 90)})" d="M0,${-ry} C${f(rx * 1.3)},${-ry} ${f(rx * 1.3)},${ry} 0,${ry} C${f(-rx * 1.3)},${ry} ${f(-rx * 1.3)},${-ry} 0,${-ry} Z ` +
          (plat ? '' : `M0,${-ry + 5} C${f((rx - 5) * 1.3)},${-ry + 5} ${f((rx - 5) * 1.3)},${ry - 5} 0,${ry - 5} C${f(-(rx - 5) * 1.3)},${ry - 5} ${f(-(rx - 5) * 1.3)},${-ry + 5} 0,${-ry + 5} Z`) + `"/>`;
        k++; d += p.pas;
      }
      reste = d - Ls;
    }
    return `<g fill="${p.fill}">${g}</g>`;
  }
  /* points d'une chaîne pendue entre a et b (chaînette approchée) : longueur libre, tension 0 (mou) à 1 (droite) */
  function courbeChaine(a, b, longueur = 360, tension = 0) {
    const d = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const fl = d < longueur ? Math.sqrt((longueur / 2) ** 2 - (d / 2) ** 2) * 0.55 : 0;
    const sag = Math.max(3, fl * (1 - borne(tension)));
    const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + 2 * sag], pts = [];
    for (let i = 0; i <= 12; i++) { const t = i / 12, u = 1 - t; pts.push([u * u * a[0] + 2 * u * t * m[0] + t * t * b[0], u * u * a[1] + 2 * u * t * m[1] + t * t * b[1]]); }
    return pts;
  }

  /* ---------- devis : pile vue de profil (lames de 7 u, léger désordre tiré d'une graine), feuille de face ajourée de colonnes */
  function pile(x, y, n, o = {}) {
    const p = Object.assign({ w: 118, h: 7, gap: 1.6, seed: 3, fill: C.ombre }, o);
    const r = R(p.seed); let g = '', yy = y;
    for (let i = 0; i < n; i++) {
      const dx = (r() - 0.5) * 14, w = p.w * (0.92 + r() * 0.12), rot = (r() - 0.5) * 2.4;
      g += `<rect x="${f(x - w / 2 + dx)}" y="${f(yy - p.h)}" width="${f(w)}" height="${p.h}" transform="rotate(${f(rot)},${f(x)},${f(yy)})"/>`;
      yy -= p.h + p.gap;
    }
    return `<g fill="${p.fill}">${g}</g>`;
  }
  function devis(x, y, w = 120, h = 160, rot = 0, fill = C.ombre) {
    let d = `M0,0 L${w},0 L${w},${h} L0,${h} Z `;
    const lignes = Math.max(3, Math.floor((h - 30) / 18));
    for (let r = 0; r < lignes; r++) {
      const yy = 22 * h / 160 + r * 18 * h / 160, e = Math.max(3, 6 * h / 160);
      d += `M${f(w * 0.1)},${f(yy)} L${f(w * 0.5)},${f(yy)} L${f(w * 0.5)},${f(yy + e)} L${f(w * 0.1)},${f(yy + e)} Z M${f(w * 0.68)},${f(yy)} L${f(w * 0.9)},${f(yy)} L${f(w * 0.9)},${f(yy + e)} L${f(w * 0.68)},${f(yy + e)} Z `;
    }
    return `<path fill="${fill}" fill-rule="evenodd" transform="translate(${f(x)},${f(y)}) rotate(${f(rot)})" d="${d}"/>`;
  }
  /* feuille simple qui tourne (pas le devis ajouré) : rectangle centré, coin corné ; flip = largeur apparente (−1 à 1) */
  function feuilleSimple(x, y, w, h, rot = 0, flip = 1, fill = C.ombre) {
    const k = Math.abs(flip) < 0.06 ? 0.06 * Math.sign(flip || 1) : flip;
    return `<g transform="translate(${f(x)},${f(y)}) rotate(${f(rot)}) scale(${f(k * 100) / 100},1)" fill="${fill}">` +
      `<path d="M${f(-w / 2)},${f(-h / 2)} L${f(w / 2 - 9)},${f(-h / 2)} L${f(w / 2)},${f(-h / 2 + 9)} L${f(w / 2)},${f(h / 2)} L${f(-w / 2)},${f(h / 2)} Z"/></g>`;
  }

  /* feuille posée au sol, vue de profil : 3 u d'épaisseur à plat, le bout qui se relève et se corne (lisible sur la lumière
     du sol) ; flip -1 : le bout relevé à gauche */
  function feuilleSol(w = 66, flip = 1) {

      `L${f(w / 2 - 1)},-15 C${f(w / 2 - 4)},-8 ${f(w / 2 - 9)},-4.5 ${f(w / 2 - 17)},-4.5 L${f(-w / 2)},-4.5 Z"/></g>`;
  }

  /* ---------- le petit dinosaure sous son champignon (papier découpé, œil et pois ajourés) */
  function dino(x, y, s = 1, fill = C.ombre, o = {}) {
    let g = '';
    if (o.champignon !== false) {
      g += `<path d="M-92,-176 C-96,-120 -100,-56 -108,0 L-52,0 C-58,-56 -62,-120 -62,-176 Z"/>`;
      g += `<path fill-rule="evenodd" d="M-196,-170 C-188,-268 54,-268 62,-170 C10,-160 -144,-160 -196,-170 Z ${disque(-140, -196, 12)} ${disque(-86, -228, 15)} ${disque(-26, -206, 11)} ${disque(24, -184, 8)} ${disque(-176, -178, 7)}"/>`;

    g += `<rect x="-38" y="-16" width="15" height="16" rx="5"/><rect x="-16" y="-16" width="15" height="16" rx="5"/><rect x="14" y="-16" width="15" height="16" rx="5"/><rect x="32" y="-16" width="15" height="16" rx="5"/>`;

  /* tracés du second dinosaure (lignes d'or) : polylignes échantillonnées, dans l'ordre cou, dos, queue, pattes, champignon, œil */
  const TRACES_DINO = ['M-104,-12 C-84,-16 -66,-22 -56,-30 C-60,-60 -30,-80 6,-78 C28,-77 40,-74 48,-86 C56,-104 60,-124 74,-138 C84,-146 100,-144 104,-132 C106,-124 100,-118 90,-118 C80,-118 74,-112 72,-100 C70,-80 64,-56 56,-40 C52,-22 40,-12 24,-10 L-40,-10 C-60,-10 -84,-8 -104,-12',
    'M-44,-62 L-38,-80 L-30,-68 L-22,-84 L-14,-72 L-6,-86 L2,-75', 'M-30,-10 L-30,4 M-8,-10 L-8,4 M22,-10 L22,4 M40,-12 L40,4',
    'M-196,-170 C-188,-268 54,-268 62,-170 C10,-160 -144,-160 -196,-170', 'M-92,-168 C-96,-120 -100,-56 -106,4 M-62,-168 C-60,-120 -58,-56 -54,4',
    'M-150,6 L90,6', 'M90,-133 L93,-133'];

  /* ---------- arbre nu (branches récursives), herbes, clôture, tige de marionnette */
  function arbre(x, y, h, seed = 1, o = {}) {
    const p = Object.assign({ fill: C.ombre, lean: 0, depth: 6, w: h * 0.07 }, o);
    const r = R(seed); let d = '';
    const branch = (bx, by, len, ang, w, dep) => {
      const ex = bx + len * Math.sin(rad(ang)), ey = by - len * Math.cos(rad(ang));
      const nx = Math.cos(rad(ang)), ny = Math.sin(rad(ang));

        const it = typeof it0 === 'string' ? { nom: it0 } : it0, def = AVANT[it.nom]; if (!def || it.nom === 'fumee') continue;
        const v = spriteAvant(it.nom, pal), q = v.__pose, img = v[Math.floor(h01(Math.floor(ii / 2) * 31 + it.nom.length) * 2) % 2];
        const xs = def.repete ? (() => { const out = []; for (let x = def.repete[0]; x < def.repete[1]; x += def.repete[2]) out.push(x); return out; })() : [0];
        for (const [k, x0] of xs.entries()) {
          const dx = (it.x !== undefined ? it.x - (def.bb[0] + def.bb[2]) / 2 : 0) + x0, dy = it.y || 0, fl = def.repete && k % 2 ? -1 : 1;
          const cx = (q.ox + q.w / q.d / 2);
          const m = chaineM(M1, Mx.tr(dx + (fl < 0 ? 2 * cx : 0), dy), Mx.ech(fl, 1), Mx.tr(q.ox, q.oy), Mx.ech(1 / q.d));
          const xa = m[4], xb = m[4] + m[0] * q.w, ya = m[5], ybas = m[5] + m[3] * q.h;
          if (Math.max(xa, xb) < 0 || Math.min(xa, xb) > L || ybas < 0 || ya > yb) continue;
          // aucun objet flou de plus de 1 800 px de large (frame.md § depth) : signalé, puis écarté
          const larg = Math.abs(m[0]) * q.w - 2 * (Math.ceil(def.flou * (def.d || D1) / SIG1 * 2.6) + 2) * Math.abs(m[0]);
          if (larg > 1800) { avis('plan1:' + it.nom, `avant-plan « ${it.nom} » de ${Math.round(larg)} px (> 1 800 px) : écarté ; desserrer le cadrage`); continue; }
          ctx.setTransform(m[0], m[1], m[2], m[3], m[4], m[5]); ctx.globalAlpha = it.alpha ?? 1;
          ctx.drawImage(img, 0, 0);
          ctx.globalAlpha = 1;
        }
      }
      if (O.fumee) fumee(ctx, M1, O.fumee, ii, pal);
      ctx.restore();
    }

    const inst = { racine, prefixe, dessiner, elements: { ecran, sous: hSous, preuve: hPreuve, fin: hFin, noir: hNoir, calques },
      phrases(liste) { sous = SousTitres(hSous, liste); } };
    inst.pret = preparer().catch((err) => { console.error('kit ombres : préparation interrompue :', err && err.stack || err); pret = true; return inst; });
    return inst;
  }
  /* la lumière du soir qui entre par la porte : trapèze au sol et lueur autour du chambranle, flou pré-rendu */
  function spriteLumierePorte() {
    return tex('lumiere-porte', () => {
      const S = { x0: 250, y0: 470, x1: 1000, y1: 905, d: 0.8 };
      const w = (S.x1 - S.x0) * S.d, h = (S.y1 - S.y0) * S.d, net = toileHE(w, h), c3 = net.getContext('2d');
      c3.setTransform(S.d, 0, 0, S.d, -S.x0 * S.d, -S.y0 * S.d);
      const g = c3.createRadialGradient(415, 780, 20, 415, 780, 330); g.addColorStop(0, 'rgba(255,244,218,.55)'); g.addColorStop(1, 'rgba(255,244,218,0)');
      c3.fillStyle = g; c3.fillRect(S.x0, S.y0, S.x1 - S.x0, S.y1 - S.y0);
      c3.fillStyle = 'rgba(255,244,218,1)'; c3.globalAlpha = 0.5; c3.beginPath(); c3.moveTo(494, 900); c3.lineTo(494, 600); c3.lineTo(560, 640); c3.lineTo(900, 900); c3.closePath(); c3.fill();
      c3.globalAlpha = 1; c3.beginPath(); c3.moveTo(336, 900); c3.lineTo(494, 900); c3.lineTo(800, 900); c3.lineTo(580, 866); c3.lineTo(380, 874); c3.closePath(); c3.fill();
      const c = toileHE(w, h), x = c.getContext('2d'); x.filter = 'blur(9px)'; x.drawImage(net, 0, 0); x.filter = 'none';
      c.__pose = { ox: S.x0, oy: S.y0, d: S.d };
      return c;
    });
  }

  return {
    L, H, IPS, IPS_POSE, SOL, C, MONDE, ARBRE, f, rad, borne, lerp, R, h01, courbe, piste, amortie, tPose, Mx, ik, cam, trajet, flamme, crans,
    sigma, largeurMot, mesurerMot, LIGNES_PREUVE,
    kit: { seg, rivet, disque, pere, mainPere, fille, horloge, roue, engrenage, lentille, mainHorloge, chaine, courbeChaine, pile, devis, feuilleSimple,
      dino, arbre, herbes, cloture, tige, lampe, table, chaise, tabouret, balancoire, oiseau, balle, dossier, carteDessin },
    poses: { pere: POSES_PERE, fille: POSES_FILLE, marchePere, marcheFille }, placerPere, placerFille, placerHorloge,
    creer,
    /* branchement d'une séquence sur sa timeline HyperFrames (le seul câblage à utiliser) : dans om.pret.then, crée la
       timeline en pause avec un proxy { t } dont le setter dessine (dédoublonné à 1/240 s : un seek, même avec
       suppressEvents, donne exactement un dessin), laisse la séquence y ajouter ses tweens (construire(tl, proxy)), dessine
       t = 0, PUIS enregistre window.__timelines[id] = tl en dernier et appelle window.__hfForceTimelineRebind().
       Rend une promesse de la timeline. */
    brancher(om, id, duree, etatDe, construire) {
      return om.pret.then(() => {
        const g = window.gsap; if (!g) throw new Error('kit ombres : GSAP absent de la page');
        let dernier = null;
        const dessiner = (t) => { const k = Math.round(t * 240); if (k === dernier) return; dernier = k; om.dessiner(etatDe(t)); };
        const proxy = { _t: 0 };
        Object.defineProperty(proxy, 't', { get() { return this._t; }, set(v) { this._t = v; dessiner(v); }, enumerable: true });
        const tl = g.timeline({ paused: true });
        tl.to(proxy, { t: duree, duration: duree, ease: 'none', onUpdate: () => dessiner(proxy._t) }, 0);
        if (construire) construire(tl, proxy);
        dessiner(0);
        window.__timelines = window.__timelines || {};
        window.__timelines[id] = tl;
        if (typeof window.__hfForceTimelineRebind === 'function') window.__hfForceTimelineRebind();
        return tl;
      }).catch((e) => { console.error('kit ombres : branchement de la timeline impossible :', e && e.stack || e); throw e; });
    },
    /* contrôle : textures partagées (et copies d'exécution « derive: »), poids PNG et poids décodé (RVBA, ce que la page
       garde en mémoire) ; budget : 25 Mo décodés par texture, 250 Mo pour la page (textures + sprites dorés) */
    textures() {
      const out = []; let png = 0, octets = 0;
      for (const [nom, v] of Object.entries(TEX)) {
        const liste = Array.isArray(v) ? v : [v];
        liste.forEach((cv, i) => { if (cv && cv.toDataURL) { const u = cv.toDataURL('image/png'), p = Math.round((u.length - 22) * 3 / 4), o = cv.width * cv.height * 4;
          png += p; octets += o; out.push({ nom: nom + (liste.length > 1 ? '#' + i : ''), w: cv.width, h: cv.height, png: p, octets: o, depasse: o > 25 * 1048576 }); } });
      }
      const tot = { textures: out.length, png, octets, sprites: G.sprites.size, octetsSprites: G.octetsSprites, budgetPage: 250 * 1048576 };
      tot.depasse = octets + G.octetsSprites > tot.budgetPage;
      return { textures: out, total: tot };
    },
  };
})();
/* ===================== KIT OMBRES : fin du kit JS à copier ===================== */

  /* ===================== séquence 07-idee : état du conte, fonction pure du temps local t ===================== */
  const D = 3.23;
  const racine = document.querySelector('[data-composition-id="07-idee"]');
  const P = OM.piste, K = OM.courbe;

  /* sous-titre : « Le Temps perdu eut alors une [idée] » (pas de point collé à la boîte qui finit la ligne), chaque mot
     une image avant son temps (0 à 2 images d'avance), sorti de 2,60 à 2,74 */
  const MOTS = [['Le', 0.47], ['Temps', 0.67], ['perdu', 0.83], ['eut', 1.17], ['alors', 1.47], ['une', 1.65], ['idée', 1.93]];
  const PHRASES = [{ sortie: [2.60, 2.74], mots: MOTS.map(([m, tm], i) => Object.assign({ m, t: tm - 1 / 30 }, i === MOTS.length - 1 ? { boite: 'b1' } : {})) }];
  const om = OM.creer(racine, 'p07', { phrases: PHRASES, palettes: ['noir'], clip: { start: 0, duration: D, track: 1 } });

  /* caméra : plongée linéaire cam(2780, 690, 1.76) → cam(2780, 632, 1.93) de 0 à 2,10 (le flou 2 px du raccord
     s'éteint en 0,3 s) ; dérive d'échelle +4 %/s de 2,10 à 2,85 ; plongée expo.in vers cam(2780, 630, 2.4) de 2,85 à 3,23,
     sans flou de caméra */
  const CS0 = 1.76, CS1 = 1.93, CS2 = CS1 * (1 + 0.04 * 0.75), CS3 = 2.4;
  function camera(t) {
    let y, s;
    if (t <= 2.10) { const u = Math.max(0, t) / 2.10; y = 690 + (632 - 690) * u; s = CS0 + (CS1 - CS0) * u; }
    else {
      y = 632 + (630 - 632) * Math.min(1, (t - 2.10) / 1.13);
      s = t <= 2.85 ? CS1 * (1 + 0.04 * (t - 2.10)) : CS2 + (CS3 - CS2) * K('expo.in')((t - 2.85) / 0.38);
    }
    return OM.cam(2780, y, s, Math.max(0, 2 * (1 - t / 0.3)), 'zoom');
  }

  /* l'horloge dans le noir (cadran à (2780, 630)) */
  const pBalancier = P([[0, 8], [0.20, 0, 'expo.out'], [2.70, 0], [2.82, -18, 'power2.out'], [3.62, 18, 'sine.inOut']]);   // dernier tic, puis il repart doré
  const pSilhouette = P([[0, 0], [0.30, 0.15, 'power1.out'], [0.83, 0.15], [0.89, 0.27, 'expo.out'], [1.40, 0.15, 'power2.inOut'], [2.10, 0.15], [2.40, 0, 'power2.out']]);
  const pEngr = P([[0, 0], [0.83, 0], [0.93, 14, 'expo.out'], [2.35, 14], [3.23, 74, 'power1.out']]);   // un cran à 0,83 ; +40° en or dès 2,35
  const pLisere = P([[0, 0.15], [0.47, 0.15], [0.62, 0.25, 'power2.out']]);   // « Le » : le liseré respire
  const pClair = P([[0, 0], [0.67, 0], [0.75, 0.16, 'expo.out'], [1.17, 0.16], [1.25, 0.2, 'power2.out']]);   // les aiguilles accrochent la lumière
  const pMinute = P([[0, 160], [0.67, 160], [0.75, 130, 'expo.out'], [1.33, 130], [1.47, 0, 'power3.in']]);   // un cran, puis midi (clac)
  const pHeure = P([[0, -40], [1.17, -40], [1.37, -8, 'power3.out'], [1.40, -8], [1.47, 0, 'power3.in']]);     // se dresse, puis midi (clac)
  const pEtincelle = P([[0, 0], [1.65, 0], [1.73, 1, 'expo.out'], [1.93, 1], [2.05, 0.6, 'power2.out']]);
  const pCadranOr = P([[0, 0], [1.93, 0], [2.03, 1]]);              // linéaire : le kit donne au disque son expo.out (×0,2 → 1)
  const pOrMasque = P([[0, 0], [2.05, 0], [2.10, 0.023], [2.30, 1]]); // la couronne à 2,05, puis l'or descend (expo.out du kit)
  const pFumee = P([[0, 0.12], [2.10, 0.12], [2.85, 0.04, 'power1.inOut'], [3.10, 0, 'power1.in']]);

  function etatDe(t) {
    const c = camera(t), sg = OM.sigma(1.8, c.s);
    // la mèche de la lampe éteinte, hors cadre en bas à gauche : la fumée (plan 1) monte en biais dans le cadre
    const mx = 362 - 40 * t, my = 860 + 8 * t;
    const objets = { fumee: { x: c.x + (mx - 960) / sg, y: c.y + (my - 540) / sg, a: pFumee(t), t, s: 0.35 } };
    // 2,50 : une bouffée de poussière d'or monte autour de l'horloge (24 points, graine fixe)
    if (t >= 2.5) objets.poussiere = { x0: 2640, y0: 380, x1: 2920, y1: 880, n: 24, graine: 3,
      t: 0.4 + 4 * K('power2.out')((t - 2.5) / 0.73), alpha: K('power2.out')((t - 2.5) / 0.12) };
    // 2,85 : la lumière du cadran déborde (rayon 60 → 1 200 px, expo.in) ; pleine dès 3,18 pour la dernière image
    const ul = t < 2.85 ? 0 : K('expo.in')((t - 2.85) / 0.33);
    if (t >= 2.85) objets.lumiereCadran = { x: 2780, y: 630, r: 60 + 1140 * ul, a: K('power1.out')((t - 2.85) / 0.06) };
    return {
      t, cam: c, palette: 'noir', sous: t, vignette: 1 - ul,
      horloge: { x: 2780, heure: pHeure(t), minute: pMinute(t), balancier: pBalancier(t), engr: pEngr(t), lisere: pLisere(t),
        silhouette: pSilhouette(t), clair: pClair(t), etincelle: pEtincelle(t), cadranOr: pCadranOr(t), orMasque: pOrMasque(t) },
      objets,
    };
  }

  // la timeline : un proxy { t } linéaire qui dessine l'état ; enregistrée par le kit APRÈS la préparation
  OM.brancher(om, '07-idee', D, etatDe, (tl) => { tl.set({}, {}, D); });
})();
  </script>
