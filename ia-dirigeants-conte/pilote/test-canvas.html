    ctx.globalAlpha = 1; ctx.drawImage(source, 0, 0);

     cam(x, y, s) amène le point (x, y) du monde au centre du cadre (960, 540) à l'échelle s.

  function grainPlan(graine, moyenne, ecart) {

     l'indice d'image toutes les 2 images ; rects [x, y, w, h] (null = tout l'écran) exprimés sous la matrice Mr
     (par défaut celle du plan ; ex. les ouvertures du plan 2 pour le grain du plan 3 vu à travers elles) */
  function poserGrain(ctx, gr, Mp, ii, rects, Mr = Mp) {
    const g = Math.floor(ii / 2), T = gr.T;

    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    const poser = (x0, y0, x1, y1) => {
      x0 = Math.max(0, x0); y0 = Math.max(0, y0); x1 = Math.min(L, x1); y1 = Math.min(H, y1);

          parent = groupe;
        } else {
          idGroupe = null;
          if (i > 0) div.appendChild(document.createTextNode(' '));
        }
        const sp = document.createElement('span'); sp.className = 'mot'; sp.textContent = mo.m; parent.appendChild(sp);
        rec.mots.push({ el: sp, t: mo.t, etat: '' });

          const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');

          pa.setAttribute('d', 'M0,3.5 Q50,-1.5 100,3.5 L100,4.5 Q50,9.5 0,4.5 Z'); pa.setAttribute('fill', '#C98A2E');

          const [s0, s1] = rec.ph.sortie;
          const sortie = t <= s0 ? 1 : t >= s1 ? 0 : 1 - p1i((t - s0) / (s1 - s0));

    ctx.save();
    ctx.setTransform(M2[0], M2[1], M2[2], M2[3], M2[4], M2[5]); ctx.clip(CLIP3);
    MOTEUR.poserImage(ctx, T.dehors, chaineM(M3, Mx.tr(DEH.x0, DEH.y0), Mx.ech(1 / DEH.d)));
    const s3 = soir(t);
    if (s3 > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(20,11,5,${s3.toFixed(3)})`; ctx.fillRect(0, 0, L, H); }
    MOTEUR.poserGrain(ctx, T.g3, M3, ii, OUVERTURES, M2);   // accroché au plan 3, posé dans les ouvertures du plan 2
    ctx.restore();
    // --- plan 2 : la maison (vecteurs), la lumière du soir, les marionnettes, son grain
    dessinerListe(ctx, T.decor, M2);
    const lp = lumPorte(t) * lum;
    if (lp > 0.01) {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = borne(0.3 * lp);
      MOTEUR.poserImage(ctx, T.spill, chaineM(M2, Mx.tr(SPILL.x0, SPILL.y0), Mx.ech(1 / SPILL.d)));
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    }
    const A = acteurs(idx), tp = idx / IPS_POSE;
    dessinerListe(ctx, A.battant, M2);
    dessinerListe(ctx, T.manteau, chaineM(M2, Mx.tr(640, 562), Mx.rot(angleManteau(tp))));
    dessinerListe(ctx, T.fille[Math.floor(tp / 1.5) % 2], M2);
    dessinerListe(ctx, T.lampe, M2, { lum });
    if (A.feuille) dessinerListe(ctx, A.feuille, M2);
    let lentMonde = null;
    if (A.horloge && t >= 2.52) {
      const xh = xHorloge(tp), u = borne((t - 2.52) / 0.12), e = EASE_APP(u), sc = 1.1 - 0.1 * e, fl = 4 * (1 - e);
      const Mh = chaineM(Mx.tr(xh, 898), Mx.rot(penche(tp)), Mx.ech(sc));
      if (fl > 0.05) MOTEUR.dessinerFlou(ctx, A.horloge, Mx.mul(M2, Mh), [-132, -352, 132, 6], fl);   // paraît ×1,1 et floue 4 px → nette (0,12 s)
      else dessinerListe(ctx, A.horloge, Mx.mul(M2, Mh));
      // 3.66 « Temps » : le cadran accroche la lumière (liseré creme)
      const rim = t < 3.66 ? 0 : t < 3.72 ? (t - 3.66) / 0.06 : Math.max(0.35, 1 - (t - 3.72) / 0.6);
      if (rim > 0) {
        const mm = chaineM(M2, Mh, Mx.ech(0.7));
        ctx.setTransform(mm[0], mm[1], mm[2], mm[3], mm[4], mm[5]); ctx.globalAlpha = borne(rim * lum * 0.9);
        ctx.strokeStyle = '#FFF4DC'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(0, -386, 81, rad(196), rad(300)); ctx.stroke(); ctx.globalAlpha = 1;
      }
      lentMonde = Mx.app(Mh, A.lent[0], A.lent[1]);
    }
    dessinerListe(ctx, A.pere, M2);
    // la chaîne : un bout pend au poignet arrière ; à 3.41 elle se tend maillon par maillon depuis le balancier
    const pb = A.poignetB;
    if (lentMonde && t >= 3.41) {
      const ch = chaineDe(idx, lentMonde, pb), n = Math.min(ch.length, 1 + Math.floor((t - 3.41) / 0.015 + 1e-6));
      dessinerListe(ctx, ch, M2, { fin: n });
      if (n < ch.length) dessinerListe(ctx, bouchonChaine(idx, pb), M2);
    } else dessinerListe(ctx, bouchonChaine(idx, pb), M2);
    MOTEUR.poserGrain(ctx, T.g2, M2, ii, GRAIN2);
    // --- plan 1 : l'avant-plan sombre et flou, coupé par les bords du cadre (grain cuit, variante toutes les 2 images)
    const M1 = P1.matrice(cam, REF);
    MOTEUR.poserSprite(ctx, T.montant, M1, ii, 1);
    MOTEUR.poserSprite(ctx, T.portemanteau, M1, ii, 2);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  function dessiner(tBrut) {
    if (!PRET) return;
    const cle = Math.round(tBrut * 240);
    if (cle === derniere) return;
    derniere = cle;
    const t = Math.min(DUREE, Math.max(0, cle / 240));
    const ii = Math.floor(t * IPS + 1e-4), idx = Math.floor(t * IPS_POSE + 1e-6);
    const cam = camera(t), lum = MOTEUR.flamme(t) * vacille(t);
    if (cam.flou > 0.25) {
      // whip : le monde est peint hors écran puis posé en tirages décalés (flou de caméra, seulement sous l'échelle 3)
      peindreMonde(ctxM, t, ii, idx, lum);
      MOTEUR.flouTirages(ctxE, cMonde, cam.flou, Math.min(12, 2 + Math.ceil(2 * cam.flou / 1.5)));
    } else peindreMonde(ctxE, t, ii, idx, lum);
    // flamme et vignettage chaud, fixé à l'objectif
    MOTEUR.poserVignette(ctxE, T.vignette, lum);
    sousTitres.maj(t);
  }

  /* ---------------- démarrage : polices chargées, textures prêtes, puis UNE timeline enregistrée ---------------- */
  document.fonts.load('500 60px "DM Sans"').then(() => document.fonts.ready).then(() => {
    construire();
    sousTitres = MOTEUR.SousTitres(document.getElementById('sous-titres'), SOUS);
    PRET = true;
    const tl = MOTEUR.brancher(DUREE, dessiner);
    dessiner(0);
    window.__timelines = window.__timelines || {};
    window.__timelines['main'] = tl;
  }).catch((e) => console.error('construction du film impossible :', e && e.stack || e));
})();
</script>
