<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>A1 · La maison en coupe · 4,2 s</title>
<link rel="stylesheet" href="_base.css"></head>
<body><div class="stage"><svg class="scene" id="s" viewBox="0 0 1920 1080"></svg>
<div class="sub">Derrière lui, le <span class="k">Temps perdu</span> passa la porte.</div></div>
<script src="_ombres.js"></script><script>
/* A1, 4,2 s : « Derrière lui, le Temps perdu passa la porte. »
   La maison du père en coupe, maison de poupée de papier posée devant la toile. La caméra glisse vers la droite
   (travelling latéral lent) ; l'horloge roule dans l'encadrement de la porte, la chaîne tendue jusqu'au poignet. */
const O = OMBRES, C = O.C;
let s = O.defs({ x: 700, y: 520, r: 1250 }) + O.toile();

// 4. fond : le jardin au crépuscule, à gauche de la maison, dans la brume (loin de la toile, donc flou)
s += O.brume(120, 640, 360, 220, .55, C.brume, 34);
s += `<g filter="url(#b4)" opacity=".75">${O.arbre(70, 900, 640, 9, { fill: C.brume2 })}${O.cloture(-20, 200, 900, 120, 6, C.brume2)}</g>`;
s += `<g opacity=".8">${O.corbeau(118, 330, .9, 8, C.brume2)}</g>`;

// la maison en coupe : un cadre brun noir percé de pièces où passe la lumière de la toile
const H = { x0: 196, x1: 2140, y0: 92, y1: 948 };
const piece = (x0, y0, x1, y1) => `M${x0},${y0} L${x1},${y0} L${x1},${y1} L${x0},${y1} Z `;
let d = piece(H.x0, H.y0, H.x1, H.y1);
d += piece(258, 438, 838, 900);       // entrée
d += piece(196, 600, 258, 900);       // porte ouverte dans le mur
d += piece(884, 438, 1540, 900);      // salon
d += piece(1588, 438, 2140, 900);     // cuisine (coupée par le bord du cadre)
d += piece(258, 132, 1010, 392);      // chambre
d += piece(1058, 132, 1540, 392);     // bureau
d += piece(1588, 132, 2140, 392);
s += `<path fill="${C.ombre}" fill-rule="evenodd" d="${d}"/>`;
// toit (coupé en haut du cadre) et cheminée
s += `<path fill="${C.ombre}" d="M150,96 L1180,-260 L2200,96 L2200,104 L150,104 Z"/>`;
// lumière des pièces : l'entrée reste claire, les autres pièces baissent
const voileP = (x0, y0, x1, y1, a) => `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="#140B05" opacity="${a}"/>`;
s += voileP(884, 438, 1540, 900, .2) + voileP(1588, 438, 2140, 900, .34) + voileP(258, 132, 1010, 392, .46) + voileP(1058, 132, 1540, 392, .4) + voileP(1588, 132, 2140, 392, .5);

// mobilier du décor (net, contre la toile)
const fenetre = (x, y, w, h) => `<g fill="${C.ombre}"><path fill-rule="evenodd" d="M${x},${y} h${w} v${h} h${-w} Z M${x + 10},${y + 10} h${w / 2 - 14} v${h / 2 - 14} h${-(w / 2 - 14)} Z M${x + w / 2 + 4},${y + 10} h${w / 2 - 14} v${h / 2 - 14} h${-(w / 2 - 14)} Z M${x + 10},${y + h / 2 + 4} h${w / 2 - 14} v${h / 2 - 14} h${-(w / 2 - 14)} Z M${x + w / 2 + 4},${y + h / 2 + 4} h${w / 2 - 14} v${h / 2 - 14} h${-(w / 2 - 14)} Z"/></g>`;
s += fenetre(905, 468, 190, 200);
s += `<g opacity=".9">${O.balancoire(1000, 478, 640, 0, C.ombre2)}</g>`;              // la balançoire du jardin, vue par la fenêtre du salon
s += `<path fill="${C.ombre}" d="M1540,900 L1540,438 L1520,438 L1520,470 L1460,470 L1460,530 L1400,530 L1400,590 L1340,590 L1340,650 L1280,650 L1280,710 L1220,710 L1220,770 L1160,770 L1160,830 L1100,830 L1100,900 Z"/>`;  // escalier
s += `<path fill="${C.ombre}" d="M1130,820 L1134,610 L1140,610 L1140,820 Z"/>`;  // rampe
s += O.table(1010, 900, 170, 104) + O.lampe(990, 794, .8, true);
s += `<g fill="${C.ombre}"><rect x="430" y="470" width="80" height="8"/><circle cx="446" cy="486" r="7"/><circle cx="476" cy="486" r="7"/><path d="M468,486 L490,486 L500,610 L458,610 Z"/></g>`;  // patère et manteau suspendu
s += `<g fill="${C.ombre}"><path d="M400,392 L400,250 C400,236 412,232 424,232 L436,232 L436,320 L760,320 L760,300 L776,300 L776,392 L760,392 L760,350 L416,350 L416,392 Z"/><path d="M450,320 C452,300 470,292 500,294 L520,320 Z"/></g>`; // lit de la chambre
s += O.pile(1720, 900, 26, { w: 170, seed: 9 }) + O.pile(1900, 900, 34, { w: 150, seed: 12 }); // la cuisine déjà pleine de dossiers

// 2. personnages nets : le père entre, la pile de devis sous le bras ; l'horloge roule dans la porte
const P = { x: 610, y: 898, s: .74, armF: [-30, -96], armB: [22, -6], legF: [-20, 12], legB: [18, 4] };
s += O.pere(P);
const [hx, hy] = O.mainPere(P, 'F');
s += O.pile(hx + 28, hy + 10, 14, { w: 118, h: 7, gap: 1.6, seed: 5 });
const Hc = { x: 330, y: 898, s: .72, balancier: 14, heure: -40, minute: 130, armL: [40, -40], armR: [-60, 20] };
// mouvement suggéré : deux échos pâles de l'horloge qui roule
s += `<g opacity=".14" filter="url(#b4)">${O.horloge(Object.assign({}, Hc, { x: 250 }))}</g><g opacity=".22" filter="url(#b2_5)">${O.horloge(Object.assign({}, Hc, { x: 292 }))}</g>`;
s += `<g transform="rotate(-3,330,898)">${O.horloge(Hc)}</g>`;
const [bx, by] = O.mainPere(P, 'B');
const [lx, ly] = O.lentille(Hc);
s += O.chaine([[bx, by], [bx - 70, by + 80], [lx + 90, ly + 30], [lx + 6, ly]], { rx: 9, ry: 14, pas: 19 });

// 1. avant-plan : montant de porte et plante, flous, coupés par le bord du cadre
s += `<g filter="url(#b14)" fill="#0E0805"><rect x="-40" y="-20" width="120" height="1120"/>` +
  `<path d="M60,1080 C80,940 140,860 230,820 C170,880 150,960 160,1080 Z M120,1080 C150,930 230,880 320,870 C250,920 220,990 230,1080 Z"/></g>`;
s += `<g filter="url(#b22)" fill="#0E0805"><path d="M1820,-40 L1920,-40 L1920,1120 L1860,1120 C1830,700 1800,300 1820,-40 Z"/></g>`;
// sol au premier plan (bande des sous-titres)
s += `<rect x="0" y="940" width="1920" height="140" fill="#0F0905"/>`;
s += O.voile();
document.getElementById('s').innerHTML = s;
</script></body></html>
