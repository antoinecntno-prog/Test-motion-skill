<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>A2 · La maison en coupe · 19,6 s</title>
<link rel="stylesheet" href="_base.css"></head>
<body><div class="stage"><svg class="scene" id="s" viewBox="0 0 1920 1080"></svg>
<div class="sub">IA voulait dire <span class="k">Interminable Attente</span>.</div></div>
<script src="_ombres.js"></script><script>
/* A2, 19,6 s : « Pour sa fille, IA voulait dire Interminable Attente. »
   La caméra est montée à l'étage de la maison en coupe. Sur la dernière marche, la fillette attend, le menton dans
   les mains ; au-dessus d'elle, les lettres de papier I et A se déplient en accordéon. Dans la case voisine, le père
   penché sur ses devis s'est éloigné de la toile : ombre plus grande, floue et pâle. Au fond du couloir, l'horloge
   bat. Les autres cases sont éteintes. */
const O = OMBRES, C = O.C;
const f = (n) => Math.round(n * 10) / 10;
const ctx = document.createElement('canvas').getContext('2d');
const larg = (t, size) => { ctx.font = `700 ${size}px Fraunces`; return ctx.measureText(t).width; };

/* Mot de papier qui se déplie en accordéon depuis sa grande capitale (O.lettres).
   plis[i] : ouverture du panneau i (1 = à plat, < 1 = encore plié, le panneau s'incline en zigzag). */
function mot(cap, reste, x, y, capSize, size, plis) {
  const wc = larg(cap, capSize);
  let g = O.lettres(cap, x, y, capSize, { anchor: 'middle', fils: false });
  g += `<rect x="${f(x - wc / 2 - 8)}" y="${y + 8}" width="${f(wc + 16)}" height="7" fill="${C.ombre}"/>`;
  let cx = x + wc / 2 + 6, cy = y;
  const panneaux = [];
  for (let i = 0; i < reste.length; i++) {
    const ch = reste[i], w = larg(ch, size) + 3, k = plis[i] === undefined ? 1 : plis[i];
    const sk = k < 1 ? (1 - k) * 34 * (i % 2 ? 1 : -1) : 0;
    const tr = `translate(${f(cx)},${f(cy)}) skewY(${f(sk)}) scale(${f(k * 100) / 100},1)`;
    panneaux.push({ k, tr, cx, cy, svg: `<text x="1" y="0" font-family="Fraunces" font-weight="700" font-size="${size}">${ch}</text>` +
      `<rect x="0" y="8" width="${f(w)}" height="7"/>` });
    cx += w * k; cy += w * k * Math.tan(sk * Math.PI / 180);
  }
  // écho pâle de la queue encore pliée : elle était plus à gauche il y a un instant
  let echo = '';
  for (const p of panneaux) if (p.k < 1) echo += `<g transform="translate(-34,-4)"><g transform="${p.tr}">${p.svg}</g></g>`;
  g += `<g fill="${C.ombre}" opacity=".16" filter="url(#mbx)">${echo}</g>`;
  for (const p of panneaux) g += `<g fill="${C.ombre}" transform="${p.tr}"${p.k < .8 ? ' filter="url(#mbx2)"' : ''}>${p.svg}</g>`;
  return { svg: g, fin: [cx, cy], debut: x };
}

function build() {
  let s = O.defs({ x: 470, y: 400, r: 1300 }) + O.toile();
  s += `<defs>
<filter id="mbx" x="-30%" y="-20%" width="160%" height="140%"><feGaussianBlur stdDeviation="7 1"/></filter>
<filter id="mbx2" x="-30%" y="-20%" width="160%" height="140%"><feGaussianBlur stdDeviation="2.2 0"/></filter>
<clipPath id="clipBureau"><rect x="1010" y="118" width="490" height="602"/></clipPath>
<linearGradient id="descente" x1="0" y1="720" x2="0" y2="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#140B05" stop-opacity="0"/><stop offset=".38" stop-color="#140B05" stop-opacity=".22"/><stop offset="1" stop-color="#140B05" stop-opacity=".88"/></linearGradient>
<linearGradient id="couloir" x1="1550" y1="0" x2="1900" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#140B05" stop-opacity=".7"/><stop offset=".55" stop-color="#140B05" stop-opacity=".38"/><stop offset="1" stop-color="#140B05" stop-opacity=".22"/></linearGradient>
</defs>`;

  // 3. brume : poussière de lumière dans la cage d'escalier, et le couloir lointain
  s += O.brume(380, 690, 420, 80, .22, C.brume, 34);
  s += O.brume(1760, 520, 260, 220, .28, C.brume2, 34);

  // la maison en coupe, à l'étage : une masse brun noir percée de cases
  const piece = (x0, y0, x1, y1) => `M${x0},${y0} L${x1},${y0} L${x1},${y1} L${x0},${y1} Z `;
  let d = piece(-40, -40, 1960, 960);
  d += piece(-40, 118, 960, 720);     // palier et cage d'escalier
  d += piece(650, 720, 960, 900);     // trémie : l'escalier descend vers le salon
  d += piece(1010, 118, 1500, 720);   // bureau du père
  d += piece(1550, 118, 1960, 720);   // couloir
  d += piece(-40, 764, 600, 900);     // entrée, en bas (éteinte)
  d += piece(1010, 764, 1500, 900);   // salon, en bas (éteint)
  d += piece(1550, 764, 1960, 900);   // cuisine, en bas (éteinte)
  s += `<path fill="${C.ombre}" fill-rule="evenodd" d="${d}"/>`;

  // cases éteintes autour, couloir dans la pénombre, bureau à demi-lumière
  const voileP = (x0, y0, x1, y1, a) => `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="#140B05" opacity="${a}"/>`;
  s += voileP(-40, 764, 600, 900, .62) + voileP(1010, 764, 1500, 900, .66) + voileP(1550, 764, 1960, 900, .7);
  s += `<rect x="650" y="720" width="310" height="180" fill="url(#descente)"/>`;
  s += voileP(1010, 118, 1500, 720, .26);
  s += `<rect x="1550" y="118" width="410" height="602" fill="url(#couloir)"/>`;
  // dossiers qui dépassent dans la cuisine éteinte, en bas
  s += `<g opacity=".8">${O.pile(1640, 900, 14, { w: 150, seed: 9 })}${O.pile(1820, 900, 11, { w: 140, seed: 12 })}</g>`;

  // l'escalier qui descend vers la droite depuis le palier, rampe et balustres
  s += `<path fill="${C.ombre}" d="M600,720 L650,720 L650,780 L710,780 L710,840 L770,840 L770,900 L830,900 L830,960 L890,960 L890,1080 L600,1080 Z"/>`;
  let r = `<rect x="726" y="652" width="13" height="190"/><circle cx="732.5" cy="645" r="11"/>`;
  r += `<path d="M736,652 L966,882 L966,896 L736,666 Z"/>`;
  for (const bx of [764, 794, 824, 854, 884]) {
    const tread = 780 + 60 * Math.floor((bx - 650) / 60), rail = bx - 82;
    r += `<rect x="${bx - 2.5}" y="${rail}" width="5" height="${tread - rail}"/>`;
  }
  s += `<g fill="${C.ombre}">${r}</g>`;

  // 3 bis. le bureau : le père loin de la toile (ombre plus grande, floue, pâle), table et devis nets contre la toile
  const X = 1080, sP = 1.05, hipY = 594, lean = 14;
  const P = { x: X, y: hipY + 222 * sP, s: sP, armF: [-24, -40], armB: [-16, -54], legF: [-104, 90], legB: [-98, 86], head: 26 };
  s += `<g clip-path="url(#clipBureau)"><g opacity=".5" filter="url(#b6)">` +
    O.chaise(X - 4, 720, 1.05, 1) +
    `<g transform="rotate(${lean},${X},${hipY})">${O.pere(P)}</g></g></g>`;
  s += O.lampe(X + 330, 540, .78, true);
  s += O.table(X + 230, 720, 300, 180);
  s += O.pile(X + 205, 540, 9, { w: 120, h: 7, gap: 1.6, seed: 21 });
  s += O.pile(X + 92 + 230 - 40, 540, 4, { w: 70, h: 6, gap: 1.4, seed: 4 });

  // 2 bis. au fond du couloir, l'horloge : le balancier bat (échos pâles dans la fenêtre du ventre)
  const Hc = { x: 1706, y: 718, s: .7, balancier: -17, heure: 160, minute: 20, armL: [26, -24], armR: [-26, 24] };
  s += `<g opacity=".4" filter="url(#b1_2)">${O.horloge(Object.assign({}, Hc, { balancier: 0 }))}</g>`;
  s += `<g opacity=".22" filter="url(#b2_5)">${O.horloge(Object.assign({}, Hc, { balancier: 15 }))}</g>`;
  // un peu de lumière au bout du couloir, derrière l'horloge
  s += `<defs><clipPath id="clipCouloir"><rect x="1550" y="118" width="410" height="602"/></clipPath></defs><g clip-path="url(#clipCouloir)"><ellipse cx="1712" cy="560" rx="150" ry="210" fill="#F3DFB6" opacity=".3" filter="url(#b34)"/></g>`;
  // arc du balancier, à peine tracé
  const [ax0, ay0] = O.lentille(Object.assign({}, Hc, { balancier: 18 })), [ax1, ay1] = O.lentille(Object.assign({}, Hc, { balancier: -18 }));
  s += `<path d="M${f(ax0)},${f(ay0)} Q${Hc.x},${f(ay0 + 16)} ${f(ax1)},${f(ay1)}" stroke="${C.ombre}" stroke-width="1.4" stroke-dasharray="2 5" fill="none" opacity=".5"/>`;
  s += O.horloge(Hc);

  // 1 bis. les lettres de papier I et A, en train de se déplier en « Interminable Attente »
  const L1 = mot('I', 'nterminable', 262, 318, 200, 104, [1, 1, 1, 1, 1, 1, 1, 1, .84, .66, .5]);
  const L2 = mot('A', 'ttente', 262, 502, 200, 104, [1, 1, 1, 1, .74, .54]);
  // fils : le I pend au plafond, le A pend sous le I, les queues pendent en biais
  const fil = (x0, y0, x1, y1) => `<path d="M${f(x0)},${f(y0)} L${f(x1)},${f(y1)}" stroke="${C.ombre}" stroke-width="1.6" fill="none"/>`;
  s += fil(262, 176, 262, 118) + fil(262, 334, 262, 362);
  s += fil(L1.fin[0] - 6, L1.fin[1] - 70, L1.fin[0] - 60, 118);
  s += fil(L2.fin[0] - 8, L2.fin[1] - 70, L2.fin[0] - 22, 333);
  s += L1.svg + L2.svg;

  // 2. la fillette, nette contre la toile, assise sur la dernière marche, le menton dans les mains
  s += `<g transform="rotate(7,630,728)">${O.fille({ x: 630, y: 816, s: .8, seated: true, armF: [-60, -141], armB: [-50, -143], head: 10 })}</g>`;

  // 1. avant-plan : un pan de rideau et un montant de porte, flous, coupés par le bord du cadre
  s += `<g filter="url(#b14)" fill="#0E0805"><path d="M-60,-40 L96,-40 C70,200 104,420 74,640 C58,800 92,960 80,1120 L-60,1120 Z"/></g>`;
  s += `<g filter="url(#b22)" fill="#0E0805"><path d="M1846,-40 L1960,-40 L1960,1120 L1872,1120 C1860,700 1836,300 1846,-40 Z"/></g>`;
  // sol au premier plan (bande des sous-titres)
  s += `<rect x="0" y="940" width="1920" height="140" fill="#0F0905"/>`;
  s += O.voile();
  document.getElementById('s').innerHTML = s;
}
build();
document.fonts.load('700 104px Fraunces').then(build, build);
</script></body></html>
