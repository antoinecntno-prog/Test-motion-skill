<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>A2 · La maison en coupe · 19,6 s</title>
<link rel="stylesheet" href="_base.css"></head>
<body><div class="stage"><svg class="scene" id="s" viewBox="0 0 1920 1080"></svg>
<div class="sub">IA voulait dire <span class="k">Interminable Attente</span></div></div>
<script src="_ombres.js"></script><script>
/* A2, 19,6 s : « Pour sa fille, IA voulait dire Interminable Attente. »
   La caméra est montée à l'étage de la maison en coupe. Sur la dernière marche, la fillette attend, le menton dans
   les mains ; au-dessus d'elle, les lettres de papier I et A sont dépliées en « Interminable Attente », droites,
   pendues en mobile sur l'axe commun du I et du A. Dans la case voisine, le père penché sur ses devis s'est éloigné
   de la toile : ombre plus grande, plus pâle, un peu floue, mais son profil reste lisible. Au fond du couloir,
   l'horloge bat. Les autres cases sont éteintes. */
const O = OMBRES, C = O.C;
const f = (n) => Math.round(n * 10) / 10;
const rad = (d) => d * Math.PI / 180;
const ctx = document.createElement('canvas').getContext('2d');
/* Cinématique inverse d'un bras de marionnette du kit : angles [épaule, coude] pour que la main atteigne T
   (repère local), coude vers le bas. */
function ik(S, T, l1, l2) {
  const dx = T[0] - S[0], dy = T[1] - S[1], d = Math.min(Math.hypot(dx, dy), (l1 + l2) * 0.995);
  const base = Math.atan2(-dx, dy), off = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d))));
  let best = null;
  for (const sg of [1, -1]) {
    const sh = base + sg * off, ex = S[0] - l1 * Math.sin(sh), ey = S[1] + l1 * Math.cos(sh);
    const fa = Math.atan2(-(T[0] - ex), T[1] - ey);
    if (!best || ey > best.ey) best = { sh, fa, ey };
  }
  const el = ((((best.fa - best.sh) * 180 / Math.PI) + 540) % 360) - 180;
  return [f(best.sh * 180 / Math.PI), f(el)];
}
const larg = (t, size) => { ctx.font = `700 ${size}px Fraunces`; return ctx.measureText(t).width; };

/* Mot de papier tout déplié : la grande capitale (O.lettres) centrée sur l'axe commun, la suite du mot en une seule
   ligne droite, posée sur une bande de papier. Rend aussi les points d'accroche des cordons. */
const AXE = 236, CAP = 186, BAS = 96;
function mot(cap, reste, y) {
  const wc = larg(cap, CAP), wr = larg(reste, BAS), xr = AXE + wc / 2 + 2;
  let g = O.lettres(cap, AXE, y, CAP, { anchor: 'middle', fils: false });
  g += `<text x="${f(xr)}" y="${y}" font-family="Fraunces" font-weight="700" font-size="${BAS}" fill="${C.ombre}">${reste}</text>`;
  g += `<rect x="${f(AXE - wc / 2 - 10)}" y="${y + 8}" width="${f(xr + wr - (AXE - wc / 2) + 18)}" height="8" fill="${C.ombre}"/>`;
  return { svg: g, droite: xr + wr, haut: y - CAP * 0.69, bande: y + 16 };
}

function build() {
  let s = O.defs({ x: 470, y: 400, r: 1300 }) + O.toile();
  s += `<defs>
<clipPath id="clipBureau"><rect x="1010" y="118" width="490" height="602"/></clipPath>
<linearGradient id="descente" x1="0" y1="720" x2="0" y2="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#140B05" stop-opacity="0"/><stop offset=".38" stop-color="#140B05" stop-opacity=".22"/><stop offset="1" stop-color="#140B05" stop-opacity=".88"/></linearGradient>
<linearGradient id="couloir" x1="1550" y1="0" x2="1900" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#140B05" stop-opacity=".7"/><stop offset=".55" stop-color="#140B05" stop-opacity=".38"/><stop offset="1" stop-color="#140B05" stop-opacity=".22"/></linearGradient>
</defs>`;

  // 3. brume : poussière de lumière dans la cage d'escalier, et le couloir lointain
  s += O.brume(380, 690, 420, 80, .22, C.brume, 34);
  s += O.brume(1760, 520, 260, 220, .28, C.brume2, 34);

  // la maison en coupe, à l'étage : une masse brun noir percée de cases
  const piece = (x0, y0, x1, y1) => `M${x0},${y0} L${x1},${y0} L${x1},${y1} L${x0},${y1} Z `;
  let d = piece(-40, -40, 1960, 960);
  d += piece(-40, 118, 960, 720);     // palier et cage d'escalier
  d += piece(650, 720, 960, 900);     // trémie : l'escalier descend vers le salon
  d += piece(1010, 118, 1500, 720);   // bureau du père
  d += piece(1550, 118, 1960, 720);   // couloir
  d += piece(-40, 764, 600, 900);     // entrée, en bas (éteinte)
  d += piece(1010, 764, 1500, 900);   // salon, en bas (éteint)
  d += piece(1550, 764, 1960, 900);   // cuisine, en bas (éteinte)
  s += `<path fill="${C.ombre}" fill-rule="evenodd" d="${d}"/>`;

  // cases éteintes autour, couloir dans la pénombre, bureau à demi-lumière
  const voileP = (x0, y0, x1, y1, a) => `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="#140B05" opacity="${a}"/>`;
  s += voileP(-40, 764, 600, 900, .62) + voileP(1010, 764, 1500, 900, .66) + voileP(1550, 764, 1960, 900, .7);
  s += `<rect x="650" y="720" width="310" height="180" fill="url(#descente)"/>`;
  s += voileP(1010, 118, 1500, 720, .26);
  s += `<rect x="1550" y="118" width="410" height="602" fill="url(#couloir)"/>`;
  // dossiers qui dépassent dans la cuisine éteinte, en bas
  s += `<g opacity=".8">${O.pile(1640, 900, 14, { w: 150, seed: 9 })}${O.pile(1820, 900, 11, { w: 140, seed: 12 })}</g>`;

  // l'escalier qui descend vers la droite depuis le palier, rampe et balustres
  s += `<path fill="${C.ombre}" d="M600,720 L650,720 L650,780 L710,780 L710,840 L770,840 L770,900 L830,900 L830,960 L890,960 L890,1080 L600,1080 Z"/>`;
  let r = `<rect x="726" y="652" width="13" height="190"/><circle cx="732.5" cy="645" r="11"/>`;
  r += `<path d="M736,652 L966,882 L966,896 L736,666 Z"/>`;
  for (const bx of [764, 794, 824, 854, 884]) {
    const tread = 780 + 60 * Math.floor((bx - 650) / 60), rail = bx - 82;
    r += `<rect x="${bx - 2.5}" y="${rail}" width="5" height="${tread - rail}"/>`;
  }
  s += `<g fill="${C.ombre}">${r}</g>`;

  // 3 bis. le bureau : le père loin de la toile (ombre plus grande, plus pâle, flou léger), table et devis nets.
  // Profil gardé : flou de 4 px, opacité .6, tête droite (le buste penche de 12°, la tête compense), nez et col
  // lisibles (col de manteau relevé, ajouté en extra). Les mains posées sur la pile de devis (cinématique inverse).
  const X = 1070, sP = 1.05, hipY = 594, lean = 12;
  const P = { x: X, y: hipY + 222 * sP, s: sP, legF: [-100, 92], legB: [-94, 86], head: -lean,
    extra: '<path d="M-22,-494 L-16,-520 L-6,-496 Z"/><path d="M8,-497 L30,-512 L28,-488 Z"/>' };
  const versLocal = ([tx, ty]) => { const a = rad(-lean), dx = tx - X, dy = ty - hipY;
    const rx = X + dx * Math.cos(a) - dy * Math.sin(a), ry = hipY + dx * Math.sin(a) + dy * Math.cos(a);
    return [(rx - X) / sP, (ry - P.y) / sP]; };
  P.armF = ik([6, -478], versLocal([1248, 522]), 116, 118);
  P.armB = ik([-2, -478], versLocal([1232, 532]), 116, 118);
  s += `<g clip-path="url(#clipBureau)"><g opacity=".6" filter="url(#b4)">` +
    O.chaise(X - 4, 720, 1.05, 1) +
    `<g transform="rotate(${lean},${X},${hipY})">${O.pere(P)}</g></g></g>`;
  s += O.lampe(X + 334, 540, .78, true);
  s += O.table(X + 234, 720, 300, 180);
  s += O.pile(X + 209, 540, 9, { w: 120, h: 7, gap: 1.6, seed: 21 });
  s += O.pile(X + 286, 540, 4, { w: 70, h: 6, gap: 1.4, seed: 4 });

  // 2 bis. au fond du couloir, l'horloge : le balancier bat. Deux échos du seul balancier, même brun, 13 %,
  // visibles dans la fenêtre du ventre (jamais une seconde horloge).
  const Hc = { x: 1706, y: 718, s: .7, balancier: -15, heure: 160, minute: 20, armL: [26, -24], armR: [-26, 24] };
  s += `<defs><clipPath id="clipCouloir"><rect x="1550" y="118" width="410" height="602"/></clipPath></defs><g clip-path="url(#clipCouloir)"><ellipse cx="1712" cy="560" rx="150" ry="210" fill="#F3DFB6" opacity=".3" filter="url(#b34)"/></g>`;
  const balancier = (ang) => {
    const [lx, ly] = O.lentille(Object.assign({}, Hc, { balancier: ang })), px = Hc.x, py = Hc.y - 262 * Hc.s;
    return `<path d="M${f(px - 1.4)},${f(py)} L${f(px + 1.4)},${f(py)} L${f(lx + 1.4)},${f(ly)} L${f(lx - 1.4)},${f(ly)} Z"/>` +
      `<path fill-rule="evenodd" d="${O.disque(lx, ly, 22 * Hc.s)} ${O.disque(lx, ly, 9 * Hc.s)}"/>`;
  };
  s += `<g fill="${C.ombre}" opacity=".13">${balancier(-3)}${balancier(8)}</g>`;
  s += O.horloge(Hc);

  // 1 bis. les lettres de papier I et A, dépliées en « Interminable Attente » : droites, entières, I et A sur le
  // même axe vertical, « Attente » sous « Interminable ». Le mobile pend au plafond par des cordons de 5 px :
  // plafond, I, A sur l'axe ; un second cordon à la fin de chaque mot.
  const L1 = mot('I', 'nterminable', 302);
  const L2 = mot('A', 'ttente', 474);
  const cordon = (x, y0, y1) => `<path d="M${f(x)},${f(y0)} L${f(x)},${f(y1)}" stroke="${C.ombre}" stroke-width="5" stroke-linecap="round" fill="none"/>`;
  s += cordon(AXE, 112, L1.haut + 4) + cordon(AXE, L1.bande - 2, L2.haut + 6);
  const xe1 = L1.droite - larg('e', BAS) / 2 - 2, xe2 = L2.droite - larg('e', BAS) / 2 - 2;
  s += cordon(xe1, 112, 302 - BAS * 0.48) + cordon(xe2, L1.bande - 2, 474 - BAS * 0.48);
  s += L1.svg + L2.svg;

  // 2. la fillette, nette contre la toile, assise sur la dernière marche, le menton dans les mains
  s += O.fille({ x: 612, y: 720 + 118 * .86, s: .86, seated: true, menton: true, head: 8 });

  // 1. avant-plan : un montant de porte sombre et flou à gauche (x 0 à 120), un autre à droite, coupés par le cadre
  s += `<g filter="url(#b14)" fill="#0E0805"><rect x="-60" y="-40" width="162" height="1160"/>` +
    `<rect x="98" y="-40" width="20" height="1160" fill="#22160C"/></g>`;
  s += `<g filter="url(#b22)" fill="#0E0805"><path d="M1846,-40 L1960,-40 L1960,1120 L1872,1120 C1860,700 1836,300 1846,-40 Z"/></g>`;
  // sol au premier plan (bande des sous-titres)
  s += `<rect x="0" y="940" width="1920" height="140" fill="#0F0905"/>`;
  s += O.voile();
  document.getElementById('s').innerHTML = s;
}
build();
document.fonts.load('700 96px Fraunces').then(build, build);
</script></body></html>
