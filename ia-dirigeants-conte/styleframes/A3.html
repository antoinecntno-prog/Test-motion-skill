<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>A3 · La maison en coupe · 39,5 s</title>
<link rel="stylesheet" href="_base.css"></head>
<body><div class="stage"><svg class="scene" id="s" viewBox="0 0 1920 1080"></svg>
<div class="sub">Le soir suivant, il poussait la <span class="k">balançoire</span></div></div>
<script src="_ombres.js"></script><script>
/* A3, 39,5 s : « Le soir suivant, il poussait la balançoire. »
   Le monde doré : toile assombrie, ciel encore clair au-dessus de l'horizon. La caméra est sortie au jardin : la
   maison en coupe ne tient plus qu'au bord gauche (moins de 30 % de la largeur), cases rallumées. Au jardin, le père
   pousse la balançoire de sa fille : ses deux mains posées à plat sur son dos, silhouettes inversées dorées. Deux
   échos dorés (13 et 12 %) dessinent l'arc devant elle (le balancier devenu balançoire). La branche qui porte la
   balançoire est bordée d'or. Par la fenêtre de la cuisine, l'horloge dorée sort les devis finis, halo baissé
   d'un tiers pour que la balançoire domine. Poussière d'étincelles. */
const O = OMBRES, C = O.C;
const f = (n) => Math.round(n * 10) / 10;
const rad = (d) => d * Math.PI / 180;
const OR = '#E0A84A';

/* Cinématique inverse d'un bras de marionnette du kit : angles [épaule, coude] pour que la main atteigne T
   (repère local), coude vers le bas. */
function ik(S, T, l1, l2) {
  const dx = T[0] - S[0], dy = T[1] - S[1], d = Math.min(Math.hypot(dx, dy), (l1 + l2) * 0.995);
  const base = Math.atan2(-dx, dy), off = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d))));
  let best = null;
  for (const sg of [1, -1]) {
    const sh = base + sg * off, ex = S[0] - l1 * Math.sin(sh), ey = S[1] + l1 * Math.cos(sh);
    const fa = Math.atan2(-(T[0] - ex), T[1] - ey);
    if (!best || ey > best.ey) best = { sh, fa, ey };
  }
  const el = ((((best.fa - best.sh) * 180 / Math.PI) + 540) % 360) - 180;
  return [f(best.sh * 180 / Math.PI), f(el)];
}
const tourne = ([x, y], a, [cx, cy]) => { const c = Math.cos(rad(a)), s2 = Math.sin(rad(a));
  return [cx + (x - cx) * c - (y - cy) * s2, cy + (x - cx) * s2 + (y - cy) * c]; };

let s = O.defs({ x: 1200, y: 700, r: 1500, nuit: true }) + O.toile();
s += `<defs>
<linearGradient id="orPere" gradientUnits="userSpaceOnUse" x1="0" y1="-610" x2="0" y2="0"><stop offset="0" stop-color="#FFE7B0"/><stop offset=".5" stop-color="#E0A84A"/><stop offset="1" stop-color="#C98A2E"/></linearGradient>
<linearGradient id="orFille" gradientUnits="userSpaceOnUse" x1="0" y1="-360" x2="0" y2="0"><stop offset="0" stop-color="#FFE7B0"/><stop offset=".55" stop-color="#E0A84A"/><stop offset="1" stop-color="#C98A2E"/></linearGradient>
<radialGradient id="caseChaude" cx=".5" cy=".62" r=".75"><stop offset="0" stop-color="#A8763A"/><stop offset=".7" stop-color="#7E5224"/><stop offset="1" stop-color="#553618"/></radialGradient>
<radialGradient id="cuisine" cx=".45" cy=".55" r=".8"><stop offset="0" stop-color="#7E5424"/><stop offset=".75" stop-color="#5C3B1C"/><stop offset="1" stop-color="#422912"/></radialGradient>
<filter id="glowDoux" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/>
  <feFlood flood-color="#F2C46A" flood-opacity=".5"/><feComposite in2="b" operator="in" result="h"/><feMerge><feMergeNode in="h"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="liseré" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>`;

// 4. le ciel encore clair au-dessus de l'horizon
s += `<defs><linearGradient id="crepuscule" x1="0" y1="430" x2="0" y2="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#D9A35A" stop-opacity="0"/>` +
  `<stop offset=".55" stop-color="#D9A35A" stop-opacity=".2"/><stop offset=".84" stop-color="#E8B86C" stop-opacity=".58"/><stop offset="1" stop-color="#F6D69A" stop-opacity=".85"/></linearGradient></defs>`;
s += `<rect x="400" y="430" width="1560" height="480" fill="url(#crepuscule)"/>`;
s += `<ellipse cx="1180" cy="880" rx="620" ry="70" fill="#F6DCA4" opacity=".35" filter="url(#b34)"/>`;
// 3. décor de brume : collines, bosquets et clôture lointains
s += `<g filter="url(#b4)" fill="#3E2714" opacity=".95"><path d="M440,876 C640,842 860,858 1060,838 C1300,818 1600,852 1960,826 L1960,930 L440,930 Z"/>` +
  `${O.arbre(720, 870, 300, 31, { fill: '#3E2714', depth: 5 })}${O.arbre(800, 872, 220, 32, { fill: '#3E2714', depth: 5 })}</g>`;
s += `<g filter="url(#b1_2)" opacity=".9">${O.cloture(560, 1600, 906, 96, 8, '#2A1A0C')}</g>`;

// la maison en coupe, à gauche : la caméra s'est décalée, la maison tient de x 0 à 536 (28 % de la largeur)
let m = '';
const piece = (x0, y0, x1, y1) => `M${x0},${y0} L${x1},${y0} L${x1},${y1} L${x0},${y1} Z `;
const cases = [[-40, 132, 282, 392], [330, 132, 680, 392], [-40, 438, 212, 900]];
for (const [x0, y0, x1, y1] of cases) m += `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="url(#caseChaude)" opacity=".92"/>`;
m += `<rect x="260" y="438" width="420" height="462" fill="url(#cuisine)" opacity=".95"/>`;
let d = piece(-40, 96, 736, 948);
for (const [x0, y0, x1, y1] of cases) d += piece(x0, y0, x1, y1);
d += piece(260, 438, 680, 900);
m += `<path fill="${C.ombre}" fill-rule="evenodd" d="${d}"/>`;
m += `<path fill="${C.ombre}" d="M-40,-190 L796,88 L796,104 L-40,104 Z"/>`;
// la chambre de la fillette, à l'étage : le lit vide (elle est au jardin)
m += `<g fill="${C.ombre}"><path d="M420,392 L420,262 C420,248 432,244 444,244 L456,244 L456,330 L640,330 L640,312 L654,312 L654,392 L640,392 L640,360 L436,360 L436,392 Z"/><path d="M470,330 C472,312 488,304 514,306 L532,330 Z"/></g>`;
// la cuisine : l'horloge dorée sort les devis finis, la pile dorée monte (halo baissé d'un tiers)
const Hc = { x: 392, y: 898, s: .72, balancier: 12, heure: 120, minute: -60, armL: [30, -20], armR: [-118, 34], fill: 'url(#orGrad)' };
m += `<g filter="url(#glowDoux)">${O.horloge(Hc)}</g>`;
m += `<g filter="url(#glowDoux)">${O.pile(598, 898, 21, { w: 132, h: 9, gap: 2.2, seed: 5, fill: 'url(#orGrad)' })}</g>`;
// un devis fini en vol du cadran vers la pile, deux échos dorés à 12 et 15 %
const vol = (x, y, rot, sc, op, blur) => `<g opacity="${op}"${blur ? ` filter="url(#${blur})"` : ''}><g transform="translate(${x},${y}) scale(${sc})">${O.devis(-60, -80, 120, 160, rot, 'url(#orGrad)')}</g></g>`;
m += vol(436, 604, -24, .42, .12, 'b2_5') + vol(482, 566, -12, .44, .15, 'b1_2') + `<g filter="url(#glowDoux)">${vol(540, 556, 8, .46, 1, '')}</g>`;
// la fenêtre de la cuisine : châssis et croisillons
m += `<g fill="${C.ombre}"><path fill-rule="evenodd" d="M260,438 h420 v462 h-420 Z M274,452 h392 v434 h-392 Z"/><rect x="497" y="452" width="9" height="434"/><rect x="274" y="514" width="392" height="9"/></g>`;
s += `<g transform="translate(-260,0)">${m}</g>`;

// 2. le jardin : l'arbre, sa grosse branche bordée d'or sur le dessus, la balançoire
s += O.arbre(1650, 912, 980, 14, { fill: C.ombre, lean: 3, depth: 6, w: 74 });
// branche effilée le long d'une courbe de Bézier, du tronc vers la gauche, avec trois rameaux qui en partent
const bezier = (B) => (t) => { const u = 1 - t; return [0, 1].map((k) => u * u * u * B[0][k] + 3 * u * u * t * B[1][k] + 3 * u * t * t * B[2][k] + t * t * t * B[3][k]); };
function rameau(B, w0, w1) {
  const bz = bezier(B), N = 40, h = [], b = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, [x, y] = bz(t), [x2, y2] = bz(Math.min(1, t + 0.01)), [x1, y1] = bz(Math.max(0, t - 0.01));
    const tx = x2 - x1, ty = y2 - y1, l = Math.hypot(tx, ty), nx = -ty / l, ny = tx / l, w = w0 + (w1 - w0) * t;
    h.push([x + nx * w / 2, y + ny * w / 2]); b.push([x - nx * w / 2, y - ny * w / 2]);
  }
  const pts = (a) => a.map(([x, y]) => `${f(x)},${f(y)}`).join(' L');
  return { d: `M${pts(h)} L${pts(b.slice().reverse())} Z`, haut: h, bz };
}
const BR = [[1660, 600], [1560, 500], [1420, 352], [1030, 318]];
const br = rameau(BR, 62, 10), bz = br.bz;
const pt = (t) => bz(t);
const r1 = rameau([pt(.5), [1390, 300], [1376, 262], [1350, 232]], 20, 5);
const r2 = rameau([pt(.74), [1180, 304], [1150, 290], [1116, 266]], 14, 4);
const r3 = rameau([pt(.28), [1520, 400], [1512, 350], [1524, 306]], 22, 5);
// liseré d'or : seulement le bord supérieur, qui s'éteint vers le tronc
const lisere = (h, i0) => { let g = ''; for (let i = i0; i < h.length - 1; i++) {
  const op = Math.min(1, (i - i0) / 10);
  g += `<path d="M${f(h[i][0])},${f(h[i][1])} L${f(h[i + 1][0])},${f(h[i + 1][1])}" opacity="${f(op)}"/>`; } return g; };
s += `<g filter="url(#liseré)" stroke="${OR}" stroke-width="7" stroke-linecap="round" fill="none">${lisere(br.haut, 6)}</g>`;
s += `<path fill="${C.ombre}" d="${br.d} ${r1.d} ${r2.d} ${r3.d}"/>`;

// la balançoire, vue de profil comme le balancier : une corde de 8 px et une planche, attachée sous la branche
let piv = [1250, 0];
for (let i = 0; i <= 800; i++) { const [x, y] = bz(i / 800); if (Math.abs(x - 1250) < 1.2) { const w = 62 + (10 - 62) * (i / 800); piv = [1250, y + w / 2 * 0.9]; break; } }
const L = 356, sF = .82, sP = .8, ang = 18, sol = 908, penche = -12;
const siege = [piv[0], piv[1] + L];
const hanche = [piv[0] - 12, siege[1] - 6];
const gX = hanche[0] + 4 * sF, gY = hanche[1] + 118 * sF;
// la fillette, penchée en arrière, bras tendus vers la corde (cinématique inverse dans son repère)
const versFille = ([x, y]) => { const [rx, ry] = tourne([x, y], -penche, hanche); return [(rx - gX) / sF, (ry - gY) / sF]; };
const fillePose = { x: gX, y: gY, s: sF, seated: true, fill: 'url(#orFille)', head: -6, legF: [-6, 4], legB: [8, 2],
  armF: ik([6, -226], versFille([piv[0], siege[1] - 214 * sF]), 56, 54), armB: ik([-2, -226], versFille([piv[0], siege[1] - 186 * sF]), 56, 54) };
const RA = -40, RV = 58;   // corde arrière, corde avant (la balançoire vue de trois quarts : deux cordes, une planche)
fillePose.armF = ik([6, -226], versFille([piv[0] + RV, siege[1] - 214 * sF]), 56, 54);
fillePose.armB = ik([-2, -226], versFille([piv[0] + RV, siege[1] - 190 * sF]), 56, 54);
const balEtFille = (a, op) =>
  `<g transform="rotate(${a},${piv[0]},${piv[1]})" opacity="${op}">` +
  `<path d="M${piv[0] + RA},${f(piv[1] - 4)} L${piv[0] + RA},${siege[1] + 2}" stroke="#C9963F" stroke-width="6" stroke-linecap="round"/>` +
  `<path d="M${piv[0] + RA - 6},${siege[1] - 2} L${piv[0] + RV + 8},${siege[1] - 2} L${piv[0] + RV + 2},${siege[1] + 12} L${piv[0] + RA - 12},${siege[1] + 12} Z" fill="#B57C2E"/>` +
  `<g transform="rotate(${penche},${hanche[0]},${hanche[1]})">${O.fille(fillePose)}</g>` +
  `<path d="M${piv[0] + RV},${f(piv[1] - 4)} L${piv[0] + RV},${siege[1] + 2}" stroke="#E9B85E" stroke-width="7" stroke-linecap="round"/></g>`;
// la traînée d'étincelles suffit à dire le mouvement (aucun écho de la fillette)
s += `<g filter="url(#glow)">${balEtFille(ang, 1)}</g>`;

// le père, doré, penché dans la poussée : ses deux mains à plat sur le dos de sa fille (aucun espace, rien en main)
const versScene = (lx, ly) => tourne(tourne([gX + lx * sF, gY + ly * sF], penche, hanche), ang, piv);
const dosHaut = versScene(-19, -204), dosBas = versScene(-31, -164);
const leanP = 9;
// le père se place pour que ses deux mains atteignent le dos bras presque tendus (95 % de l'allonge)
let Fx = dosBas[0] - 260;
const epaule = (fx) => tourne([fx + 6 * sP, sol - 478 * sP], leanP, [fx, sol]);
while (Fx < dosBas[0] - 60 && Math.max(...[dosHaut, dosBas].map((q) => Math.hypot(q[0] - epaule(Fx)[0], q[1] - epaule(Fx)[1]))) > 0.95 * 232 * sP) Fx += 2;
Fx = f(Fx);
const versPere = ([x, y]) => { const [rx, ry] = tourne([x, y], -leanP, [Fx, sol]); return [(rx - Fx) / sP, (ry - sol) / sP]; };
const P = { x: Fx, y: sol, s: sP, fill: 'url(#orPere)', legF: [-26, 12], legB: [30, 2], head: -leanP };
P.armF = ik([6, -478], versPere(dosHaut), 116, 116);
P.armB = ik([-2, -478], versPere(dosBas), 116, 116);
s += `<g filter="url(#glow)"><g transform="rotate(${leanP},${Fx},${sol})">${O.pere(P)}</g></g>`;

// étincelles : traînée le long de l'arc, poussière dans l'air du soir
const r = O.R(77); let tr = '';
for (let i = 0; i < 46; i++) {
  const a = 6 - r() * 24, rr = L - 30 - r() * 170;
  const x = piv[0] - rr * Math.sin(rad(a)) + (r() - .5) * 26, y = piv[1] + rr * Math.cos(rad(a)) + (r() - .5) * 26;
  tr += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(.8 + Math.pow(r(), 3) * 3.4)}" fill="${r() < .5 ? C.orClair : '#FFE7B0'}" opacity="${f(.3 + r() * .6)}"/>`;
}
s += `<g filter="url(#glowS)">${tr}</g>`;
s += O.etincelles(600, 140, 1880, 860, 70, 12) + O.etincelles(40, 460, 440, 860, 18, 5);

// sol, herbes du jardin
s += `<rect x="476" y="904" width="1460" height="60" fill="${C.ombre}"/>`;
s += O.herbes(470, 1930, 912, 46, 9, C.ombre, 1.3);
// 1. avant-plan : grandes herbes floues coupées par les bords du cadre (brins larges)
const touffe = (x0, x1, y, h, seed) => { const q = O.R(seed); let dd = '';
  for (let x = x0; x < x1; x += 12 + q() * 16) { const hh = h * (.45 + q() * .6), lean = (q() - .5) * hh * .7, w = 26 + q() * 26;
    dd += `M${f(x)},${y} Q${f(x + lean * .25)},${f(y - hh * .6)} ${f(x + lean)},${f(y - hh)} Q${f(x + lean * .3 + w)},${f(y - hh * .5)} ${f(x + w)},${y} Z `; }
  return `<path d="${dd}"/>`; };
s += `<g filter="url(#b14)" fill="#0B0603">${touffe(1640, 1990, 1040, 420, 21)}</g>`;
s += `<g filter="url(#b9)" fill="#0B0603">${touffe(470, 680, 1030, 300, 23)}</g>`;
// étincelles au premier plan, hors de la mise au point
const bk = O.R(91); let bo = '';
for (const [x, y, rr] of [[1840, 120, 34], [1600, 70, 18], [70, 60, 26], [880, 160, 14], [1880, 560, 22], [640, 470, 16]]) bo += `<circle cx="${x}" cy="${y}" r="${rr}" fill="#F2C46A" opacity="${f(.16 + bk() * .16)}"/>`;
s += `<g filter="url(#b9)">${bo}</g>`;
// sol au premier plan (bande des sous-titres)
s += `<rect x="0" y="940" width="1920" height="140" fill="#0B0603"/>`;
s += O.voile();
document.getElementById('s').innerHTML = s;
</script></body></html>
