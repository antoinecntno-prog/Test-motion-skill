<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>B1 · Le montreur · 4,2 s</title>
<link rel="stylesheet" href="_base.css"></head>
<body><div class="stage"><svg class="scene" id="s" viewBox="0 0 1920 1080"></svg>
<div class="sub">Derrière lui, le <span class="k">Temps perdu</span> passa la porte.</div></div>
<script src="_ombres.js"></script><script>
/* B1, 4,2 s : « Derrière lui, le Temps perdu passa la porte. »
   Le théâtre d'ombres vu de la salle : la toile, son bord haut (traverse de bois, lambrequin), et au-dessus, dans
   l'ombre des cintres, le train d'engrenages du Temps perdu. L'horloge vient de passer la porte de l'entrée, côté cour
   (à droite) : une vraie porte dans son mur, battant ouvert. L'horloge est le montreur : une courroie part du moyeu de
   son cadran et entraîne la roue maîtresse ; le train d'engrenages tire deux tiges jusqu'aux poignets du père, qui
   marche vers la gauche, la pile de devis sous le bras. */
const O = OMBRES, C = O.C;
const f = (n) => Math.round(n * 10) / 10, rad = (d) => d * Math.PI / 180;
const YT = 176, YB = 222, SOL = 905;          // traverse (haut, bas), sol de la toile

/* ---------- formes locales du théâtre ---------- */
// cintres : la nuit au-dessus de la toile, un peu de lumière qui déborde par le haut de la toile
const cintres = () => `<defs><linearGradient id="cintGrad" x1="0" y1="0" x2="0" y2="${YT}" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#0A0603"/><stop offset=".55" stop-color="#1E130A"/><stop offset="1" stop-color="#43291A"/></linearGradient>
  <clipPath id="cintClip"><rect width="1920" height="${YT}"/></clipPath></defs>
  <rect width="1920" height="${YT}" fill="url(#cintGrad)"/>` + O.brume(1050, 150, 760, 90, .5, '#7A5232', 34);
// traverse de bois sombre, veines et boulons, puis lambrequin festonné qui borde le haut de la toile
function traverse() {
  const r = O.R(21); let s = `<rect x="-10" y="${YT}" width="1940" height="${YB - YT}" fill="#120A05"/>`;
  for (let i = 0; i < 8; i++) { const y = YT + 6 + r() * (YB - YT - 12);
    s += `<path d="M-10,${f(y)} C620,${f(y + (r() - .5) * 7)} 1300,${f(y + (r() - .5) * 7)} 1930,${f(y + (r() - .5) * 5)}" stroke="#2C1B0F" stroke-width="${f(1 + r() * 1.6)}" fill="none"/>`; }
  s += `<rect x="-10" y="${YT}" width="1940" height="3" fill="#7A5634" opacity=".75"/>`;
  for (let x = 70; x < 1920; x += 240) s += `<circle cx="${x}" cy="${(YT + YB) / 2}" r="5.5" fill="#3E2A18"/>`;
  let d = `M-20,${YB - 2} `; const w = 96, h = 30;
  for (let x = -20; x < 1940; x += w) d += `L${x},${YB} Q${x + w / 2},${YB + h * 2} ${x + w},${YB} `;
  d += `L1940,${YB - 2} Z`;
  s += `<path d="${d}" fill="#140B05"/>`;
  for (let x = -20; x < 1940; x += w) s += `<path d="M${x - 3},${YB} L${x + 3},${YB} L${x + 2},${YB + 22} C${x + 6},${YB + 26} ${x + 5},${YB + 34} ${x},${YB + 36} C${x - 5},${YB + 34} ${x - 6},${YB + 26} ${x - 2},${YB + 22} Z" fill="#140B05"/>`;
  return s;
}
// roue dentée à rayons ajourés (lisible dans la pénombre grâce à une arête éclairée par le bas)
function roue(cx, cy, r, dents, rot, o = {}) {
  const p = Object.assign({ fill: '#0B0603', arete: '#7A5634', rayons: 5, op: 1 }, o);
  let d = '';
  const n = dents * 2;
  for (let i = 0; i < n; i++) {
    const a0 = rad(rot + (i / n) * 360), a1 = rad(rot + ((i + 1) / n) * 360), rr = i % 2 === 0 ? r : r * 0.84;
    d += (i === 0 ? 'M' : 'L') + f(cx + rr * Math.cos(a0)) + ',' + f(cy + rr * Math.sin(a0)) + ' L' + f(cx + rr * Math.cos(a1)) + ',' + f(cy + rr * Math.sin(a1)) + ' ';
  }
  d += 'Z ';
  const ro = r * 0.68, ri = r * 0.26, k = p.rayons;
  for (let i = 0; i < k; i++) {
    const a0 = rot + i * 360 / k + 9, a1 = rot + (i + 1) * 360 / k - 9, b0 = a0 + 12, b1 = a1 - 12;
    const P = (rr, a) => `${f(cx + rr * Math.cos(rad(a)))},${f(cy + rr * Math.sin(rad(a)))}`;
    d += `M${P(ro, a0)} A${f(ro)},${f(ro)} 0 0 1 ${P(ro, a1)} L${P(ri, b1)} A${f(ri)},${f(ri)} 0 0 0 ${P(ri, b0)} Z `;
  }
  d += O.disque(cx, cy, r * 0.07);
  return `<g opacity="${p.op}"><path fill-rule="evenodd" d="${d}" fill="${p.arete}" opacity=".6" transform="translate(0,2.6)"/>` +
    `<path fill-rule="evenodd" d="${d}" fill="${p.fill}"/></g>`;
}
// maneton (pivot de bielle) sur une roue
const maneton = (x, y, fill = '#0B0603') => `<circle cx="${f(x)}" cy="${f(y)}" r="8" fill="${fill}"/><circle cx="${f(x)}" cy="${f(y)}" r="3" fill="#7A5634"/>`;
// tige de montreur : trait sombre ; dans les cintres, une arête éclairée la détache de la nuit
const tigeM = (x0, y0, x1, y1, w = 5.5) => O.tige(x0, y0, x1, y1, w, '#120A05') +
  `<g clip-path="url(#cintClip)">${O.tige(x0 + w / 2, y0, x1 + w / 2, y1, 1.4, '#8A6440')}</g>`;
// œillet qui fixe la tige au poignet
const oeillet = (x, y) => `<circle cx="${f(x)}" cy="${f(y)}" r="7.5" fill="${C.ombre}"/><circle cx="${f(x)}" cy="${f(y)}" r="2.2" fill="#5A4028"/>`;
// rideau de velours, très flou, coupé par le bord du cadre
function rideau(cote) {
  const r = O.R(cote === 'L' ? 31 : 37); let d = '';
  const x0 = cote === 'L' ? -60 : 1980, dir = cote === 'L' ? 1 : -1, larg = cote === 'L' ? 190 : 170;
  d = `M${x0},-40 L${x0 + dir * larg},-40 `;
  for (let y = -40; y <= 1120; y += 90) d += `Q${f(x0 + dir * (larg - 22 + r() * 40))},${y + 45} ${f(x0 + dir * (larg - 8 + r() * 26))},${y + 90} `;
  d += `L${x0},1120 Z`;
  let plis = '';
  for (let i = 0; i < 3; i++) { const xx = x0 + dir * (50 + i * 45);
    plis += `<path d="M${xx},-40 C${xx + dir * 14},300 ${xx - dir * 10},700 ${xx + dir * 8},1120" stroke="#3B2616" stroke-width="14" fill="none" opacity=".85"/>`; }
  return `<g filter="url(#b14)"><path d="${d}" fill="#0C0704"/>${plis}</g>`;
}

/* ---------- courroie : boucle ouverte entre deux poulies (tangentes extérieures) ---------- */
function courroie(a, ra, b, rb, w = 5.5, col = '#120A05') {
  const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy), phi = Math.atan2(dy, dx), al = Math.acos((ra - rb) / d);
  const T = (c, r, ang) => [c[0] + r * Math.cos(ang), c[1] + r * Math.sin(ang)];
  const a1 = T(a, ra, phi + al), b1 = T(b, rb, phi + al), a2 = T(a, ra, phi - al), b2 = T(b, rb, phi - al);
  const d0 = `M${f(a1[0])},${f(a1[1])} L${f(b1[0])},${f(b1[1])} A${rb},${rb} 0 1 0 ${f(b2[0])},${f(b2[1])} L${f(a2[0])},${f(a2[1])} A${ra},${ra} 0 0 0 ${f(a1[0])},${f(a1[1])} Z`;
  return `<path d="${d0}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round"/>`;
}
const poulie = (x, y, r) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r + 3}" fill="#0B0603"/><circle cx="${f(x)}" cy="${f(y)}" r="${f(r * .55)}" fill="none" stroke="#7A5634" stroke-width="2"/><circle cx="${f(x)}" cy="${f(y)}" r="3" fill="#7A5634"/>`;

/* ---------- la scène ---------- */
let s = O.defs({ x: 820, y: 560, r: 1180 }) + O.toile();

// 3. décor de brume (loin de la toile, donc flou et pâle) : fenêtre de l'entrée, brume chaude
s += O.brume(330, 600, 420, 280, .38, C.brume, 34) + O.brume(900, 560, 360, 240, .34, C.brume, 34);
const fenetre = (x, y, w, h, col) => `<path fill="${col}" fill-rule="evenodd" d="M${x},${y} h${w} v${h} h${-w} Z M${x + 12},${y + 12} h${w / 2 - 16} v${h / 2 - 16} h${-(w / 2 - 16)} Z M${x + w / 2 + 4},${y + 12} h${w / 2 - 16} v${h / 2 - 16} h${-(w / 2 - 16)} Z M${x + 12},${y + h / 2 + 4} h${w / 2 - 16} v${h / 2 - 16} h${-(w / 2 - 16)} Z M${x + w / 2 + 4},${y + h / 2 + 4} h${w / 2 - 16} v${h / 2 - 16} h${-(w / 2 - 16)} Z"/>`;
s += `<g filter="url(#b4)" opacity=".7">${fenetre(790, 420, 200, 240, C.brume2)}<rect x="772" y="660" width="236" height="14" fill="${C.brume2}"/></g>`;

// 2b. le mur de l'entrée et sa porte, côté cour (découpes nettes, collées à la toile)
const DX0 = 1470, DX1 = 1684, JW = 24, DT = 342;          // ouverture, largeur des montants, haut de l'ouverture
const MX0 = 1338, MX1 = 1840;                              // pans de mur de part et d'autre
// dehors, par la porte : la nuit du jardin, un arbre lointain dans la brume
s += `<defs><clipPath id="porteClip"><rect x="${DX0}" y="${DT}" width="${DX1 - DX0}" height="${SOL - DT}"/></clipPath></defs>`;
s += `<g clip-path="url(#porteClip)"><rect x="${DX0}" y="${DT}" width="${DX1 - DX0}" height="${SOL - DT}" fill="#B98F5E" opacity=".35"/>` +
  `<g filter="url(#b6)" opacity=".45">${O.arbre(1620, SOL, 700, 9, { fill: C.brume2, lean: -6 })}</g></g>`;
// pans de mur (papier teinté, plus clair que les silhouettes) : plinthe, cimaise, cadre accroché
s += `<path fill-rule="evenodd" fill="#4A3220" opacity=".72" d="M${MX0},${YB - 4} L${MX1},${YB - 4} L${MX1},${SOL} L${MX0},${SOL} Z M${DX0},${DT} L${DX1},${DT} L${DX1},${SOL} L${DX0},${SOL} Z"/>`;
s += `<g fill="${C.ombre}"><rect x="${MX0}" y="${SOL - 22}" width="${DX0 - JW - MX0}" height="22"/><rect x="${DX1 + JW}" y="${SOL - 22}" width="${MX1 - DX1 - JW}" height="22"/>` +
  `<rect x="${MX0}" y="640" width="${DX0 - JW - MX0}" height="7"/><rect x="${DX1 + JW}" y="640" width="${MX1 - DX1 - JW}" height="7"/>` +
  `<rect x="${MX0}" y="${YB - 4}" width="7" height="${SOL - YB + 4}" opacity=".85"/></g>`;
s += `<path fill="${C.ombre}" fill-rule="evenodd" d="M1738,420 h66 v88 h-66 Z M1748,430 h46 v68 h-46 Z"/>`;
// chambranle : deux montants et un linteau au même nu (aucun débord)
s += `<path fill="${C.ombre}" fill-rule="evenodd" d="M${DX0 - JW},${DT - JW} L${DX1 + JW},${DT - JW} L${DX1 + JW},${SOL} L${DX0 - JW},${SOL} Z M${DX0},${DT} L${DX1},${DT} L${DX1},${SOL} L${DX0},${SOL} Z"/>`;
// battant ouvert vers l'intérieur, gond côté droit : panneaux ajourés, poignée
const BW = 74;
s += `<path fill="${C.ombre}" fill-rule="evenodd" d="M${DX1},${DT} L${DX1 - BW},${DT + 14} L${DX1 - BW},${SOL - 10} L${DX1},${SOL} Z ` +
  `M${DX1 - 12},${DT + 34} L${DX1 - BW + 12},${DT + 44} L${DX1 - BW + 12},${DT + 250} L${DX1 - 12},${DT + 246} Z ` +
  `M${DX1 - 12},${DT + 300} L${DX1 - BW + 12},${DT + 304} L${DX1 - BW + 12},${SOL - 46} L${DX1 - 12},${SOL - 40} Z"/>`;
s += `<circle cx="${DX1 - BW - 7}" cy="${DT + 280}" r="8" fill="${C.ombre}"/><rect x="${DX1 - BW - 4}" y="${DT + 276}" width="8" height="8" fill="${C.ombre}"/>`;
// seuil
s += `<rect x="${DX0 - JW - 10}" y="${SOL - 8}" width="${DX1 - DX0 + 2 * JW + 20}" height="8" fill="${C.ombre}"/>`;

// 4. cintres, traverse et rouages du Temps perdu
s += cintres();
// rouages du fond des cintres, plus loin : flous et plus pâles
s += `<g filter="url(#b4)">${roue(1020, 60, 110, 16, 8, { fill: '#160D06', arete: '#4A3019', op: .9 })}${roue(1460, 52, 120, 17, 3, { fill: '#160D06', arete: '#4A3019', op: .85 })}${roue(1740, 96, 90, 14, 12, { fill: '#160D06', arete: '#4A3019', op: .85 })}</g>`;
// cordes des cintres
for (const x of [250, 330]) s += `<path d="M${x},0 L${x},${YT}" stroke="#2E1E12" stroke-width="2"/>`;
// le train d'engrenages : roue maîtresse (menée par la courroie de l'horloge) jusqu'à la roue du père
const G = [
  { x: 500, y: 92, r: 96, d: 18, rot: 4 },     // roue du père : deux manetons
  { x: 636, y: 128, r: 56, d: 11, rot: 12 },
  { x: 756, y: 98, r: 76, d: 15, rot: 2 },     // roue maîtresse, menée par la courroie
];
// flou de rotation : la roue maîtresse et la roue du père tournent (copies décalées, floues)
s += `<g opacity=".45" filter="url(#b2_5)">${roue(G[2].x, G[2].y, G[2].r, G[2].d, G[2].rot - 7)}${roue(G[0].x, G[0].y, G[0].r, G[0].d, G[0].rot + 6)}</g>`;
for (const g of G) s += roue(g.x, g.y, g.r, g.d, g.rot);
// supports des axes, posés sur la traverse
for (const g of G) s += `<path d="M${g.x - 6},${g.y} L${g.x + 6},${g.y} L${g.x + 14},${YT} L${g.x - 14},${YT} Z" fill="#0B0603"/>`;

// 2. le père, de profil vers la gauche (il vient du côté cour), tiré par deux tiges
const P = { x: 540, y: SOL, s: .82, flip: -1, armF: [-8, -82], armB: [30, -14], legF: [-22, 12], legB: [20, 4], head: 2 };
const [fx, fy] = O.mainPere(P, 'F'), [bx, by] = O.mainPere(P, 'B');
const m1 = [G[0].x - 64, G[0].y + 34], m2 = [G[0].x + 60, G[0].y - 22];
s += tigeM(m1[0], m1[1], fx - 4, fy) + tigeM(m2[0], m2[1], bx, by);
s += maneton(m1[0], m1[1]) + maneton(m2[0], m2[1]);
s += O.pere(P);
// la pile de devis sous le bras, posée sur l'avant-bras
s += O.pile(fx + 44, fy - 3, 10, { w: 92, h: 7, gap: 1.7, seed: 5 });
s += oeillet(fx - 4, fy) + oeillet(bx, by);

// 1b. l'horloge vient de passer la porte, elle roule vers la gauche, penchée dans son élan
const H = { x: 1238, y: SOL, s: .74, balancier: -16, heure: 210, minute: 90, armL: [34, -44], armR: [-26, 34] };
const TILT = -2.5, st = Math.sin(rad(TILT)), ct = Math.cos(rad(TILT));
const hub = [H.x - (-386 * H.s) * st, H.y + (-386 * H.s) * ct];
s += `<g transform="rotate(${TILT},${H.x},${SOL})">${O.horloge(H)}</g>`;
// la courroie : du moyeu du cadran à la poulie de la roue maîtresse (elle passe derrière la traverse)
const pm = [G[2].x, G[2].y];
s += poulie(pm[0], pm[1], 27) + `<circle cx="${f(hub[0])}" cy="${f(hub[1])}" r="11" fill="${C.ombre}"/><circle cx="${f(hub[0])}" cy="${f(hub[1])}" r="3.5" fill="#5A4028"/>`;
s += courroie(hub, 16, pm, 31) + `<g clip-path="url(#cintClip)">${courroie([hub[0] + 2, hub[1]], 16, [pm[0] + 2, pm[1]], 31, 1.3, '#8A6440')}</g>`;

// traverse par-dessus les pieds des supports
s += traverse();

// sol de la toile, puis rebord de la scène au premier plan (bande des sous-titres)
s += `<rect x="0" y="${SOL}" width="1920" height="${1080 - SOL}" fill="#140B06"/>`;
s += `<g filter="url(#b9)"><rect x="-20" y="938" width="1960" height="160" fill="#0B0603"/><rect x="-20" y="936" width="1960" height="5" fill="#3A2716" opacity=".7"/></g>`;
// 1. avant-plan : rideaux de velours, flous, coupés par les bords du cadre
s += rideau('L') + rideau('R');
s += O.voile();
document.getElementById('s').innerHTML = s;
</script></body></html>
