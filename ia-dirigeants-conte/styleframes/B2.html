<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>B2 · Le montreur · 19,6 s</title>
<link rel="stylesheet" href="_base.css"></head>
<body><div class="stage"><svg class="scene" id="s" viewBox="0 0 1920 1080"></svg>
<div class="sub">IA voulait dire <span class="k">Interminable Attente</span></div></div>
<script src="_ombres.js"></script><script>
/* B2, 19,6 s : « IA voulait dire Interminable Attente »
   Le même théâtre vu de la salle. Les tiges du Temps perdu ont tiré le père loin de la toile : son ombre est immense,
   pâle et un peu floue, de profil, tournée vers le devis qu'il lit ; deux tiges nettes montent de ses poignets aux
   engrenages, à travers le lambrequin. Devant, la fillette, nette, collée à la toile, sans aucune tige, attend assise
   sur la dernière marche, le menton dans les mains. Au-dessus d'elle, comme un mobile, les mots « Interminable » et
   « Attente » pendent à leurs fils, entiers et droits : le I et le A enfilés sur le même fil vertical. */
const O = OMBRES, C = O.C;
const f = (n) => Math.round(n * 10) / 10, rad = (d) => d * Math.PI / 180;
const YT = 176, YB = 222, SOL = 905;

/* ---------- formes locales du théâtre (communes à B1, B2, B3) ---------- */
const cintres = () => `<defs><linearGradient id="cintGrad" x1="0" y1="0" x2="0" y2="${YT}" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#0A0603"/><stop offset=".55" stop-color="#1E130A"/><stop offset="1" stop-color="#43291A"/></linearGradient>
  <clipPath id="cintClip"><rect width="1920" height="${YT}"/></clipPath><clipPath id="toileClip"><rect y="${YB}" width="1920" height="${1080 - YB}"/></clipPath></defs>
  <rect width="1920" height="${YT}" fill="url(#cintGrad)"/>` + O.brume(1050, 150, 760, 90, .5, '#7A5232', 34);
function traverse() {
  const r = O.R(21); let s = `<rect x="-10" y="${YT}" width="1940" height="${YB - YT}" fill="#120A05"/>`;
  for (let i = 0; i < 8; i++) { const y = YT + 6 + r() * (YB - YT - 12);
    s += `<path d="M-10,${f(y)} C620,${f(y + (r() - .5) * 7)} 1300,${f(y + (r() - .5) * 7)} 1930,${f(y + (r() - .5) * 5)}" stroke="#2C1B0F" stroke-width="${f(1 + r() * 1.6)}" fill="none"/>`; }
  s += `<rect x="-10" y="${YT}" width="1940" height="3" fill="#7A5634" opacity=".75"/>`;
  for (let x = 70; x < 1920; x += 240) s += `<circle cx="${x}" cy="${(YT + YB) / 2}" r="5.5" fill="#3E2A18"/>`;
  let d = `M-20,${YB - 2} `; const w = 96, h = 30;
  for (let x = -20; x < 1940; x += w) d += `L${x},${YB} Q${x + w / 2},${YB + h * 2} ${x + w},${YB} `;
  d += `L1940,${YB - 2} Z`;
  s += `<path d="${d}" fill="#140B05"/>`;
  for (let x = -20; x < 1940; x += w) s += `<path d="M${x - 3},${YB} L${x + 3},${YB} L${x + 2},${YB + 22} C${x + 6},${YB + 26} ${x + 5},${YB + 34} ${x},${YB + 36} C${x - 5},${YB + 34} ${x - 6},${YB + 26} ${x - 2},${YB + 22} Z" fill="#140B05"/>`;
  return s;
}
function roue(cx, cy, r, dents, rot, o = {}) {
  const p = Object.assign({ fill: '#0B0603', arete: '#7A5634', rayons: 5, op: 1 }, o);
  let d = '';
  const n = dents * 2;
  for (let i = 0; i < n; i++) {
    const a0 = rad(rot + (i / n) * 360), a1 = rad(rot + ((i + 1) / n) * 360), rr = i % 2 === 0 ? r : r * 0.84;
    d += (i === 0 ? 'M' : 'L') + f(cx + rr * Math.cos(a0)) + ',' + f(cy + rr * Math.sin(a0)) + ' L' + f(cx + rr * Math.cos(a1)) + ',' + f(cy + rr * Math.sin(a1)) + ' ';
  }
  d += 'Z ';
  const ro = r * 0.68, ri = r * 0.26, k = p.rayons;
  for (let i = 0; i < k; i++) {
    const a0 = rot + i * 360 / k + 9, a1 = rot + (i + 1) * 360 / k - 9, b0 = a0 + 12, b1 = a1 - 12;
    const P = (rr, a) => `${f(cx + rr * Math.cos(rad(a)))},${f(cy + rr * Math.sin(rad(a)))}`;
    d += `M${P(ro, a0)} A${f(ro)},${f(ro)} 0 0 1 ${P(ro, a1)} L${P(ri, b1)} A${f(ri)},${f(ri)} 0 0 0 ${P(ri, b0)} Z `;
  }
  d += O.disque(cx, cy, r * 0.07);
  return `<g opacity="${p.op}"><path fill-rule="evenodd" d="${d}" fill="${p.arete}" opacity=".6" transform="translate(0,2.6)"/>` +
    `<path fill-rule="evenodd" d="${d}" fill="${p.fill}"/></g>`;
}
const maneton = (x, y, fill = '#0B0603') => `<circle cx="${f(x)}" cy="${f(y)}" r="8" fill="${fill}"/><circle cx="${f(x)}" cy="${f(y)}" r="3" fill="#7A5634"/>`;
const tigeM = (x0, y0, x1, y1, w = 5) => O.tige(x0, y0, x1, y1, w, '#120A05') +
  `<g clip-path="url(#cintClip)">${O.tige(x0 + w / 2, y0, x1 + w / 2, y1, 1.3, '#8A6440')}</g>`;
function rideau(cote) {
  const r = O.R(cote === 'L' ? 31 : 37); let d = '';
  const x0 = cote === 'L' ? -60 : 1980, dir = cote === 'L' ? 1 : -1, larg = cote === 'L' ? 190 : 170;
  d = `M${x0},-40 L${x0 + dir * larg},-40 `;
  for (let y = -40; y <= 1120; y += 90) d += `Q${f(x0 + dir * (larg - 22 + r() * 40))},${y + 45} ${f(x0 + dir * (larg - 8 + r() * 26))},${y + 90} `;
  d += `L${x0},1120 Z`;
  let plis = '';
  for (let i = 0; i < 3; i++) { const xx = x0 + dir * (50 + i * 45);
    plis += `<path d="M${xx},-40 C${xx + dir * 14},300 ${xx - dir * 10},700 ${xx + dir * 8},1120" stroke="#3B2616" stroke-width="14" fill="none" opacity=".85"/>`; }
  return `<g filter="url(#b14)"><path d="${d}" fill="#0C0704"/>${plis}</g>`;
}

/* ---------- le mobile : deux mots de papier, entiers et droits, I et A sur le même fil ---------- */
const FIL = 5;                                   // épaisseur des fils du mobile
const fil = (x, y0, y1) => `<path d="M${f(x)},${f(y0)} L${f(x)},${f(y1)}" stroke="${C.ombre}" stroke-width="${FIL}" stroke-linecap="round"/>`;
const oeil = (x, y) => `<circle cx="${f(x)}" cy="${f(y)}" r="6.5" fill="${C.ombre}"/><circle cx="${f(x)}" cy="${f(y)}" r="2.2" fill="#8A6440"/>`;
function mot(initiale, reste, xInit, base, tI, t, cv) {
  cv.font = `700 ${tI}px Fraunces`; const wI = cv.measureText(initiale).width;
  cv.font = `700 ${t}px Fraunces`; const wR = cv.measureText(reste).width;
  const gap = tI * 0.02;
  const svg = `<text x="${f(xInit)}" y="${f(base)}" font-family="Fraunces" font-weight="700" font-size="${tI}" fill="${C.ombre}">${initiale}</text>` +
    `<text x="${f(xInit + wI + gap)}" y="${f(base)}" font-family="Fraunces" font-weight="700" font-size="${t}" fill="${C.ombre}">${reste}</text>`;
  return { svg, wI, x1: xInit + wI + gap + wR };
}

/* ---------- la scène ---------- */
function scene() {
  let s = O.defs({ x: 900, y: 540, r: 1280 }) + O.toile();

  // 3. décor de brume : brume chaude, au loin la lampe du bureau du père
  s += O.brume(760, 600, 520, 300, .3, C.brume, 34) + O.brume(1500, 520, 420, 360, .28, C.brume, 34);
  s += `<g filter="url(#b9)" opacity=".28">${O.table(1730, SOL, 260, 170, C.brume2)}${O.lampe(1690, SOL - 170, 1.1, false, C.brume2)}</g>`;

  // cintres et rouages
  s += cintres();
  s += `<g filter="url(#b4)">${roue(250, 70, 110, 16, 20, { fill: '#160D06', arete: '#4A3019', op: .9 })}${roue(820, 46, 120, 18, 9, { fill: '#160D06', arete: '#4A3019', op: .9 })}</g>`;
  for (const x of [430, 560]) s += `<path d="M${x},0 L${x},${YT}" stroke="#2E1E12" stroke-width="2"/>`;
  const G = [
    { x: 1120, y: 96, r: 70, d: 13, rot: 0 },
    { x: 1240, y: 132, r: 54, d: 10, rot: 6 },
    { x: 1362, y: 98, r: 80, d: 15, rot: 14 },
    { x: 1500, y: 128, r: 62, d: 12, rot: 3 },
    { x: 1640, y: 92, r: 92, d: 17, rot: 11 },    // roue du père
  ];
  const GP = G[4];
  s += `<g opacity=".45" filter="url(#b2_5)">${roue(GP.x, GP.y, GP.r, GP.d, GP.rot + 7)}</g>`;
  for (const g of G) s += roue(g.x, g.y, g.r, g.d, g.rot);
  for (const g of G) s += `<path d="M${g.x - 6},${g.y} L${g.x + 6},${g.y} L${g.x + 14},${YT} L${g.x - 14},${YT} Z" fill="#0B0603"/>`;

  // 2c. le père, loin de la toile : ombre immense et pâle, flou léger, profil lisible (nez, col), tête droite ;
  // penché sur son pupitre et ses devis, les poignets tirés par deux tiges nettes
  // col relevé (dos et pointe avant) : il garde le cou et le col lisibles malgré le flou
  const COL = '<path d="M-26,-492 L-24,-522 L-8,-510 L-6,-494 Z"/><path d="M6,-497 L32,-508 L24,-486 Z"/>';
  const P = { x: 1300, y: 1172, s: 1.45, flip: 1, armF: [-58, -16], armB: [-46, -28], legF: [-4, 2], legB: [6, 2], head: 0, rivets: false, extra: COL };
  const [fx, fy] = O.mainPere(P, 'F'), [bx, by] = O.mainPere(P, 'B');
  const LOIN = '#3E2A18', TT = Math.max(fy, by) + 18;        // dessus du pupitre, sous ses mains
  const pupitre = `<path fill="${LOIN}" d="M${f(bx - 70)},${f(TT)} L${f(fx + 150)},${f(TT - 26)} L${f(fx + 150)},${f(TT - 6)} L${f(bx - 70)},${f(TT + 20)} Z"/>` +
    `<rect x="${f(fx + 96)}" y="${f(TT - 14)}" width="22" height="${f(1172 - TT)}" fill="${LOIN}"/><rect x="${f(bx - 40)}" y="${f(TT + 10)}" width="22" height="${f(1172 - TT)}" fill="${LOIN}"/>` +
    O.pile(fx + 110, TT - 24, 9, { w: 110, h: 9, gap: 3, seed: 9, fill: LOIN });
  s += `<g clip-path="url(#toileClip)"><g filter="url(#b4)" opacity=".6">${pupitre}${O.pere(Object.assign({}, P, { fill: LOIN }))}</g></g>`;
  // deux tiges nettes, des poignets aux manetons de la roue du père, à travers le lambrequin
  const m1 = [GP.x - 62, GP.y + 40], m2 = [GP.x + 30, GP.y + 66];
  s += tigeM(m1[0], m1[1], bx, by) + tigeM(m2[0], m2[1], fx, fy);
  s += maneton(m1[0], m1[1]) + maneton(m2[0], m2[1]);
  s += `<g fill="${C.ombre}"><circle cx="${f(fx)}" cy="${f(fy)}" r="7"/><circle cx="${f(bx)}" cy="${f(by)}" r="7"/></g>`;

  // 2b. la dernière marche (découpe nette) et la fillette, collée à la toile, sans tige, le menton dans les mains
  s += `<path fill="${C.ombre}" d="M742,${SOL} L742,840 L562,840 L562,752 L382,752 L382,664 L202,664 L202,576 L-20,576 L-20,${SOL} Z"/>`;
  s += `<g fill="${C.ombre}"><rect x="562" y="836" width="184" height="6"/><rect x="382" y="748" width="184" height="6"/><rect x="202" y="660" width="184" height="6"/></g>`;
  s += O.fille({ x: 712, y: 958, s: 1.0, flip: 1, seated: true, menton: true, head: 8 });

  // 1b. le mobile : « Interminable » au-dessus, « Attente » dessous, le I et le A centrés sur le même fil
  const cv = document.createElement('canvas').getContext('2d');
  const TI = 152, TR = 102, AX = 330;            // tailles (initiale, reste), axe vertical du I et du A
  cv.font = `700 ${TI}px Fraunces`;
  const wI = cv.measureText('I').width, wA = cv.measureText('A').width, cap = TI * 0.7;
  const B1 = 404, B2 = 556;                       // lignes de base
  const m1w = mot('I', 'nterminable', AX - wI / 2, B1, TI, TR, cv);
  const m2w = mot('A', 'ttente', AX - wA / 2, B2, TI, TR, cv);
  const xe1 = m1w.x1 - 28, xe2 = m2w.x1 - 24;     // fils de droite : au-dessus du dernier « e » de chaque mot
  const topFil = YB + 30;
  s += fil(AX, topFil, B1 - cap - 2) + fil(xe1, topFil, B1 - TR * 0.5) + oeil(AX, B1 - cap) + oeil(xe1, B1 - TR * 0.5);
  s += fil(AX, B1 + 4, B2 - cap - 2) + fil(xe2, B1 + 4, B2 - TR * 0.5) + oeil(AX, B2 - cap) + oeil(xe2, B2 - TR * 0.5);
  s += m1w.svg + m2w.svg;

  // sol de la toile, rebord de scène au premier plan, rideaux
  s += traverse();
  s += `<rect x="0" y="${SOL}" width="1920" height="${1080 - SOL}" fill="#140B06"/>`;
  s += `<g filter="url(#b9)"><rect x="-20" y="938" width="1960" height="160" fill="#0B0603"/><rect x="-20" y="936" width="1960" height="5" fill="#3A2716" opacity=".7"/></g>`;
  s += rideau('L') + rideau('R');
  s += O.voile();
  document.getElementById('s').innerHTML = s;
}
document.fonts.load('700 112px Fraunces').then(scene, scene);
</script></body></html>
