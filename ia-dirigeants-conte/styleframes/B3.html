<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>B3 · Le montreur · 39,5 s</title>
<link rel="stylesheet" href="_base.css"></head>
<body><div class="stage"><svg class="scene" id="s" viewBox="0 0 1920 1080"></svg>
<div class="sub">Le soir suivant, il poussait la <span class="k">balançoire</span></div></div>
<script src="_ombres.js"></script><script>
/* B3, 39,5 s : « Le soir suivant, il poussait la balançoire »
   Le monde doré : toile assombrie, silhouettes inversées en or, poussière d'étincelles. Deux groupes nettement séparés.
   À gauche, le père pousse la balançoire de ses propres mains, les deux mains posées sur le dos de sa fille ; de ses
   tiges, il ne reste que deux bouts coupés qui pendent du lambrequin, sous sa roue immobile ; la balançoire pend à
   cette même roue. À droite, l'horloge entière, dorée, roule sur sa tringle au-dessus de la file de devis : ses deux
   bras tiennent les fils qui font marcher les devis, sur leurs petites jambes, jusqu'à la pile dorée. */
const O = OMBRES, C = O.C;
const f = (n) => Math.round(n * 10) / 10, rad = (d) => d * Math.PI / 180;
const YT = 176, YB = 222, SOL = 905;

/* ---------- formes locales du théâtre (communes à B1, B2, B3) ---------- */
const cintres = () => `<defs><linearGradient id="cintGrad" x1="0" y1="0" x2="0" y2="${YT}" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#0A0603"/><stop offset=".55" stop-color="#1E130A"/><stop offset="1" stop-color="#43291A"/></linearGradient>
  <clipPath id="cintClip"><rect width="1920" height="${YT}"/></clipPath><clipPath id="toileClip"><rect y="${YB}" width="1920" height="${1080 - YB}"/></clipPath></defs>
  <rect width="1920" height="${YT}" fill="url(#cintGrad)"/>` + O.brume(1050, 150, 760, 90, .5, '#7A5232', 34);
function traverse() {
  const r = O.R(21); let s = `<rect x="-10" y="${YT}" width="1940" height="${YB - YT}" fill="#120A05"/>`;
  for (let i = 0; i < 8; i++) { const y = YT + 6 + r() * (YB - YT - 12);
    s += `<path d="M-10,${f(y)} C620,${f(y + (r() - .5) * 7)} 1300,${f(y + (r() - .5) * 7)} 1930,${f(y + (r() - .5) * 5)}" stroke="#2C1B0F" stroke-width="${f(1 + r() * 1.6)}" fill="none"/>`; }
  s += `<rect x="-10" y="${YT}" width="1940" height="3" fill="#7A5634" opacity=".75"/>`;
  for (let x = 70; x < 1920; x += 240) s += `<circle cx="${x}" cy="${(YT + YB) / 2}" r="5.5" fill="#3E2A18"/>`;
  let d = `M-20,${YB - 2} `; const w = 96, h = 30;
  for (let x = -20; x < 1940; x += w) d += `L${x},${YB} Q${x + w / 2},${YB + h * 2} ${x + w},${YB} `;
  d += `L1940,${YB - 2} Z`;
  s += `<path d="${d}" fill="#140B05"/>`;
  for (let x = -20; x < 1940; x += w) s += `<path d="M${x - 3},${YB} L${x + 3},${YB} L${x + 2},${YB + 22} C${x + 6},${YB + 26} ${x + 5},${YB + 34} ${x},${YB + 36} C${x - 5},${YB + 34} ${x - 6},${YB + 26} ${x - 2},${YB + 22} Z" fill="#140B05"/>`;
  return s;
}
function roue(cx, cy, r, dents, rot, o = {}) {
  const p = Object.assign({ fill: '#0B0603', arete: '#7A5634', rayons: 5, op: 1 }, o);
  let d = '';
  const n = dents * 2;
  for (let i = 0; i < n; i++) {
    const a0 = rad(rot + (i / n) * 360), a1 = rad(rot + ((i + 1) / n) * 360), rr = i % 2 === 0 ? r : r * 0.84;
    d += (i === 0 ? 'M' : 'L') + f(cx + rr * Math.cos(a0)) + ',' + f(cy + rr * Math.sin(a0)) + ' L' + f(cx + rr * Math.cos(a1)) + ',' + f(cy + rr * Math.sin(a1)) + ' ';
  }
  d += 'Z ';
  const ro = r * 0.68, ri = r * 0.26, k = p.rayons;
  for (let i = 0; i < k; i++) {
    const a0 = rot + i * 360 / k + 9, a1 = rot + (i + 1) * 360 / k - 9, b0 = a0 + 12, b1 = a1 - 12;
    const P = (rr, a) => `${f(cx + rr * Math.cos(rad(a)))},${f(cy + rr * Math.sin(rad(a)))}`;
    d += `M${P(ro, a0)} A${f(ro)},${f(ro)} 0 0 1 ${P(ro, a1)} L${P(ri, b1)} A${f(ri)},${f(ri)} 0 0 0 ${P(ri, b0)} Z `;
  }
  d += O.disque(cx, cy, r * 0.07);
  return `<g opacity="${p.op}"><path fill-rule="evenodd" d="${d}" fill="${p.arete}" opacity=".6" transform="translate(0,2.6)"/>` +
    `<path fill-rule="evenodd" d="${d}" fill="${p.fill}"/></g>`;
}
const maneton = (x, y, fill = '#0B0603') => `<circle cx="${f(x)}" cy="${f(y)}" r="8" fill="${fill}"/><circle cx="${f(x)}" cy="${f(y)}" r="3" fill="#7A5634"/>`;
const tigeM = (x0, y0, x1, y1, w = 3.2) => O.tige(x0, y0, x1, y1, w, '#120A05') +
  `<g clip-path="url(#cintClip)">${O.tige(x0 + 1.6, y0, x1 + 1.6, y1, 1.1, '#8A6440')}</g>`;
function rideau(cote) {
  const r = O.R(cote === 'L' ? 31 : 37); let d = '';
  const x0 = cote === 'L' ? -60 : 1980, dir = cote === 'L' ? 1 : -1, larg = cote === 'L' ? 190 : 170;
  d = `M${x0},-40 L${x0 + dir * larg},-40 `;
  for (let y = -40; y <= 1120; y += 90) d += `Q${f(x0 + dir * (larg - 22 + r() * 40))},${y + 45} ${f(x0 + dir * (larg - 8 + r() * 26))},${y + 90} `;
  d += `L${x0},1120 Z`;
  let plis = '';
  for (let i = 0; i < 3; i++) { const xx = x0 + dir * (50 + i * 45);
    plis += `<path d="M${xx},-40 C${xx + dir * 14},300 ${xx - dir * 10},700 ${xx + dir * 8},1120" stroke="#3B2616" stroke-width="14" fill="none" opacity=".85"/>`; }
  return `<g filter="url(#b14)"><path d="${d}" fill="#0C0704"/>${plis}</g>`;
}

/* ---------- formes locales du monde doré ---------- */
const OR = 'url(#orGrad)';
const RAIL = 672, HS = .8;                      // dessus de la tringle de l'horloge, échelle de l'horloge
// dégradés d'or à l'échelle de la scène (un seul dégradé par personnage, pas un par membre)
const orDefs = () => `<defs><linearGradient id="orP" x1="0" y1="380" x2="0" y2="${SOL}" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#F2C772"/><stop offset=".45" stop-color="#E0A84A"/><stop offset="1" stop-color="#C98A2E"/></linearGradient>
  <linearGradient id="orC" x1="0" y1="${RAIL - 494 * HS}" x2="0" y2="${RAIL}" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#F6CF7E"/><stop offset=".5" stop-color="#E0A84A"/><stop offset="1" stop-color="#C98A2E"/></linearGradient>
  <linearGradient id="orH" x1="0" y1="0" x2="0" y2="${YT}" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#C98A2E"/><stop offset="1" stop-color="#FFE7B0"/></linearGradient></defs>`;
// balançoire vue de profil : deux cordes de 5,5 px presque confondues, la planche vue par la tranche
function balProfil(xT, yT, L, ang, fill) {
  return `<g transform="translate(${f(xT)},${f(yT)}) rotate(${ang})" fill="${fill}">` +
    `<path d="M5,0 L5.4,${L} L10,${L} L9.6,0 Z" opacity=".7"/><path d="M-2.75,0 L-2.75,${L} L2.75,${L} L2.75,0 Z"/>` +
    `<rect x="-34" y="${L}" width="74" height="13" rx="3"/></g>`;
}
const siege = (xT, yT, L, ang) => [xT - L * Math.sin(rad(ang)) + 3, yT + L * Math.cos(rad(ang))];
// tige coupée : tronçon d'or qui pend, bout taillé en biseau
function tigeCoupee(x0, y0, x1, y1, w = 6) {
  const a = Math.atan2(y1 - y0, x1 - x0), nx = -Math.sin(a) * w / 2, ny = Math.cos(a) * w / 2;
  const bx = x1 + Math.cos(a) * 10, by = y1 + Math.sin(a) * 10;
  return `<path fill="${OR}" d="M${f(x0 + nx)},${f(y0 + ny)} L${f(x1 + nx)},${f(y1 + ny)} L${f(bx - nx)},${f(by - ny)} L${f(x0 - nx)},${f(y0 - ny)} Z"/>`;
}
// devis qui marche : feuille de face, deux petites jambes en pleine enjambée
function devisMarche(x, y, w, h, pas, rot) {
  const jy = y, jx = x + w / 2, L = 30;
  const jambe = (dx, ang) => { const ex = jx + dx - L * Math.sin(rad(ang)), ey = jy + L * Math.cos(rad(ang));
    return `<path d="M${f(jx + dx)},${f(jy)} L${f(ex)},${f(ey)}" stroke="#E0A84A" stroke-width="5" stroke-linecap="round"/>` +
      `<path d="M${f(ex - 3)},${f(ey - 2)} L${f(ex + 11)},${f(ey - 1)} L${f(ex + 11)},${f(ey + 4)} L${f(ex - 3)},${f(ey + 4)} Z" fill="#E0A84A"/>`; };
  return `<g>${jambe(-13, pas)}${jambe(13, -pas)}${O.devis(x, y - h, w, h, rot, OR)}</g>`;
}
// bras à deux segments (repère du kit : 0 = pendant, négatif = vers l'avant) qui amène le poignet en T
function ik(S, T, a, b) {
  const dx = T[0] - S[0], dy = T[1] - S[1], d = Math.min(Math.hypot(dx, dy), a + b - 1);
  const th = Math.atan2(-dx, dy) * 180 / Math.PI, be = Math.acos((a * a + d * d - b * b) / (2 * a * d)) * 180 / Math.PI;
  const sh = th + be, E = [S[0] - a * Math.sin(rad(sh)), S[1] + a * Math.cos(rad(sh))];
  const fa = Math.atan2(-(T[0] - E[0]), T[1] - E[1]) * 180 / Math.PI;
  return [f(sh), f(fa - sh)];
}
const tourne = (p, c, deg) => { const cs = Math.cos(rad(deg)), sn = Math.sin(rad(deg)), x = p[0] - c[0], y = p[1] - c[1];
  return [c[0] + x * cs - y * sn, c[1] + x * sn + y * cs]; };

/* ---------- la scène ---------- */
let s = O.defs({ nuit: true, x: 860, y: 540, r: 1250 }) + orDefs() + O.toile();

// 3. décor de brume : le jardin au loin, en or très éteint (inversé comme tout le monde doré), flou
s += O.brume(700, 560, 620, 340, .35, '#8A5E2A', 34) + O.brume(1450, 600, 520, 300, .22, '#8A5E2A', 34);
s += `<g filter="url(#b6)" opacity=".24">${O.arbre(200, SOL, 760, 11, { fill: '#C98A2E', lean: 4 })}${O.cloture(-20, 360, SOL, 120, 6, '#C98A2E')}</g>`;

// cintres : la nuit au-dessus de la toile, avec la lueur dorée des rouages
s += `<defs><clipPath id="cintClip"><rect width="1920" height="${YT}"/></clipPath></defs>`;
s += `<rect width="1920" height="${YT}" fill="#0C0703"/>` + O.brume(1100, 150, 820, 110, .5, '#6B4520', 34);
for (const x of [300, 380]) s += `<path d="M${x},0 L${x},${YT}" stroke="#3A2614" stroke-width="2"/>`;
const rOr = (g) => roue(g.x, g.y, g.r, g.d, g.rot, { fill: 'url(#orH)', arete: '#FFE7B0' });
// roue du père, immobile : la balançoire y pend, et les deux bouts de ses tiges coupées
const Fg = { x: 560, y: 96, r: 88, d: 16, rot: 8 };
// à droite, quelques rouages du Temps perdu tournent seuls (flou de rotation)
const G = [
  { x: 1250, y: 100, r: 70, d: 13, rot: 12 },
  { x: 1372, y: 132, r: 52, d: 10, rot: 0 },
  { x: 1496, y: 96, r: 80, d: 15, rot: 6 },
  { x: 1632, y: 130, r: 56, d: 11, rot: 9 },
];
s += `<g opacity=".38" filter="url(#b4)">${G.map((g) => roue(g.x, g.y, g.r, g.d, g.rot + 8, { fill: '#E0A84A', arete: '#FFE7B0' })).join('')}</g>`;
s += `<g filter="url(#glow)">${rOr(Fg)}${G.map(rOr).join('')}</g>`;
for (const g of [Fg, ...G]) s += `<path d="M${g.x - 6},${g.y} L${g.x + 6},${g.y} L${g.x + 14},${YT} L${g.x - 14},${YT} Z" fill="#0B0603"/>`;

// 2c. à droite : la tringle, l'horloge entière qui y roule, ses fils, la file de devis, la pile dorée
const DW = 74, DH = 98, DY = SOL - 30;
const D = [
  { x: 1128, pas: 22, rot: -4 },
  { x: 1262, pas: -18, rot: 3 },
  { x: 1396, pas: 20, rot: -3 },
  { x: 1530, pas: -16, rot: 4 },
];
// la pile dorée, sous la tringle
s += `<g filter="url(#glow)">${O.pile(1730, SOL, 18, { w: 150, h: 8, gap: 2.4, seed: 17, fill: OR })}</g>`;
// la tringle : barre dorée venue des coulisses de droite, butée ronde au bout
s += `<g filter="url(#glow)"><rect x="1092" y="${RAIL}" width="860" height="12" rx="3" fill="url(#orH)"/>` +
  `<circle cx="1094" cy="${RAIL + 6}" r="11" fill="#E0A84A"/></g>`;
for (let x = 1160; x < 1900; x += 120) s += `<circle cx="${x}" cy="${RAIL + 6}" r="2.6" fill="#7A5634"/>`;
// l'horloge, bras écartés, mains tenant les fils
const HX = 1362;
const H = { x: HX, y: RAIL, s: HS, heure: 60, minute: 180, balancier: -10, armL: [62, -28], armR: [-62, 28], fill: 'url(#orC)', rivets: true };
s += `<g filter="url(#glow)">${O.horloge(H)}</g>`;
// bout des mains (repère du kit : épaule, bras, avant-bras, puis la main arrondie)
const mainH = (sx, [sh, el]) => {
  const ex = sx - 52 * Math.sin(rad(sh)), ey = -190 + 52 * Math.cos(rad(sh));
  const wx = ex - 46 * Math.sin(rad(sh + el)), wy = ey + 46 * Math.cos(rad(sh + el));
  const tx = wx - 16 * Math.sin(rad(sh + el)), ty = wy + 16 * Math.cos(rad(sh + el));
  return [HX + tx * HS, RAIL + ty * HS];
};
const hL = mainH(-88, H.armL), hR = mainH(88, H.armR);
// les fils : deux par main, jusqu'au haut de chaque devis
let fils = '';
D.forEach((d, i) => { const h = i < 2 ? hL : hR, cx = d.x + DW / 2, cy = DY - DH + 4;
  fils += `<path d="M${f(h[0])},${f(h[1])} L${f(cx)},${f(cy)}" stroke="#E0A84A" stroke-width="5" stroke-linecap="round"/>` +
    `<circle cx="${f(cx)}" cy="${f(cy)}" r="5.5" fill="#FFE7B0"/>`; });
s += `<g filter="url(#glowS)">${fils}</g>`;
s += `<circle cx="${f(hL[0])}" cy="${f(hL[1])}" r="7" fill="#FFE7B0"/><circle cx="${f(hR[0])}" cy="${f(hR[1])}" r="7" fill="#FFE7B0"/>`;
let file = '';
for (const d of D) file += devisMarche(d.x, DY, DW, DH, d.pas, d.rot);
s += `<g filter="url(#glow)" opacity=".9">${file}</g>`;

// 2b. à gauche : la balançoire, pendue à la roue du père
const sw = { x: Fg.x + 50, y: 150, L: 520 }, ANG = -8;
const [sx, sy] = siege(sw.x, sw.y, sw.L, ANG), RG = ANG * .55;
const F = { x: sx - 4, y: sy + 112, s: 1.0, flip: 1, legF: [-80, 26], legB: [-74, 32], armF: [-168, 6], armB: [-160, 12], head: -4, fill: 'url(#orP)' };
// trace de l'élan : une traînée d'étincelles le long de l'arc, devant elle (aucun double de la fillette)
const rr = O.R(53); let arc = '';
for (let k = 0; k < 34; k++) { const a = ANG - 4 - k * 0.75, [ax, ay] = siege(sw.x, sw.y, sw.L, a);
  arc += `<circle cx="${f(ax + 30 + (rr() - .5) * 14)}" cy="${f(ay + 6 + (rr() - .5) * 10)}" r="${f(.8 + rr() * 2.2)}" fill="${rr() < .5 ? '#E0A84A' : '#FFE7B0'}" opacity="${f(.25 + .6 * (1 - k / 34))}"/>`; }
s += `<g filter="url(#glowS)">${arc}</g>`;
s += `<g filter="url(#glow)">${balProfil(sw.x, sw.y, sw.L, ANG, 'url(#orP)')}<g transform="rotate(${f(RG)},${f(sx)},${f(sy)})">${O.fille(F)}</g></g>`;
s += `<circle cx="${sw.x}" cy="${sw.y}" r="6" fill="#FFE7B0"/>`;

// 2a. le père pousse de ses propres mains : les deux mains posées à plat sur le dos de sa fille
// points du dos de la robe (repère de la fillette), tournés avec elle autour du siège
const dos = (lx, ly) => tourne([F.x + lx, F.y + ly], [sx, sy], RG);
const cHaut = dos(-30, -186), cBas = dos(-41, -150);
const P = { x: 0, y: SOL, s: .82, flip: 1, legF: [-26, 14], legB: [26, 6], head: -2, fill: 'url(#orP)' };
P.x = cHaut[0] - 168;
const Sf = [P.x + 6 * P.s, P.y - 478 * P.s], Sb = [P.x - 2 * P.s, P.y - 478 * P.s];
// le poignet s'arrête un peu avant le dos : la main (26 px du kit) vient s'y poser, sans espace
const avant = (S, T, k) => { const dx = T[0] - S[0], dy = T[1] - S[1], d = Math.hypot(dx, dy); return [T[0] - dx / d * k, T[1] - dy / d * k]; };
P.armF = ik(Sf, avant(Sf, cHaut, 13), 116 * P.s, 104 * P.s);
P.armB = ik(Sb, avant(Sb, cBas, 13), 116 * P.s, 104 * P.s);
s += `<g filter="url(#glow)">${O.pere(P)}</g>`;
// en haut, les deux bouts des tiges coupées, sous la roue du père, qui pendent du lambrequin
const c1 = [Fg.x - 58, Fg.y + 40], c2 = [Fg.x - 14, Fg.y + 70];
s += `<g filter="url(#glow)">${tigeCoupee(c1[0], c1[1], c1[0] + 26, 318)}${tigeCoupee(c2[0], c2[1], c2[0] - 24, 302)}</g>`;
s += maneton(c1[0], c1[1], '#E0A84A') + maneton(c2[0], c2[1], '#E0A84A');

// poussière d'étincelles : aux bouts coupés, au-dessus de la scène, autour de la pile
s += O.etincelles(c1[0] - 30, 300, c2[0] + 40, 360, 22, 41) +
  O.etincelles(200, 260, 1760, 620, 110, 47) + O.etincelles(1640, 600, 1820, 720, 26, 49);

// traverse, sol, rebord de scène, rideaux
s += traverse();
s += `<rect x="-10" y="${YT}" width="1940" height="2" fill="#E0A84A" opacity=".35"/>`;
s += `<rect x="0" y="${SOL}" width="1920" height="${1080 - SOL}" fill="#100805"/>`;
s += `<g opacity=".9">${O.herbes(0, 1920, SOL + 4, 26, 5, '#100805', 1.2)}</g>`;
s += `<g filter="url(#b9)"><rect x="-20" y="938" width="1960" height="160" fill="#0A0503"/><rect x="-20" y="936" width="1960" height="5" fill="#5A3D22" opacity=".6"/></g>`;
s += rideau('L') + rideau('R');
s += O.voile();
document.getElementById('s').innerHTML = s;
</script></body></html>
