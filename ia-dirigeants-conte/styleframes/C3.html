<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>C3 · La forêt de dossiers · 39,5 s</title>
<link rel="stylesheet" href="_base.css"></head>
<body><div class="stage"><svg class="scene" id="s" viewBox="0 0 1920 1080"></svg>
<div class="sub">Le soir suivant, il poussait la <span class="k">balançoire</span>.</div></div>
<script src="_ombres.js"></script><script>
/* C3, 39,5 s : « Le soir suivant, il poussait la balançoire. »
   Le monde doré : toile assombrie, ciel encore clair au ras de l'horizon. La forêt a disparu : il reste un seul arbre
   de lumière, dont le tronc est la dernière pile de dossiers devenue dorée et la couronne des feuilles de papier
   dorées. À sa grande branche pend la balançoire : le père vient de pousser sa fille (silhouettes inversées dorées,
   échos pâles de l'arc). Au pied de l'arbre, l'horloge dorée, au repos, lâche une dernière feuille ; des feuilles
   dorées montent en étincelles. */
const O = OMBRES, C = O.C;
const f = (n) => Math.round(n * 10) / 10, rad = (d) => d * Math.PI / 180;
const SOL = 904;

/* ---------- formes locales de la forêt de dossiers ---------- */
// bande effilée le long d'une courbe quadratique (feuille de papier vue par la tranche, qui dépasse comme une branche)
function bande(x0, y0, cx, cy, x1, y1, w0, w1) {
  const P = [], N = 8;
  for (let i = 0; i <= N; i++) { const t = i / N, u = 1 - t;
    P.push([u * u * x0 + 2 * u * t * cx + t * t * x1, u * u * y0 + 2 * u * t * cy + t * t * y1, w0 + (w1 - w0) * t]); }
  const L = [], Rr = [];
  for (let i = 0; i <= N; i++) {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(N, i + 1)];
    let nx = -(b[1] - a[1]), ny = b[0] - a[0]; const n = Math.hypot(nx, ny) || 1; nx /= n; ny /= n;
    L.push([P[i][0] + nx * P[i][2] / 2, P[i][1] + ny * P[i][2] / 2]); Rr.push([P[i][0] - nx * P[i][2] / 2, P[i][1] - ny * P[i][2] / 2]);
  }
  return `<path d="M${L.map((q) => f(q[0]) + ',' + f(q[1])).join(' L')} L${Rr.reverse().map((q) => f(q[0]) + ',' + f(q[1])).join(' L')} Z"/>`;
}
// petite feuille de devis (lignes de chiffres ajourées), pour le bout des branches et les feuilles qui tombent
function feuille(x, y, w, h, rot) {
  let d = `M${f(-w / 2)},${f(-h / 2)} L${f(w / 2)},${f(-h / 2)} L${f(w / 2)},${f(h / 2)} L${f(-w / 2)},${f(h / 2)} Z `;
  if (w > 20) for (let k = 0; k < 3; k++) { const yy = -h / 2 + h * (.22 + k * .22);
    d += `M${f(-w / 2 + w * .16)},${f(yy)} L${f(w / 2 - w * .16)},${f(yy)} L${f(w / 2 - w * .16)},${f(yy + Math.max(2, h * .07))} L${f(-w / 2 + w * .16)},${f(yy + Math.max(2, h * .07))} Z `; }
  return `<path fill-rule="evenodd" transform="translate(${f(x)},${f(y)}) rotate(${f(rot)})" d="${d}"/>`;
}
/* Tronc de dossiers : pile très haute et irrégulière de chemises (onglets), feuilles qui dépassent comme des branches,
   pied étalé en racines. pinch : [[y, force]] où la chaîne serre la pile. Rend { svg, tips } (bouts des branches). */
function tronc(x, yB, yT, o = {}) {
  const p = Object.assign({ w: 130, wT: .8, seed: 1, lean: 0, wob: 10, jit: 7, h: 12, gap: 3, fill: C.ombre, onglets: .3,
    branches: 6, bLen: 130, bY0: .22, persp: 0, roots: true, tilt: 1.4, feuilles: .6, pinch: [], br: null }, o);
  const r = O.R(p.seed), H = yB - yT, ph = r() * 6;
  const axe = (t) => x + p.lean * t + Math.sin(t * 4.2 + ph) * p.wob;
  const larg = (t) => p.w * (1 + (p.wT - 1) * t);
  let g = '', y = yB;
  if (p.roots) {   // racines : dossiers étalés et feuilles couchées au pied
    for (let i = 0; i < 3; i++) { const w = p.w * (1.5 - i * .18) * (.9 + r() * .2), th = p.h * (1 + r() * .4), cx = x + (r() - .5) * 18;
      g += `<rect x="${f(cx - w / 2)}" y="${f(y - th)}" width="${f(w)}" height="${f(th)}" transform="rotate(${f((r() - .5) * 2)},${f(cx)},${f(y)})"/>`;
      y -= th + p.gap * .6; }
    for (const sd of [-1, 1]) { const L = p.w * (.55 + r() * .3);
      g += `<path d="M${f(x + sd * p.w * .5)},${f(yB)} L${f(x + sd * (p.w * .5 + L))},${f(yB)} L${f(x + sd * (p.w * .5 + L * .9))},${f(yB - 6)} L${f(x + sd * p.w * .45)},${f(yB - 12)} Z"/>`; }
  }
  while (y > yT - 30) {
    const t = Math.min(1, (yB - y) / H), sc = 1 - p.persp * t;
    const th = p.h * sc * (.7 + r() * .7);
    let w = larg(t) * (.84 + r() * .26);
    for (const [py, pw] of p.pinch) { const dd = Math.abs(y - py); if (dd < 34) w *= 1 - pw * (1 - dd / 34); }
    const cx = axe(t) + (r() - .5) * p.jit, rot = (r() - .5) * p.tilt * 2;
    const tr = `transform="rotate(${f(rot)},${f(cx)},${f(y)})"`;
    g += `<rect x="${f(cx - w / 2)}" y="${f(y - th)}" width="${f(w)}" height="${f(th)}" ${tr}/>`;
    if (r() < p.onglets) { const tx = cx - w / 2 + w * (r() < .5 ? .08 : .64);
      g += `<rect x="${f(tx)}" y="${f(y - th - 4 * sc)}" width="${f(w * .24)}" height="${f(6 * sc)}" rx="2" ${tr}/>`; }
    y -= th + p.gap * sc * (.5 + r());
  }
  // branches : feuilles et chemises qui dépassent de la pile, en biais vers le haut, avec quelques feuilles au bout
  const tips = [];
  const list = p.br || Array.from({ length: p.branches }, (_, i) => ({ t: p.bY0 + (1 - p.bY0) * (i + r() * .8) / p.branches,
    side: i % 2 ? 1 : -1, ang: 14 + r() * 34, len: p.bLen * (.6 + r() * .7) }));
  for (const b of list) {
    const t = b.t, yy = yB - t * H, sc = 1 - p.persp * t, x0 = axe(t) + b.side * larg(t) * .4;
    const len = b.len * sc, a = rad(b.ang);
    const x1 = x0 + b.side * len * Math.cos(a), y1 = yy - len * Math.sin(a);
    const cx = x0 + b.side * len * .55 * Math.cos(a), cy = yy - len * .2 * Math.sin(a) + (b.sag || 10) * sc;
    g += bande(x0, yy, cx, cy, x1, y1, 11 * sc, 3.5 * sc);
    if (b.fourche !== false && r() < .8) {   // une seconde feuille plus courte, en fourche
      const a2 = a + rad(18 + r() * 20), l2 = len * (.35 + r() * .2), xm = x0 + b.side * len * .55 * Math.cos(a), ym = yy - len * .5 * Math.sin(a);
      g += bande(xm, ym + 4, xm + b.side * l2 * .5 * Math.cos(a2), ym - l2 * .4 * Math.sin(a2), xm + b.side * l2 * Math.cos(a2), ym - l2 * Math.sin(a2), 6 * sc, 2.4 * sc);
    }
    if (b.feuille !== false && r() < p.feuilles) g += feuille(x1 + b.side * 6 * sc, y1 + 10 * sc, 26 * sc, 34 * sc, b.side * (20 + r() * 50));
    tips.push([x1, y1]);
  }
  return { svg: `<g fill="${p.fill}">${g}</g>`, tips, axe: (yy) => axe(Math.min(1, Math.max(0, (yB - yy) / H))) };
}


/* ---------- la scène ---------- */
let s = O.defs({ x: 920, y: 640, r: 1500, nuit: true }) + O.toile();
s += `<defs>
<linearGradient id="orPere" gradientUnits="userSpaceOnUse" x1="0" y1="-610" x2="0" y2="0"><stop offset="0" stop-color="#FFE7B0"/><stop offset=".5" stop-color="#E0A84A"/><stop offset="1" stop-color="#C98A2E"/></linearGradient>
<linearGradient id="orFille" gradientUnits="userSpaceOnUse" x1="0" y1="-360" x2="0" y2="0"><stop offset="0" stop-color="#FFE7B0"/><stop offset=".55" stop-color="#E0A84A"/><stop offset="1" stop-color="#C98A2E"/></linearGradient>
<linearGradient id="orTronc" gradientUnits="userSpaceOnUse" x1="0" y1="260" x2="0" y2="${SOL}"><stop offset="0" stop-color="#F4CF86"/><stop offset=".55" stop-color="#D99A40"/><stop offset="1" stop-color="#A9701F"/></linearGradient>
<linearGradient id="orCime" gradientUnits="userSpaceOnUse" x1="0" y1="-60" x2="0" y2="420"><stop offset="0" stop-color="#E0A84A"/><stop offset="1" stop-color="#C98A2E"/></linearGradient>
<linearGradient id="crepuscule" x1="0" y1="420" x2="0" y2="${SOL}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#D9A35A" stop-opacity="0"/>
  <stop offset=".55" stop-color="#D9A35A" stop-opacity=".18"/><stop offset=".85" stop-color="#E8B86C" stop-opacity=".55"/><stop offset="1" stop-color="#F6D69A" stop-opacity=".82"/></linearGradient>
<filter id="glowT" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
  <feFlood flood-color="#F2C46A" flood-opacity=".45"/><feComposite in2="b" operator="in" result="h"/><feMerge><feMergeNode in="h"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="monte" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="1.5 4"/></filter>
</defs>`;

// 4. le ciel encore clair au ras de l'horizon, collines lointaines : la forêt n'y est plus
s += `<rect x="0" y="420" width="1920" height="${SOL - 420}" fill="url(#crepuscule)"/>`;
s += `<ellipse cx="1080" cy="${SOL - 20}" rx="720" ry="80" fill="#F6DCA4" opacity=".32" filter="url(#b34)"/>`;
s += `<g filter="url(#b4)" fill="#3E2714" opacity=".9"><path d="M-20,${SOL - 22} C260,${SOL - 50} 520,${SOL - 34} 820,${SOL - 46} C1120,${SOL - 58} 1460,${SOL - 30} 1940,${SOL - 52} L1940,${SOL + 30} L-20,${SOL + 30} Z"/></g>`;

// 2. l'arbre de lumière : tronc de dossiers dorés, couronne de branches et de feuilles de papier dorées
const XT = 560;
const T = tronc(XT, SOL, 300, { w: 158, wT: .72, seed: 5, lean: 26, wob: 8, h: 14, gap: 3.6, fill: 'url(#orTronc)', onglets: .3, branches: 0 });
const xh = T.axe(300);
// branches maîtresses (bois de lumière), la grande branche de la balançoire vers la droite
let br = '';
br += bande(xh - 30, 318, xh - 160, 220, xh - 330, 120, 40, 12);
br += bande(xh - 6, 304, xh - 10, 160, xh + 40, -40, 42, 14);
br += bande(xh + 30, 316, xh + 170, 210, xh + 330, 70, 40, 12);
const GB = [xh + 40, 340, xh + 420, 236, 1560, 312];          // la grande branche de la balançoire
// rameaux courts le long de la grande branche (hors de l'aplomb de la balançoire), fourche au bout
function rameaux() {
  const q = O.R(57); let g = '';
  const pt = (t) => { const [x0, y0, cx, cy, x1, y1] = GB, u = 1 - t; return [u * u * x0 + 2 * u * t * cx + t * t * x1, u * u * y0 + 2 * u * t * cy + t * t * y1]; };
  for (const [t, up, l, a] of [[.3, 1, 90, 58], [.42, 1, 120, 40], [.55, -1, 60, 30], [.86, 1, 110, 50], [.94, -1, 70, 24], [1, 1, 80, 14]]) {
    const [x, y] = pt(t), aa = rad(a);
    g += bande(x, y, x + l * .5 * Math.cos(aa), y - up * l * .3 * Math.sin(aa) - (up < 0 ? -8 : 8), x + l * Math.cos(aa), y - up * l * Math.sin(aa), 9, 3);
    if (q() < .8) g += feuille(x + l * Math.cos(aa) + 6, y - up * l * Math.sin(aa) + (up < 0 ? 14 : -4), 16, 20, q() * 90 - 45);
  }
  return g;
}
br += bande(...GB, 46, 12);
s += `<g fill="url(#orCime)" filter="url(#glowT)" opacity=".92">${br}` +
  O.arbre(xh - 330, 128, 300, 81, { fill: 'url(#orCime)', lean: -40, depth: 4, w: 12 }) +
  O.arbre(xh + 40, -30, 260, 82, { fill: 'url(#orCime)', lean: 6, depth: 4, w: 13 }) +
  O.arbre(xh + 330, 78, 300, 83, { fill: 'url(#orCime)', lean: 34, depth: 4, w: 12 }) +
  rameaux() + `</g>`;
s += `<g filter="url(#glowT)">${T.svg}</g>`;
// feuilles de papier dorées dans la couronne
const rf = O.R(19); let fe = '';
for (let i = 0; i < 70; i++) {
  const a = rf() * Math.PI * 2, rr = Math.sqrt(rf());
  const x = xh + 160 + Math.cos(a) * rr * 640, y = 150 + Math.sin(a) * rr * 210;
  if (y > 300 && x > 900) continue;   // la balançoire garde son ciel
  fe += `<g opacity="${f(.45 + rf() * .55)}">${feuille(x, y, 16 + rf() * 10, 20 + rf() * 12, rf() * 360)}</g>`;
}
s += `<g fill="url(#orGrad)" filter="url(#glowS)">${fe}</g>`;

// au pied de l'arbre, l'horloge dorée au repos : d'un bras court, elle lâche une dernière feuille, qui monte
const Hc = { x: 372, y: SOL, s: .56, balancier: -8, heure: 120, minute: -60, armL: [26, -16], armR: [-150, 20], or: true };
s += `<g opacity=".9">${O.horloge(Hc)}</g>`;
// feuilles dorées qui montent en étincelles, de la main de l'horloge vers la couronne (échos en dessous : elles montent)
const monte = (x, y, w, rot, k) => `<g fill="url(#orGrad)"><g opacity="${f(.16 * k)}" filter="url(#monte)">${feuille(x + 10, y + 46, w, w * 1.3, rot + 30)}</g>` +
  `<g opacity="${f(.32 * k)}" filter="url(#monte)">${feuille(x + 4, y + 22, w, w * 1.3, rot + 14)}</g><g opacity="${k}" filter="url(#glowS)">${feuille(x, y, w, w * 1.3, rot)}</g></g>`;
s += monte(468, 640, 24, -20, 1) + monte(420, 520, 20, 16, .85) + monte(476, 430, 16, -8, .7) + monte(392, 360, 12, 30, .55);
let tr = ''; const rt = O.R(23);
for (let i = 0; i < 40; i++) { const t = rt(), x = 440 + Math.sin(t * 9) * 50 + (rt() - .5) * 60, y = 700 - t * 520;
  tr += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(.8 + Math.pow(rt(), 3) * 3)}" fill="${rt() < .5 ? C.orClair : '#FFE7B0'}" opacity="${f(.3 + rt() * .6)}"/>`; }
s += `<g filter="url(#glowS)">${tr}</g>`;

// la balançoire pend à la grande branche ; la fillette vient de partir des mains du père (échos de l'arc)
const surBr = (x) => { const [x0, y0, cx, cy, x1, y1] = GB; let best = [1e9, y0];
  for (let i = 0; i <= 80; i++) { const t = i / 80, u = 1 - t, xx = u * u * x0 + 2 * u * t * cx + t * t * x1, yy = u * u * y0 + 2 * u * t * cy + t * t * y1;
    if (Math.abs(xx - x) < best[0]) best = [Math.abs(xx - x), yy]; } return best[1]; };
const piv = [1326, surBr(1326) + 6], L = 404, sF = .72;
const balEtFille = (ang) => O.balancoire(piv[0], piv[1], piv[1] + L, ang, 'url(#orGrad)') +
  `<g transform="rotate(${ang},${piv[0]},${piv[1]})">` +
  O.fille({ x: piv[0] - 6, y: piv[1] + L - 4 + 112 * sF, s: sF, seated: true, fill: 'url(#orFille)', armF: [-110, -60], armB: [140, 30], head: -10 }) + `</g>`;
s += `<g opacity=".13" filter="url(#b4)">${balEtFille(8)}</g><g opacity=".27" filter="url(#b2_5)">${balEtFille(-6)}</g>`;
s += `<g filter="url(#glow)">${balEtFille(-21)}</g>`;
// le père, doré, les bras encore tendus vers l'avant
s += `<g filter="url(#glow)">${O.pere({ x: 1110, y: SOL + 4, s: .74, fill: 'url(#orPere)', armF: [-60, -12], armB: [-68, -6], legF: [-22, 8], legB: [26, 4], head: -4 })}</g>`;

// traînée d'étincelles le long de l'arc, poussière dans l'air du soir
const r = O.R(77); let arc = '';
for (let i = 0; i < 44; i++) {
  const a = 10 - r() * 33, rr = L - 50 - r() * 170;
  const x = piv[0] - rr * Math.sin(rad(a)) + (r() - .5) * 26, y = piv[1] + rr * Math.cos(rad(a)) + (r() - .5) * 26;
  arc += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(.8 + Math.pow(r(), 3) * 3.4)}" fill="${r() < .5 ? C.orClair : '#FFE7B0'}" opacity="${f(.3 + r() * .6)}"/>`;
}
s += `<g filter="url(#glowS)">${arc}</g>`;
s += O.etincelles(120, 40, 1880, 820, 80, 12);

// sol, herbes de la colline
s += `<rect x="-20" y="${SOL}" width="1960" height="60" fill="${C.ombre}"/>`;
s += O.herbes(-10, 1930, SOL + 8, 40, 9, C.ombre, 1.3);
// 1. avant-plan : grandes herbes et une branche sombres, floues, coupées par les bords du cadre
const touffe = (x0, x1, y, h, seed) => { const q = O.R(seed); let dd = '';
  for (let x = x0; x < x1; x += 26 + q() * 30) { const hh = h * (.45 + q() * .6), lean = (q() - .5) * hh * .7, w = 16 + q() * 20;
    dd += `M${f(x)},${y} Q${f(x + lean * .25)},${f(y - hh * .6)} ${f(x + lean)},${f(y - hh)} Q${f(x + lean * .3 + w)},${f(y - hh * .5)} ${f(x + w)},${y} Z `; }
  return `<path d="${dd}"/>`; };
s += `<g filter="url(#b14)" fill="#0B0603">${touffe(1620, 1990, 1040, 420, 21)}${touffe(-60, 250, 1040, 360, 25)}</g>`;
s += `<g filter="url(#b14)" fill="#0B0603" opacity=".92">${bande(-60, 250, 140, 120, 330, -60, 70, 30)}${feuille(150, 170, 70, 90, 30)}${feuille(250, 40, 64, 80, -24)}</g>`;
const bk = O.R(91); let bo = '';
for (const [x, y, rr] of [[1840, 300, 30], [1620, 150, 16], [90, 120, 26], [860, 560, 14], [1880, 640, 22], [260, 420, 18]]) bo += `<circle cx="${x}" cy="${y}" r="${rr}" fill="#F2C46A" opacity="${f(.16 + bk() * .16)}"/>`;
s += `<g filter="url(#b9)">${bo}</g>`;
// sol au premier plan (bande des sous-titres)
s += `<rect x="0" y="940" width="1920" height="140" fill="#0B0603"/>`;
s += O.voile();
document.getElementById('s').innerHTML = s;
</script></body></html>
