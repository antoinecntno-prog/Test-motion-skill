      CELLS.forEach(function (c, i) {

        tw(c.q, { o: 0 }, { o: 1 }, 0.01, "none", T);

      tw(PEN, { u: 16 }, { u: 17 }, 0.12, "power2.out", 5.24);

      /* ---- la phrase de la voix : mot par mot (0 → 0,35 → 1), chaque mot 1 image avant son temps ; une boîte par phrase ---- */
      function sayWords(spans, listW) {
        spans.forEach(function (w, i) {
          var st = Math.max(0, listW[i][1] - 1 / 30), kw = listW[i][2] === "box";

      ft(sp2[7].querySelector(".aq-box"), BOXZ, BOX2, 4.96);

      ft(sp1[6].querySelector(".aq-stroke"), { scaleX: 0, rotation: -1.2 }, { scaleX: 1, rotation: -1.2, duration: 0.40, ease: "power2.out" }, 1.80);
      // la phrase sort avant la suivante et avant la couture (opacité 1 → 0, flou 0 → 6 px, 0,14 s)
      ft(s1, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.46);
      ft(s2, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 5.24);

      // durée exacte de la séquence
      tl.set({}, {}, DUR);

      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
