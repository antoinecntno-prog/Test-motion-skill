      // 3.20 il se penche à -28° et glisse vers le bord de la copie (x +60, 0,2 s)
      tw(PEN, { a: 146, x: 2660 }, { a: 152, x: 2720 }, 0.20, "power2.out", 3.20);
      // 3.40 la première copie se tourne sur son bord gauche (rotateY 0 → -170°, 0,24 s power2.in) ; son ombre passe sur la deuxième
      ft(pcs, { rotateY: 0 }, { rotateY: -170, duration: 0.24, ease: "power2.in" }, 3.40);
      ft(pbh, { opacity: 0 }, { opacity: 0.18, duration: 0.12, ease: "power1.in" }, 3.40); ft(pbh, { opacity: 0.18 }, { opacity: 0, duration: 0.12, ease: "power1.out" }, 3.52);
      // 3.72 le stylo remonte de 20 u ; 3.88 il repart vers le bord
      tw(PEN, { y: 440 }, { y: 420 }, 0.10, "power2.out", 3.72);
      tw(PEN, { x: 2720, y: 420 }, { x: 2740, y: 426 }, 0.12, "power2.inOut", 3.88);

      /* ---- scène 3 (4.00 à 5.16) : deuxième copie tournée, rien à annoter, le stylo se pose, whip ---- */
      // 4.04 la deuxième copie se tourne et montre la troisième, grise ; son ombre passe
      ft(pbs, { rotateY: 0 }, { rotateY: -170, duration: 0.24, ease: "power2.in" }, 4.04);
      ft(pah, { opacity: 0 }, { opacity: 0.18, duration: 0.12, ease: "power1.in" }, 4.04); ft(pah, { opacity: 0.18 }, { opacity: 0, duration: 0.12, ease: "power1.out" }, 4.16);
      // 4.36 le stylo descend sur la troisième copie (y +60, 0,12 s power2.in), pointe à 10 u du papier ; 4.52 il remonte de 8 u : rien à annoter
      tw(PEN, { y: 426 }, { y: 486 }, 0.12, "power2.in", 4.36);
      tw(PEN, { y: 486 }, { y: 478 }, 0.10, "power2.out", 4.52);
      // 4.70 il bascule à plat (-34 → -6°) et se pose sur la copie à (2520, 500), petit rebond de 6 u
      tw(PEN, { a: 152, x: 2740, y: 478 }, { a: 174, x: 2520, y: 500 }, 0.20, "power2.in", 4.70);
      tw(PEN, { y: 500 }, { y: 494 }, 0.04, "power2.out", 4.90); tw(PEN, { y: 494 }, { y: 500 }, 0.04, "power2.in", 4.94);
      // 4.86 les copies se tassent sous le stylo (×1 → 0,99) ; P3 redevient nette avant la couture
      ft([pa, pb, pc], { scale: 1 }, { scale: 0.99, duration: 0.10, ease: "power2.out" }, 4.86);
      tw(DOF, { p3: 7 }, { p3: 0 }, 0.16, "power2.out", 4.86);

      /* ---- la phrase de la voix : mot par mot (0 → 0,35 → 1), chaque mot 1 image avant son temps ; la boîte « Lundi » tracée à 0.18 ---- */
      function sayWords(spans, listW) {
        spans.forEach(function (w, i) {
          var st = Math.max(0, listW[i][1] - 1 / 30), kw = listW[i][2] === "box";
          ft(w, { y: 8, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, st);
          if (kw) ft(w, { opacity: 0 }, { opacity: 1, duration: 0.10, ease: "power2.out" }, st);
          else {
            ft(w, { opacity: 0 }, { opacity: 0.35, duration: 0.08, ease: "power2.out" }, st);
            ft(w, { opacity: 0.35 }, { opacity: 1, duration: 0.20, ease: "power1.out" }, st + 0.10);

      // la phrase sort de 2.72 à 2.86 (opacité 1 → 0, flou 0 → 6 px) ; aucun texte ensuite
      ft(s1, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.72);

      // durée exacte de la séquence
      tl.set({}, {}, DUR);

      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
