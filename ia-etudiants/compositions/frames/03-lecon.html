      sayWords(sp1, W1S); sayWords(sp2, W2S); sayWords(sp3, W3S);
      function boxAt(span, pos) {

          { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0, skewY: 0, duration: 0.16, ease: "power3.out" }, pos);
      }
      boxAt(sp1[4], 0.98); boxAt(sp2[4], 2.46); boxAt(sp3[1], 3.30);
      // chaque phrase sort avant la suivante et avant la couture (opacité 1 → 0, flou 0 → 6 px, 0,14 s)
      ft(s1, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.46);
      ft(s2, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.86);
      ft(s3, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 5.66);

      // durée exacte de la séquence
      tl.set({}, {}, DUR);

      // première image = handoff_in, avant tout seek
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
