      ft(non, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.25, ease: "power1.inOut" }, 2.56);
      // 2.70 la tache de droite sèche (aqDry 0 → 1 en 0,35 s : séchée à la couture)
      tw(WR, { dry: 0 }, { dry: 1 }, 0.35, "power1.inOut", 2.70);

      /* ---- la phrase de la voix : mot par mot (0 → 0,35 → 1), chaque mot 1 image avant son temps ; une boîte par phrase ---- */
      function sayWords(spans, listW) {
        spans.forEach(function (w, i) {
          var st = Math.max(0, listW[i][1] - 1 / 30), kw = listW[i][2] === "box";
          ft(w, { y: 8, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, st);
          if (kw) ft(w, { opacity: 0 }, { opacity: 1, duration: 0.10, ease: "power2.out" }, st);
          else {
            ft(w, { opacity: 0 }, { opacity: 0.35, duration: 0.08, ease: "power2.out" }, st);
            ft(w, { opacity: 0.35 }, { opacity: 1, duration: 0.20, ease: "power1.out" }, st + 0.10);
          }
        });
      }
      sayWords(sp1, W1S);
      sayWords(sp2, W2S);
      var BOXZ = { scaleX: 0, scaleY: 1, rotation: 0, skewX: 0, skewY: 0 }, BOX1 = { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0, skewY: 0, duration: 0.16, ease: "power3.out" };
      ft(sp2[3].querySelector(".aq-box"), BOXZ, BOX1, 2.45);
      // le premier morceau sort avant le second (1.76 à 1.90) ; le second sort avant la couture (2.86 à 3.00)
      ft(s1, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.76);
      ft(s2, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.86);

      // durée exacte de la séquence
      tl.set({}, {}, DUR);

      // première image = handoff_in, avant tout seek
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
