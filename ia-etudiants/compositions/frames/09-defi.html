      tw(DG[4], { y: 0 }, { y: -74 }, 0.12, "power2.out", 1.36); tw(HA, { r: 0 }, { r: 6 }, 0.12, "power2.out", 1.36);

      tw(DG[4], { y: -74 }, { y: -148 }, 0.12, "power2.out", 1.88); tw(HA, { r: 12 }, { r: 18 }, 0.04, "power2.out", 1.88);

      // 2.00 les étiquettes des colonnes s'écrivent (masque 0,2 s)
      [lbl1, lbl2].forEach(function (l, i) {

      tw(CW, { l: 0, r: 0 }, { l: 1, r: 1 }, 0.40, "power2.out", 3.04);

      FA.forEach(function (a, i) { tw(a, { k: 0 }, { k: 1 }, 0.16, "expo.out", 3.30 + i * 0.03); });

      function sayWords(spans, listW) {

      ft(s1, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 3.52);

      tl.set({}, {}, DUR);

      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
