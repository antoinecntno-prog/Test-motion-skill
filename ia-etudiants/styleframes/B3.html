<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>B3 · La goutte d'eau · 26 s</title>
<link rel="stylesheet" href="_base.css">
<style>
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px}
.chat{position:absolute;left:360px;top:200px;width:900px;height:560px;font-family:"DM Sans",sans-serif;color:var(--ink)}
.chat .t{position:absolute;left:34px;top:18px;font:600 22px/1 "DM Sans";color:var(--ink-2);letter-spacing:.04em}
.chat .row{position:absolute;left:34px;right:34px;height:84px;font:500 28px/84px "DM Sans";color:var(--ink);padding-left:110px}
.chat .row i{position:absolute;left:0;top:12px;width:60px;height:60px;border-radius:50%}
.chat .row small{margin-left:16px;font:400 24px/1 "Caveat",cursive;color:var(--bordeaux)}
</style></head><body>
<div class="stage">
  <svg class="scene" id="s" viewBox="0 0 1920 1080"></svg>
  <div class="chat">
    <div class="t">ATELIER · APPRENDRE AVEC L'IA</div>
    <div class="row" style="top:92px"><i id="i1"></i>Questionner <small>la bonne question d'abord</small></div>
    <div class="row" style="top:196px"><i id="i2"></i>Vérifier <small>d'où vient cette source ?</small></div>
    <div class="row" style="top:300px"><i id="i3"></i>Contredire <small>et si c'était faux ?</small></div>
    <div class="row" style="top:404px"><i id="i4"></i>Créer <small>avec elle, pas à sa place… à ta façon</small></div>
  </div>
  <svg class="scene" id="s2" viewBox="0 0 1920 1080"></svg>
  <div class="paper"></div><div class="fibres"></div>
  <div class="sub">à la questionner, à la <span class="box">vérifier</span>, à la contredire,</div>
</div>
<script src="_aquarelle.js"></script>
<script>
const svg = document.getElementById("s"), over = document.getElementById("s2"); const { aqDefs, aqWash, aqInk, aqDrop, aqWindow, el } = AQ; aqDefs(svg); aqDefs(over);
// le pigment ocre revenu : grand lavis sous la fenêtre
aqWash(svg, { cx: 820, cy: 520, r: 560, seed: 12, w: 0.14, n: 12, ry: 0.72 }, "#EFD7A6", 0.5, true);
aqWindow(svg, 340, 180, 940, 600, { barH: 64 });
// quatre touches de pigment, une par ligne, de plus en plus franches
[[404, 334, "#C98A2E"], [404, 438, "#C98A2E"], [404, 542, "#9B2F3F"], [404, 646, "#7A1E2E"]].forEach(([x, y, c], i) => aqDrop(svg, x, y, 30 + i * 2, c, 20 + i, over));
// la trace ocre qui continue vers la droite, hors de la fenêtre, et une goutte qui mène
aqWash(svg, "M1270 560 C 1340 540 1420 560 1500 600 C 1580 640 1660 640 1760 600 L 1766 614 C 1664 656 1578 656 1494 614 C 1416 576 1340 556 1272 574 Z", "#C98A2E", 0.7, false, over);
aqDrop(svg, 1790, 596, 36, "#C98A2E", 30, over);
// avant-plan : une grande goutte ocre floue qui tombe, coupée par le bord haut
const fg = el("g", { filter: "url(#aq-blur)", opacity: 0.55 }, over);
aqWash(svg, { cx: 1560, cy: 120, r: 110, seed: 31, w: 0.16, n: 8 }, "#C98A2E", 0.8, false, fg);
</script>
</body></html>
