      ft(note1, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.30, ease: "power1.inOut" }, 0.80);
      // 0.96 les deux lavis gris de la nuit montent en haut (coup de pinceau 0,2 s chacun)
      tw(NW[0], { k: 0 }, { k: 1 }, 0.20, "expo.out", 0.96);
      tw(NW[1], { k: 0 }, { k: 1 }, 0.20, "expo.out", 1.06);

      /* ---- scène 2 (1.20 à 3.00) : cran vers le portable, sa diapositive ---- */
      // profondeur : pendant le cran, la lampe et la nuit passent au fond (flou 6 px) ; le portable reste net
      tw(DOF, { lamp: 0, night: 0 }, { lamp: 6, night: 6 }, 0.30, "power2.inOut", 1.10);
      // 1.29 « Vous » : le portable se pose sur le bureau (×1,1 flou 6 → net, 0,12 s)
      tw(LAP, { o: 0 }, { o: 1 }, 0.02, "none", 1.29);
      tw(LAP, { k: 1.1, b: 6 }, { k: 1, b: 0 }, 0.12, "power2.out", 1.29);
      // 1.42 son écran s'allume en gris (lavis gris-lavis ×0,2 → 1 depuis le centre, 0,12 s)
      tw(GLW, { o: 0 }, { o: 1 }, 0.02, "none", 1.42);
      tw(GLW, { k: 0.2 }, { k: 1 }, 0.12, "expo.out", 1.42);
      // 1.56 « préparez » : la diapositive se dessine dans l'écran (cadre 420 × 240 tracé 0,2 s power2.out, le papier paper-2 suit)
      tw(SLA, { f: 0 }, { f: 1 }, 0.20, "power2.out", 1.56);
      // 1.74 le bloc de titre gris se pose (×1,1 flou 4 → net, 0,1 s)
      tw(TTL, { o: 0 }, { o: 1 }, 0.02, "none", 1.74);
      tw(TTL, { k: 1.1, b: 4 }, { k: 1, b: 0 }, 0.10, "power2.out", 1.74);
      // 1.94 « le » : les cinq lignes grises se révèlent (0,08 s chacune, 0,06 s d'écart) jusqu'à 2.26
      ["p0", "p1", "p2", "p3", "p4"].forEach(function (key, i) { var f = {}, t = {}; f[key] = 0; t[key] = 1; tw(LN, f, t, 0.08, "power2.out", 1.94 + i * 0.06); });
      // 2.18 « cours » : la diapositive défile (le contenu A glisse de -420, le même B revient de +420, 0,18 s power2.in)
      tw(SL, { a: 0, b: 420 }, { a: -420, b: 0 }, 0.18, "power2.in", 2.18);
      // 2.40 la lueur de la lampe vacille (0,75 → 0,6 → 0,75, 0,16 s)
      tw(LG, { o: 0.75 }, { o: 0.6 }, 0.08, "power1.inOut", 2.40); tw(LG, { o: 0.6 }, { o: 0.75 }, 0.08, "power1.inOut", 2.48);
      // 2.58 « demain » : la lueur se tasse (×1,02 → 1)
      tw(LG, { k: 1 }, { k: 1.02 }, 0.04, "power2.out", 2.54); tw(LG, { k: 1.02 }, { k: 1 }, 0.10, "power2.out", 2.58);
      // 2.60 A, caché sous le cadre, repasse à droite ; 2.80 la diapositive défile une seconde fois, identique (B sort, A revient)
      tw(SL, { a: -420 }, { a: 420 }, 0.001, "none", 2.60);
      tw(SL, { a: 420, b: 0 }, { a: 0, b: -420 }, 0.18, "power2.in", 2.80);

      /* ---- scène 3 (3.00 à 4.60) : cran vers la pile identique, « l'an dernier », whip vers la salle ---- */
      // profondeur : pendant le cran vers la pile, le portable passe flou (6 px) au bord gauche ; la pile reste nette
      tw(DOF, { lap: 0 }, { lap: 6 }, 0.30, "power2.inOut", 2.90);
      // 3.15 « Le » : la première diapositive glisse depuis la droite (x +400 → 0, flou 6 → net, 0,14 s power2.in) ; 3.28, 3.36, 3.44 : trois autres dessus (9°, 13°, 18°)
      cards.forEach(function (c, i) {
        var T = [3.15, 3.28, 3.36, 3.44][i];
        tw(c.q, { o: 0 }, { o: 1 }, 0.02, "none", T);
        tw(c.q, { x: 400, b: 6 }, { x: 0, b: 0 }, 0.14, "power2.in", T);
      });
      // 3.52 « même » : la pile se tasse (×1 → 0,99)
      tw(PILE, { k: 1 }, { k: 0.99 }, 0.12, "power2.out", 3.52);
      // 3.66 les blocs de titre et les lignes grises des cartes se révèlent (masque 0,2 s, de gauche à droite)
      tw(CDT, { k: 0 }, { k: 1 }, 0.20, "power2.out", 3.66);
      // 3.90 « l'an » : la note « l'an dernier » se révèle sur le coin de la carte du dessus (masque 0,3 s, penchée de -3°)
      ft(note2, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 3.90);
      ft(note2, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.30, ease: "power1.inOut" }, 3.90);
      // 4.14 « dernier » : la carte du dessus se soulève de 6 u et retombe (0,1 s)
      tw(PILE, { lift: 0 }, { lift: 6 }, 0.05, "power2.out", 4.14); tw(PILE, { lift: 6 }, { lift: 0 }, 0.05, "power2.in", 4.19);
      // 4.30 un lavis gris à 20 % se pose sur la pile (coup de pinceau 0,2 s)
      tw(PW, { k: 0 }, { k: 1 }, 0.20, "expo.out", 4.30);
      // profondeur : P2 (bord droit) redevient nette avant le whip pour arriver au repos ; la lampe, la nuit et le portable se raffermissent sous le flou de la couture
      tw(DOF, { p2: 7 }, { p2: 0 }, 0.32, "power1.inOut", 4.20);
      tw(DOF, { lamp: 6, night: 6, lap: 6 }, { lamp: 0, night: 0, lap: 0 }, 0.08, "power2.in", 4.52);

      /* ---- la phrase de la voix : mot par mot (0 → 0,35 → 1), chaque mot 1 image avant son temps ; une boîte par phrase ---- */
      function sayWords(spans, listW) {
        spans.forEach(function (w, i) {
          var st = Math.max(0, listW[i][1] - 1 / 30), kw = listW[i][2] === "box";
          ft(w, { y: 8, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, st);
          if (kw) ft(w, { opacity: 0 }, { opacity: 1, duration: 0.10, ease: "power2.out" }, st);
          else {
            ft(w, { opacity: 0 }, { opacity: 0.35, duration: 0.08, ease: "power2.out" }, st);
            ft(w, { opacity: 0.35 }, { opacity: 1, duration: 0.20, ease: "power1.out" }, st + 0.10);
          }
        });
      }
      sayWords(sp1, W1S);
      sayWords(sp2, W2S);
      sayWords(sp3, W3S);
      var BOXZ = { scaleX: 0, scaleY: 1, rotation: 0, skewX: 0, skewY: 0 }, BOX1 = { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0, skewY: 0, duration: 0.16, ease: "power3.out" };
      ft(sp1[0].querySelector(".aq-box"), BOXZ, BOX1, 0);
      var BOX2 = {}; for (var bk in BOX1) BOX2[bk] = BOX1[bk];
      ft(sp2[5].querySelector(".aq-box"), BOXZ, BOX2, 2.54);
      var BOX3 = {}; for (var bk3 in BOX1) BOX3[bk3] = BOX1[bk3];
      ft(sp3[1].querySelector(".aq-box"), BOXZ, BOX3, 3.48);
      // chaque phrase sort avant la suivante et avant la couture (opacité 1 → 0, flou 0 → 6 px, 0,14 s)
      ft(s1, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.10);
      ft(s2, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.90);
      ft(s3, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 4.42);

      // durée exacte de la séquence
      tl.set({}, {}, DUR);

      // première image = handoff_in, avant tout seek
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
