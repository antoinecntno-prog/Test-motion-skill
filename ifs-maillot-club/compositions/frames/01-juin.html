      tw(Q, { o: 0 }, { o: 1 }, 0.10, "none", 2.30);
      tw(Q, { k: 1.15, b: 8, r: -7 }, { k: 1, b: 0, r: CAL_R }, 0.14, "expo.out", 2.50);
      // 2.62 « Septembre » : SEPTEMBRE 2026 s'imprime, lettres à 0,02 s
      Array.prototype.forEach.call(calI.querySelectorAll(".p01-ctitle .p01-tl"), function (el, i) {
        ft(el, { opacity: 0, y: -16, scale: 1.18, filter: "blur(4px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "power3.out" }, 2.62 + i * 0.02);
      });
      // 2.90 la grille des jours s'allume ligne par ligne (0,03 s)
      [".p01-hd", ".p01-r0", ".p01-r1", ".p01-r2", ".p01-r3", ".p01-r4"].forEach(function (sel, g) {
        ft(calI.querySelectorAll(sel), { opacity: 0.14 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, 2.90 + g * 0.03);
      });
      // la page du fond continue de s'envoler, puis part par le haut avant le whip
      tw(B, { y: 0, r: 22 }, { y: -24, r: 25 }, 1.20, "none", 2.75);
      tw(B, { x: 0, y: -24, r: 25 }, { x: 300, y: -620, r: 39 }, 0.40, "power2.in", 3.95);
      // 3.30 le fil remonte jusqu'au samedi 5
      tw(T, { p: P_SEND }, { p: P_FIVE }, 0.22, "power2.out", 3.30);
      // 3.52 « premier » : le feutre rouge entoure le 5
      ft(ring5, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 3.52);
      tw(D, { rg: 0 }, { rg: 1 }, 0.30, "power2.out", 3.52);
      // 3.90 « match » : « 1er match » s'écrit au-dessus
      ft($("match"), { opacity: 0, scale: 1.2, rotation: -5, filter: "blur(4px)" }, { opacity: 1, scale: 1, rotation: -5, filter: "blur(0px)", duration: 0.12, ease: "power3.out" }, 3.90);
      // 3.64 le fil se noue en boucle sous le 5 (image clé A1 à 3.95 : « le fil noué dessus »)
      tw(T, { p: P_FIVE }, { p: P_KNOT }, 0.24, "power2.inOut", 3.64);
      // 4.10 le fil repart du nœud vers la droite et descend ; pendant le whip sa tête file jusqu'à (4500, 660)
      tw(T, { p: P_KNOT }, { p: P_DOWN }, 0.30, "power2.in", 4.10);
      tw(T, { p: P_DOWN }, { p: P_SEAM }, 0.16, "none", 4.40);

      /* ---- la phrase de la voix : mot par mot, gris puis encre ; une boîte, un trait ---- */
      function sayWords(spans, list) {
        spans.forEach(function (w, i) {
          var st = Math.max(0, list[i][1] - 1 / 30), kw = list[i][2] === "box";
          ft(w, { y: 8, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, st);
          if (kw) ft(w, { opacity: 0 }, { opacity: 1, duration: 0.10, ease: "power2.out" }, st);
          else {
            ft(w, { opacity: 0 }, { opacity: 0.35, duration: 0.08, ease: "power2.out" }, st);
            ft(w, { opacity: 0.35 }, { opacity: 1, duration: 0.20, ease: "power1.out" }, st + 0.10);
          }
        });
      }
      sayWords(sp1, W1S);
      sayWords(sp2, W2S);
      var BOXZ = { scaleX: 0, scaleY: 1, rotation: 0, skewX: 0, skewY: 0 };
      ft(sp1[0].querySelector(".fx-box"), BOXZ, { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0, skewY: 0, duration: 0.16, ease: "power3.out" }, 0);
      ft(sp2[0].querySelector(".fx-box"), BOXZ, { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0, skewY: 0, duration: 0.16, ease: "power3.out" }, 2.58);
      var stroke = $("stroke");
      gsap.set(stroke, { scaleX: 0, scaleY: 1, rotation: -1.2, skewX: 0, skewY: 0 });
      ft(stroke, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 3.52);
      ft(stroke, { scaleX: 0, scaleY: 1, rotation: -1.2, skewX: 0, skewY: 0 }, { scaleX: 1, scaleY: 1, rotation: -1.2, skewX: 0, skewY: 0, duration: 0.40, ease: "power2.out" }, 3.52);
      // avant chaque couture la phrase sort (opacité 1 → 0, flou 0 → 6 px, 0,14 s)
      ft(s1, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.16);
      ft(s2, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 4.36);

      // durée exacte de la séquence
      tl.set({}, {}, DUR);

      // première image = handoff_in, avant tout seek
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
