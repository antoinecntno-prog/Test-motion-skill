      tw(R, { k: 1.1, tb: 8 }, { k: 1, tb: 0 }, 0.12, "expo.out", 0.14);
      // l'épaule d'avant-plan arrive avec la caméra (plus vite que le monde), puis dérive
      tw(F, { o: 0 }, { o: 1 }, 0.16, "power2.out", 0.14);
      tw(F, { x: 300 }, { x: 0 }, 0.26, "expo.out", 0.14);
      tw(F, { x: 0 }, { x: -62 }, 1.44, "none", 0.40);
      // 0.30 le premier joueur saute sur place (y -30 → 0, 0,2 s)
      tw(J1, { dy: 0 }, { dy: -30 }, 0.08, "power2.out", 0.30);
      tw(J1, { dy: -30 }, { dy: 0 }, 0.12, "power2.in", 0.38);
      // 0.50 le deuxième fait un moulinet de bras
      tw(J2, { a: 0 }, { a: -360 }, 0.50, "power2.inOut", 0.50);
      // 0.57 « toujours » : l'entraîneur entre par la gauche, trop grand et flou (×1,15 flou 6 → net, 0,14 s expo.out)
      tw(CO, { o: 0 }, { o: 1 }, 0.05, "power2.out", 0.55);
      tw(CO, { x: -180, k: 1.15, b: 6 }, { x: 0, k: 1, b: 0 }, 0.14, "expo.out", 0.55);
      // 0.98 le téléphone passe de l'oreille à devant lui
      tw(CO, { ph: 0 }, { ph: 1 }, 0.24, "power2.inOut", 0.98);
      // 1.02 « pas » : les quatre chasubles grises s'éclairent une à une (+15 %, 0,04 s d'écart)
      ["a", "b", "c", "d"].forEach(function (k, i) { var f = {}, t2 = {}; f[k] = 1; t2[k] = 1.15; tw(BL, f, t2, 0.12, "power2.out", 1.01 + i * 0.04); });
      // 1.38 « maillots » : le fil traverse le parquet devant eux, seul objet rouge du plan
      tw(T, { p: P_IN }, { p: P_CROSS }, 0.45, "power3.out", 1.36);

      /* ---- scène 2 : le gag muet ---- */
      // 1.84 la poussée : l'épaule d'avant-plan sort à gauche, les joueurs passent au flou (4 px)
      tw(F, { x: -62, k: 1 }, { x: -760, k: 1.25 }, 0.46, "expo.out", 1.84);
      tw(D, { b: 0, o: 1 }, { b: 4, o: 0.8 }, 0.46, "power2.inOut", 1.84);
      // 2.10 la carte de suivi sort du téléphone et grandit à côté de lui (×0,2 → 1, 0,18 s expo.out)
      tw(CD, { o: 0 }, { o: 1 }, 0.05, "power2.out", 2.08);
      tw(CD, { k: 0.2 }, { k: 1 }, 0.18, "expo.out", 2.08);
      tw(CO, { lean: 0 }, { lean: -3 }, 0.30, "power2.out", 2.10);
      // 2.60 et 3.10 il rafraîchit : le pouce tape (×0,9, 0,06 s), la carte tremble (x ±6 px, 0,12 s), le contenu recharge,
      [2.60, 3.10].forEach(function (t0, i) {
        tw(CO, { tap: 1 }, { tap: 0.9 }, 0.06, "power2.out", t0);
        tw(CO, { tap: 0.9 }, { tap: 1 }, 0.08, "power2.out", t0 + 0.06);
        tw(CD, { sh: 0 }, { sh: 1 }, 0.12, "none", t0);
        tw(CD, { rf: i }, { rf: i + 1 }, 0.40, "power2.out", t0);
        tw(CD, { c: 1 }, { c: 0.35 }, 0.06, "power2.out", t0 + 0.02);
        // et revient pareil : 2 étapes sur 4 (2.80 et 3.30)
        tw(CD, { c: 0.35 }, { c: 1 }, 0.12, "power2.out", t0 + 0.20);
        tw(CD, { pr: 0 }, { pr: 1 }, 0.36, "power2.out", t0 + 0.20);
      });
      // 3.40 un joueur du fond s'arrête, mains sur les hanches
      tw(J3, { h: 0 }, { h: 1 }, 0.24, "power2.out", 3.40);
      // 3.60 le fil fait une boucle au pied de l'entraîneur
      tw(K, { on: 0 }, { on: 1 }, 0.01, "none", 3.60);
      tw(K, { L: 0 }, { L: 1 }, 0.28, "power3.out", 3.60);
      // 3.84 erreur : la carte flashe d'un liseré gris (0,1 s)
      tw(CD, { fl: 0 }, { fl: 1 }, 0.03, "power2.out", 3.84);
      tw(CD, { fl: 1 }, { fl: 0 }, 0.07, "power2.in", 3.87);
      // 3.90 à 4.30 le fil se noue (fxKnotD, tension 0 → 1, power2.in)
      tw(K, { t: 0 }, { t: 1 }, 0.40, "power2.in", 3.90);
      // 4.34 pendant le whip, la tête du fil file jusqu'à (7000, 620)
      tw(T, { p: P_CROSS }, { p: P_OUT }, 0.15, "none", 4.34);

      /* ---- la phrase de la voix : mot par mot, gris puis encre ---- */
      sp.forEach(function (w, i) {
        var st = Math.max(0, WS[i][1] - 1 / 30);
        ft(w, { y: 8, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, st);
        ft(w, { opacity: 0 }, { opacity: 0.35, duration: 0.08, ease: "power2.out" }, st);
        ft(w, { opacity: 0.35 }, { opacity: 1, duration: 0.20, ease: "power1.out" }, st + 0.10);
      });
      // 1.70 à 1.84 la phrase sort (opacité 1 → 0, flou 0 → 6 px)
      ft(s1, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.70);

      // durée exacte de la séquence
      tl.set({}, {}, DUR);

      // première image = handoff_in, avant tout seek
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
