        port.style.filter = PH.b > 0.05 ? "blur(" + PH.b.toFixed(2) + "px)" : "none";
        var rho = BETA + R.land + R.base + R.acc;
        jrot.style.transform = "rotate(" + rho.toFixed(3) + "deg)";
        jrot.style.filter = R.blur > 0.05 ? "blur(" + R.blur.toFixed(2) + "px)" : "none";
        // le rabat du 1 : il pivote autour de B (tiré par le fil) et se soulève autour de la charnière B C
        flapw.style.transform = "perspective(" + PERSP + "px) rotate(" + F.phi.toFixed(3) + "deg) rotate3d(" + hx.toFixed(5) + "," + hy.toFixed(5) + ",0," + F.psi.toFixed(3) + "deg)";
        flapw.style.filter = F.sh > 0.01 ? "drop-shadow(" + (7 * F.sh).toFixed(2) + "px " + (10 * F.sh).toFixed(2) + "px " + (5 * F.sh).toFixed(2) + "px rgba(8,4,10," + (0.6 * F.sh).toFixed(3) + "))" : "none";
        flapedge.setAttribute("stroke", "rgba(255,248,240," + (0.75 * F.sh).toFixed(3) + ")");
        // les fissures
        [KR.c0, KR.c1, KR.c2].forEach(function (p, i) {
          crk[i].style.opacity = p > 0.002 ? 0.95 : 0; crs[i].style.opacity = p > 0.002 ? 0.55 : 0;
          fxDrawThread(crk[i], p); fxDrawThread(crs[i], p);
        });
        // le bout du fil : du joint (sous l'anneau) jusqu'au coin du 1, puis il se libère et file au centre du cadre
        var hk = hookPoint(rho);
        var H = { x: hk.x + (CSTAR.x - hk.x) * L.rel, y: hk.y + (CSTAR.y - hk.y) * L.rel };
        var dx = H.x - EL.x, dy = H.y - EL.y, dl = Math.hypot(dx, dy) || 1, nx = -dy / dl, ny = dx / dl;
        if (ny < 0) { nx = -nx; ny = -ny; }
        var sag = 26 * L.sag, mx = (EL.x + H.x) / 2 + nx * sag, my = (EL.y + H.y) / 2 + ny * sag;
        var ld = "M" + EL.x.toFixed(2) + " " + EL.y.toFixed(2) + " Q" + mx.toFixed(2) + " " + my.toFixed(2) + " " + H.x.toFixed(2) + " " + H.y.toFixed(2);
        leadPath.setAttribute("d", ld); leadHl.setAttribute("d", ld);
        lead.style.opacity = L.d > 0.002 ? 1 : 0;
        fxDrawThread(leadPath, L.d, FX.FADED);
        leadHl.setAttribute("opacity", L.hl.toFixed(3));
        // gouttes et mousse
        [DR.d0, DR.d1, DR.d2].forEach(function (k, i) {
          drops[i].style.opacity = k > 0.01 ? 1 : 0;
          drops[i].setAttribute("transform", "translate(" + DROPS[i][0] + " " + DROPS[i][1] + ") scale(" + Math.max(0.001, k).toFixed(4) + ")");
        });
        foam.style.opacity = FM.o;
        foam.style.transform = "translateY(" + FM.y.toFixed(2) + "px)";

        // avant-plan S4 : un rabat de carton flou, coupé par le bord gauche (parallaxe 1,6 autour du cadrage S4)
        var ax = (7800 - C.x) * C.s * 1.6, ay = (480 - C.y) * C.s * 1.6, ak = Math.pow(C.s / 1.1, 1.3);
        fflap.style.opacity = FG.a;
        fflap.style.transform = "translate(" + ax.toFixed(2) + "px," + ay.toFixed(2) + "px) rotate(-14deg) scale(" + ak.toFixed(4) + ")";
        fflap.style.filter = "blur(" + (14 + C.b * 0.9).toFixed(2) + "px)";
        // avant-plan S5 : un anneau chromé flou en haut à gauche (parallaxe 1,5 autour du cadrage S5)
        var rx = (10000 - C.x) * C.s * 1.5, ry = (470 - C.y) * C.s * 1.5, rk = Math.pow(C.s / 1.25, 1.5);
        fring.style.opacity = FG.r;
        fring.style.transform = "translate(" + rx.toFixed(2) + "px," + ry.toFixed(2) + "px) scale(" + rk.toFixed(4) + ")";
        fring.style.filter = "blur(" + (16 + C.b * 0.9).toFixed(2) + "px)";
      }
      // les avant-plans grandissent depuis le centre du cadre (pousser = ils s'écartent vers les bords)
      fflap.style.transformOrigin = (960 + 330) + "px " + (540 - 560) + "px";
      fring.style.transformOrigin = (960 + 440) + "px " + (540 + 470) + "px";

      /* ===================== la timeline unique, en pause ===================== */
      var tl = gsap.timeline({ paused: true, onUpdate: render });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }
      function tw(target, from, to, dur, ease, pos) { var o = {}, k; for (k in to) o[k] = to[k]; o.duration = dur; o.ease = ease; ft(target, from, o, pos); }

      /* ---- piste caméra ---- */
      // 0.00 à 0.30 fin du whip : la vitesse d'entrée (+6000 u/s) se raccorde, puis se pose sur cam(7800, 480, 1.1)
      var kin = 6000 * 0.30 / (FX.FRAMING.S4[0] - 7000), qa = kin - 2, qb = 3 - 2 * kin;
      var WHIP_IN = function (p) { return qa * p * p * p + qb * p * p + kin * p; };
      tw(C, { x: 7000 }, { x: FX.FRAMING.S4[0] }, 0.30, WHIP_IN, 0);
      tw(C, { y: 560, s: 1.0 }, { y: FX.FRAMING.S4[1], s: FX.FRAMING.S4[2] }, 0.30, "expo.out", 0);
      tw(C, { b: 12 }, { b: 0 }, 0.30, "expo.out", 0);
      // dérive x +15 u/s
      var X22 = FX.FRAMING.S4[0] + 15 * 1.90;
      tw(C, { x: FX.FRAMING.S4[0] }, { x: X22 }, 1.90, "none", 0.30);
      // 2.20 à 2.60 la caméra pousse entre les deux rouges : cam(7860, 470, 1.3)
      tw(C, { x: X22, y: 480, s: 1.1 }, { x: 7860, y: 470, s: 1.3 }, 0.40, "expo.out", 2.20);
      // puis la dérive reprend (+15 u/s, +1 %/s)
      var S4E = { x: 7860 + 15 * 0.56, y: 470, s: 1.3 * (1 + 0.01 * 0.56) };
      tw(C, { x: 7860, s: 1.3 }, { x: S4E.x, s: S4E.s }, 0.56, "none", 2.60);
      // 3.16 whip vers S5 : power2.in jusqu'au sommet (3.30, 61,8 % du trajet, vitesses égales), puis expo.out jusqu'à 3.60
      var WB = { x: FX.FRAMING.S5[0], y: FX.FRAMING.S5[1], s: FX.FRAMING.S5[2] }, WF = 0.618, WM = {};
      for (var key in S4E) WM[key] = S4E[key] + (WB[key] - S4E[key]) * WF;
      tw(C, S4E, WM, 0.14, "power2.in", 3.16);
      tw(C, WM, WB, 0.30, "expo.out", 3.30);
      tw(C, { b: 0 }, { b: 12 }, 0.14, "power2.in", 3.16);
      tw(C, { b: 12 }, { b: 0 }, 0.30, "expo.out", 3.30);
      // 3.60 à 6.15 poussée linéaire dans le hublot x1,25 → x1,45
      tw(C, { s: 1.25 }, { s: 1.45 }, 2.55, "none", 3.60);
      // 5.27 secousse de 4 px (0,1 s)
      tw(SH, { k: 0 }, { k: 1 }, 0.10, "none", 5.27);

      /* ---- scène 1 : le carton, le rouge a viré ---- */
      // le fil file derrière le carton et le nuancier vers la droite
      tw(T, { p: P_IN }, { p: P_OUT4 }, 1.20, "power2.inOut", 0.10);
      // 0.14 le carton tombe du haut du cadre (y -600 → 0, 0,26 s power2.in) ; 0.40 contact, tassement 0,97 → 1
      tw(BX, { o: 0 }, { o: 1 }, 0.02, "none", 0.14);
      tw(BX, { y: -600, k: 1.12, sh: 0 }, { y: 0, k: 0.97, sh: 1 }, 0.26, "power2.in", 0.14);
      tw(BX, { k: 0.97 }, { k: 1 }, 0.08, "power2.out", 0.40);
      // 0.67 les rabats s'ouvrent l'un après l'autre (0 → 110°, 0,16 s, 0,05 s d'écart)
      ["t", "b", "l", "r"].forEach(function (k, i) { var a = {}, b = {}; a[k] = 0; b[k] = 110; tw(FL, a, b, 0.16, "power2.out", 0.67 + i * 0.05); });
      // 0.91 « arrivent » : le maillot plié sort du carton (y +80 → 0, x1,1 flou 6 → net, 0,14 s), déjà un peu terne
      tw(JY, { o: 0 }, { o: 1 }, 0.06, "none", 0.91);
      tw(JY, { y: 80, k: 1.1, b: 6 }, { y: 0, k: 1, b: 0 }, 0.14, "power3.out", 0.91);
      tw(JY, { f: 0 }, { f: 0.22 }, 0.30, "power1.out", 0.91);
      // 1.51 le nuancier « Rouge club » arrive depuis la caméra (x4 flou 12 → net, 0,22 s expo.out)
      tw(SW, { o: 0 }, { o: 1 }, 0.05, "none", 1.51);
      tw(SW, { k: 4, b: 12 }, { k: 1, b: 0 }, 0.22, "expo.out", 1.51);
      // 1.85 « rouge » : la pastille s'allume (+20 %, 0,1 s)
      tw(SW, { lum: 1 }, { lum: 1.2 }, 0.10, "power2.out", 1.85);
      // 2.47 « viré » : le fil et le maillot virent à l'orange (0,4 s), le nuancier reste rouge
      tw(T, { fade: 0 }, { fade: 1 }, 0.40, "power1.inOut", 2.47);
      tw(JY, { f: 0.22 }, { f: 1 }, 0.42, "power1.inOut", 2.47);
      // 2.89 « l'orange » : un liseré orange se trace autour du maillot (0,2 s)
      tw(OL, { p: 0 }, { p: 1 }, 0.20, "power2.out", 2.89);
      // avant-plan : le rabat flou entre avec la fin du whip
      tw(FG, { a: 0 }, { a: 1 }, 0.25, "power1.out", 0.08);

      /* ---- scène 2 : le hublot, le numéro se décolle ---- */
      // pendant le whip : la tête du fil attend hors champ ; le hublot et l'anneau d'avant-plan entrent flous par la droite
      tw(T, { p: P_OUT4 }, { p: P_9000 }, 0.24, "power2.in", 3.16);
      tw(PH, { o: 0 }, { o: 1 }, 0.04, "none", 3.20);
      tw(FG, { r: 0 }, { r: 1 }, 0.06, "none", 3.22);
      // 3.45 le hublot se pose (x1,1 flou 8 → net, 0,14 s)
      tw(PH, { k: 1.1, b: 8 }, { k: 1, b: 0 }, 0.14, "expo.out", 3.45);
      // le dos du maillot tourne avec le tambour : +14° à l'arrivée, puis +3°/s
      tw(R, { land: -14 }, { land: 0 }, 0.30, "expo.out", 3.30);
      tw(R, { base: 0 }, { base: 3 * 2.55 }, 2.55, "none", 3.60);
      // 3.80 des gouttes perlent sur la vitre (0,05 s d'écart)
      ["d0", "d1", "d2"].forEach(function (k, i) { var a = {}, b = {}; a[k] = 0; b[k] = 1; tw(DR, a, b, 0.14, "power3.out", 3.80 + i * 0.05); });
      // 4.05 « numéro » : la mousse monte en bas de la vitre (y +60 → 0, 0,3 s)
      tw(FM, { o: 0 }, { o: 1 }, 0.10, "none", 4.05);
      tw(FM, { y: 60 }, { y: 0 }, 0.30, "power3.out", 4.05);
      // 4.30 le fil pâle entre dans le cadre (4.33), passe sous l'anneau et s'accroche au coin du 1 (4.58)
      tw(T, { p: P_9000 }, { p: P_E }, 0.12, "none", 4.30);
      tw(L, { d: 0 }, { d: 1 }, 0.16, "power2.out", 4.42);
      tw(L, { hl: 0 }, { hl: 0.35 }, 0.12, "none", 4.58);
      // 4.69 « décolle » : le fil tire, le coin du 1 se soulève en rabat avec son ombre (-24°, 0,18 s power2.out)
      tw(L, { sag: 1 }, { sag: 0 }, 0.12, "power2.out", 4.69);
      tw(F, { phi: 0, psi: 0, sh: 0 }, { phi: -24, psi: 44, sh: 1 }, 0.18, "power2.out", 4.69);
      // 4.99 trois fissures se tracent dans le 5 (0,05 s d'écart)
      ["c0", "c1", "c2"].forEach(function (k, i) { var a = {}, b = {}; a[k] = 0; b[k] = 1; tw(KR, a, b, 0.18, "power2.out", 4.99 + i * 0.05); });
      // 5.27 le rabat claque (secousse de 4 px)
      tw(F, { phi: -24, psi: 44 }, { phi: -31, psi: 54 }, 0.06, "power2.out", 5.27);
      tw(F, { phi: -31, psi: 54 }, { phi: -28, psi: 48 }, 0.18, "power2.out", 5.33);
      // 5.55 « lavage » : le tambour accélère (+40°/s), flou de rotation 2 px
      tw(R, { acc: 0 }, { acc: 12 }, 0.60, "power2.in", 5.55);
      tw(R, { blur: 0 }, { blur: 2 }, 0.30, "power1.in", 5.55);
      // 5.80 le fil se tend vers la droite et se libère : sa tête file au centre du cadre (960, 540)
      tw(L, { rel: 0 }, { rel: 1 }, 0.22, "expo.out", 5.80);
      tw(F, { phi: -28, psi: 48 }, { phi: -26, psi: 40 }, 0.30, "power2.out", 5.80);

      /* ---- la phrase de la voix : mot par mot, gris puis encre ; une boîte par phrase ---- */
      function sayWords(spans, list) {
        spans.forEach(function (w, i) {
          var st = Math.max(0, list[i][1] - 1 / 30), kw = list[i][2] === "box";
          ft(w, { y: 8, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, st);
          if (kw) ft(w, { opacity: 0 }, { opacity: 1, duration: 0.10, ease: "power2.out" }, st);
          else {
            ft(w, { opacity: 0 }, { opacity: 0.35, duration: 0.08, ease: "power2.out" }, st);
            ft(w, { opacity: 0.35 }, { opacity: 1, duration: 0.20, ease: "power1.out" }, st + 0.10);
          }
        });
      }
      sayWords(spA, WA);
      sayWords(spB, WB);
      sayWords(sp2, W2);
      var BOXZ = { scaleX: 0, scaleY: 1, rotation: 0, skewX: 0, skewY: 0 };
      ft(spB[5].querySelector(".fx-box"), BOXZ, { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0, skewY: 0, duration: 0.16, ease: "power3.out" }, 2.85);
      ft(sp2[4].querySelector(".fx-box"), BOXZ, { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0, skewY: 0, duration: 0.16, ease: "power3.out" }, 4.65);
      // les morceaux se remplacent : chaque phrase sort (opacité 1 → 0, flou 0 → 6 px, 0,14 s)
      ft(s1a, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.30);
      ft(s1b, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 3.16);
      ft(s2, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 5.92);

      // durée exacte de la séquence
      tl.set({}, {}, DUR);

      // première image = handoff_in, avant tout seek
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
