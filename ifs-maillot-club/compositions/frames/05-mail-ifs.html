      tw(C, { x: WB.x, y: WB.y - 6, s: WB.s * 1.009 }, PU, 0.90, "power3.out", 3.70);

      var PD = { x: PU.x + 6, y: PU.y, s: PU.s * 1.0056 };
      tw(C, PU, PD, 0.56, "none", 4.60);

      var SEAM = { x: 4300, y: 480, s: 1.0 }, kq = 6000 * 0.14 / (SEAM.x - PD.x), qa = kq - 2, qb = 3 - kq;
      var WHIP_OUT = function (p) { return qa * p * p * p + qb * p * p; };
      tw(C, PD, SEAM, 0.14, WHIP_OUT, 5.16);
      tw(C, { b: 0 }, { b: 12 }, 0.14, "power2.in", 5.16);

      /* ---- scène 1 : le fil trace l'enveloppe, le mail part vers IFS ---- */
      // 0.20 le fil part du bord gauche jusqu'au coin de l'enveloppe
      tw(T, { p: 0 }, { p: P_ENV }, 0.12, "power2.out", 0.20);

      tw(EN, { r: 0 }, { r: 1 }, 0.52, "expo.out", 0.30);
      tw(EN, { f: 0 }, { f: 1 }, 0.30, "power2.out", 0.70);
      tw(E, { fill: 0 }, { fill: 1 }, 0.24, "power1.out", 0.76);
      // la boucle d'avant-plan entre, floue
      ft(loop, { opacity: 0 }, { opacity: 0.9, duration: 0.30, ease: "power1.out" }, 0.30);
      // 1.00 le rabat s'ouvre ; la fenêtre sort de l'enveloppe (×0,6 → 1, flou 6 → net, 0,16 s)
      tw(E, { flip: 1 }, { flip: -1 }, 0.16, "power2.inOut", 1.00);
      tw(W, { o: 0 }, { o: 1 }, 0.06, "none", 1.00);
      tw(W, { y: 150, k: 0.6, b: 6 }, { y: 0, k: 1, b: 0 }, 0.16, "expo.out", 1.00);
      // 1.41 « tout » : le curseur arrive en une courbe sur Envoyer ; 2.10 il clique (onde bleue)
      ft(cursor, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 1.41);

      ft($("send"), { scale: 0.96 }, { scale: 1, duration: 0.10, ease: "power2.out" }, 2.16);

      ft(cursor, { opacity: 1 }, { opacity: 0, duration: 0.10, ease: "power2.in" }, 2.18);
      // 2.16 « mail » : la fenêtre se replie dans l'enveloppe, le rabat se ferme (0,12 s)
      tw(W, { y: 0, k: 1 }, { y: 250, k: 0.34 }, 0.12, "power2.in", 2.16);
      tw(W, { o: 1 }, { o: 0 }, 0.05, "none", 2.23);
      tw(E, { flip: -1 }, { flip: 1 }, 0.12, "power2.in", 2.24);
      // l'enveloppe file vers la droite sur le fil, le fil la devance ; elle se pose à 2.76 dans « Déposez votre logo ici »
      tw(T, { p: P_ENV }, { p: P_S7 }, 0.64, "power2.inOut", 2.16);
      tw(E, { dx: 0 }, { dx: 120 }, 0.12, "power2.in", 2.24);
      tw(E, { dx: 120, dy: 0, k: 1 }, { dx: 2738 - 960, dy: 383 - 470, k: 0.3 }, 0.40, "expo.out", 2.36);
      tw(E, { o: 1 }, { o: 0 }, 0.10, "power1.in", 2.76);
      ft($("file"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.16, ease: "power3.out" }, 2.76);
      ft(loop, { opacity: 0.9 }, { opacity: 0, duration: 0.06, ease: "none" }, 2.50);

      /* ---- scène 2 : le studio IFS, le design et le logo ---- */
      // le studio entre par la droite pendant le whip (hors cadre), puis se pose à 2.65 (×1,1 flou 8 → net, 0,14 s)
      ft(studio, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 2.36);

      // 3.04 « envoyez » : le maillot se construit (fond rouge, empiècement noir, motif)
      ["j1", "j2", "j3"].forEach(function (id, n) {
        ft($(id), { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power3.out" }, 3.04 + n * 0.12);

      // 3.66 « design » : le fil contourne le maillot (0,5 s expo.out)
      tw(J, { p: 0 }, { p: P_HEM }, 0.50, "expo.out", 3.66);

      ft($("tabline"), { scaleX: 0 }, { scaleX: 1, duration: 0.10, ease: "power2.out" }, 4.14);
      ft($("tabon"), { opacity: 0 }, { opacity: 1, duration: 0.10, ease: "none" }, 4.14);
      // 4.40 l'écusson arrive depuis la caméra (×4 flou 12 → net), 4.70 « logo » : il se pose, tassement 0,96 → 1, cadre pointillé
      ft(crest, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 4.40);

      // 4.78 un second écusson, flou, monte dans l'avant-plan, coupé par le bord bas gauche
      ft(fcrest, { opacity: 0 }, { opacity: 0.85, duration: 0.20, ease: "power1.out" }, 4.78);

      // 5.10 le fil quitte le contour et file vers le BAT ; 5.16 le whip, la tête atteint (4600, 640)
      tw(J, { p: P_HEM }, { p: 1 }, 0.10, "power2.in", 5.10);
      tw(T, { p: P_S7 }, { p: P_SEAM }, 0.14, "power2.in", 5.16);

      /* ---- la phrase de la voix : mot par mot, gris (opacité 0,35) puis encre ; une boîte par phrase ---- */
      function sayWords(spans, list) {
        spans.forEach(function (w, i) {
          var st = Math.max(0, list[i][1] - 1 / 30), kw = list[i][2] === "box";
          ft(w, { y: 8, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, st);
          if (kw) ft(w, { opacity: 0 }, { opacity: 1, duration: 0.10, ease: "power2.out" }, st);
          else {
            ft(w, { opacity: 0 }, { opacity: 0.35, duration: 0.08, ease: "power2.out" }, st);
            ft(w, { opacity: 0.35 }, { opacity: 1, duration: 0.20, ease: "power1.out" }, st + 0.10);
          }
        });
      }
      sayWords(sp1, W1S);
      sayWords(sp2, W2S);
      var BOXZ = { scaleX: 0, scaleY: 1, rotation: 0, skewX: 0, skewY: 0 };
      ft(sp1[5].querySelector(".fx-box"), BOXZ, { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0, skewY: 0, duration: 0.16, ease: "power3.out" }, BOX1);
      ft(sp2[3].querySelector(".fx-box"), BOXZ, { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0, skewY: 0, duration: 0.16, ease: "power3.out" }, BOX2);
      // chaque phrase sort (opacité 1 → 0, flou 0 → 6 px, 0,14 s)
      ft(s1, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.36);
      ft(s2, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 5.02);

      tl.set({}, {}, DUR);
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
