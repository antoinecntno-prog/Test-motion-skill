      glue(sp1[3]); sp1[3].classList.add("p06-kw", "p06-kb");
      glue(sp3[3]); sp3[3].classList.add("p06-kw", "p06-kb");
      glue(sp2[3]); glue(sp4[4]);
      var box2 = boxPair(s2, sp2, 2), box4 = boxPair(s4, sp4, 3);

      /* ===================== état : proxies lus par UN seul onUpdate ===================== */
      var C = { x: 4300, y: 480, s: 1.0, b: 12 };                    // handoff_in : cam(4300, 480, 1.0) flou 12
      var SK = { v: 0 };                                              // secousse caméra (px)
      var T = { p: P_SEAM };                                          // le fil du monde : fixe à (4600, 640)
      var D = { lead: 0, run: 0, lift: 0, pat: [0, 0, 0, 0, 0, 0] };   // tracés

      var SF = { o: 0, k: 2.2 };                                      // son ombre en vol (avant-plan)

      var F = { k: 1.1, b: 8 };                                       // le tissu
      var CD = { k: 3, b: 10, x: 360 };                               // la carte GRILLE IFS
      var CU = { a: 0, u: 0, ex: 0, k: 1, tr: 0 };                    // le cutter
      var PATS = D.pat.map(function (v, i) { return { p: 0 }; });

      var sheet = $("sheet"), stamp = $("stamp"), sshad = $("sshad"), cursor = $("cursor"), fab = $("fab"), card = $("card");
      var cutter = $("cutter"), blade = $("blade"), ruler = $("ruler");

      function render() {
        fxCam(world, cam, C.x + SK.v / C.s, C.y, C.s, C.b);
        fxDrawThread(thread, T.p, FX.THREAD);

        // la feuille BAT

        // l'attache et la coche, puis la course du fil (elles suivent la feuille)

        run.setAttribute("d", runD()); fxDrawThread(run, D.run); run.style.opacity = D.run > 0.0005 ? 1 : 0;

        // le tampon, au coin bas droit de la feuille

        stamp.style.filter = (ST.b > 0.05 ? "blur(" + ST.b.toFixed(2) + "px) " : "") + "drop-shadow(0px " + (3 + (ST.k - 1) * 20).toFixed(1) + "px " + (4 + (ST.k - 1) * 16).toFixed(1) + "px rgba(26,19,32,.22))";

        sshad.style.filter = "blur(" + (10 + 10 * SF.k).toFixed(2) + "px)";
        sshad.style.opacity = SF.o;

        // le curseur : une seule courbe, un clic, puis il sort par le bas
        var t = K.cu, it = 1 - t;

        cx += (CUREX[0] - CUR1[0]) * K.ex; cy += (CUREX[1] - CUR1[1]) * K.ex;

        // le tissu se pose

        card.style.filter = CD.b > 0.05 ? "blur(" + CD.b.toFixed(2) + "px)" : "none";

        // les patrons gradés se tracent ; la pièce M se soulève
        PATS.forEach(function (q, i) { fxDrawThread(MASKP[i], q.p); });

        else { var ta = CU.a, ia = 1 - ta; px = ia * ia * CT0[0] + 2 * ia * ta * CTC[0] + ta * ta * HL[0]; py = ia * ia * CT0[1] + 2 * ia * ta * CTC[1] + ta * ta * HL[1]; }
        px += (CTX[0] - HR[0]) * CU.ex; py += (CTX[1] - HR[1]) * CU.ex;
        cutter.style.transform = "translate(" + (px - 90).toFixed(2) + "px," + (py - 270).toFixed(2) + "px) scale(" + CU.k.toFixed(4) + ")";
        blade.setAttribute("transform", "rotate(" + (CU.u * 1.04).toFixed(2) + " 90 270)");
        // la traînée magenta floue derrière la lame
        var a0 = Math.max(0, CU.u - 160);

        var rx = (7600 - C.x) * C.s * 1.45, ry = (470 - C.y) * C.s * 1.45;

      }

      /* ===================== la timeline unique, en pause ===================== */
      var tl = gsap.timeline({ paused: true, onUpdate: render });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }
      function tw(target, from, to, dur, ease, pos) { var o = {}, k; for (k in to) o[k] = to[k]; o.duration = dur; o.ease = ease; ft(target, from, o, pos); }

      /* ---- piste caméra ---- */
      // 0.00 à 0.30 fin du whip : départ à +6000 u/s (vitesse de la séquence 05), arrivée sur S8
      var k1 = 6000 * 0.30 / 1100, a1 = k1 - 2, b1 = 3 - 2 * k1;

      tw(C, { x: 4300, y: 480, s: 1.0 }, { x: 5400, y: 470, s: 1.05 }, 0.30, WHIP_IN, 0);
      tw(C, { b: 12 }, { b: 0 }, 0.26, "power2.out", 0);

      tw(C, { x: 5400 }, { x: S8D }, 2.26, "none", 0.30);

      tw(SK, { v: 0 }, { v: 4 }, 0.03, "power2.out", 0.98);
      tw(SK, { v: 4 }, { v: -3 }, 0.05, "sine.inOut", 1.01);
      tw(SK, { v: -3 }, { v: 0 }, 0.08, "power2.out", 1.06);
      // 2.56 whip vers S9 : power2.in jusqu'au sommet du flou (2.70), puis expo.out jusqu'à cam(7600, 470, 1.0) à 3.00
      var W0 = { x: S8D, y: 470, s: 1.05 }, WB = { x: 7600, y: 470, s: 1.0 }, WM = {}, key;
      for (key in W0) WM[key] = W0[key] + (WB[key] - W0[key]) * 0.634;

      tw(C, { b: 0 }, { b: 10 }, 0.25, "expo.in", 5.55);

      tw(SH, { o: 0 }, { o: 1 }, 0.07, "none", 0.07);
      tw(SH, { k: 1.1, b: 8 }, { k: 1, b: 0 }, 0.12, "power3.out", 0.14);

      tw(K, { cu: 0 }, { cu: 1 }, 0.40, "power3.out", 0.28);
      tw(K, { ck: 1 }, { ck: 0.85 }, 0.06, "power2.out", 0.68);
      tw(K, { ck: 0.85 }, { ck: 1 }, 0.10, "power2.out", 0.74);

      var BOXZ = { scaleX: 0, scaleY: 1, rotation: 0, skewX: 0, skewY: 0 }, BOX1 = { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0, skewY: 0, duration: 0.16, ease: "power3.out" };

      // durée exacte de la séquence
      tl.set({}, {}, DUR);

      // première image = handoff_in, avant tout seek
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
