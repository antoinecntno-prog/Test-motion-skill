          var m = "radial-gradient(circle " + r.toFixed(1) + "px at " + HCX.toFixed(1) + "px " + HCY.toFixed(1) + "px, #000 0, #000 " + (r * 0.58).toFixed(1) + "px, rgba(0,0,0,.55) " + (r * 0.8).toFixed(1) + "px, transparent " + r.toFixed(1) + "px)";
          ink.style.webkitMaskImage = m; ink.style.maskImage = m;

          plate.style.transform = "translateY(" + Pr.y.toFixed(2) + "px)";
          glow.style.transform = "translateY(" + (Pr.y + 150).toFixed(2) + "px)";
          glow.style.opacity = Pr.g;
        }

        /* ===================== la timeline unique, en pause ===================== */
        var tl = gsap.timeline({ paused: true, onUpdate: render });
        function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }
        function tw(target, from, to, dur, ease, pos) { var o = {}, q; for (q in to) o[q] = to[q]; o.duration = dur; o.ease = ease; ft(target, from, o, pos); }

        /* ---- piste caméra ---- */
        // 0.00 à 0.20 fin de la plongée : la maille se pose, cam(9800, 470, 1.4), flou 10 → 0
        tw(C, { x: 8400, y: 640, s: 3.2, b: 10 }, { x: 9800, y: 470, s: 1.4, b: 0 }, 0.20, "expo.out", 0);
        // 0.20 à 2.80 recul lent ×1,4 → ×1,3 : le motif se révèle
        tw(C, { s: 1.4 }, { s: 1.3 }, 2.60, "sine.inOut", 0.20);
        // 2.84 à 3.00 whip vers la couture : cam(10900, 520, 1.3), flou 0 → 12
        tw(C, { x: 9800, y: 470, b: 0 }, { x: 10900, y: 520, b: 12 }, 0.16, "power2.in", 2.84);

        // 0.00 à 0.15 le tapis s'efface, la maille se pose (points de 22 u)
        tw(M, { mat: 1, mesh: 0 }, { mat: 0, mesh: 1 }, 0.15, "power2.out", 0);
        tw(M, { ms: 1.04 }, { ms: 1 }, 0.30, "power3.out", 0);

        // 0.24 « La » : la presse descend du haut du cadre, floue ; lueur chaude sous elle
        ft(plate, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 0.23);
        tw(Pr, { y: -260 }, { y: -150 }, 0.20, "power2.in", 0.24);
        tw(Pr, { g: 0 }, { g: 1 }, 0.30, "power2.out", 0.34);
        // 0.44 contact : secousse 3 px
        tw(Dr, { y: 0 }, { y: 3 }, 0.04, "power2.out", 0.44);
        tw(Dr, { y: 3 }, { y: -1 }, 0.06, "power2.inOut", 0.48);
        tw(Dr, { y: -1 }, { y: 0 }, 0.08, "power2.out", 0.54);
        // 1.14 « fixe » : la presse se relève de 20 px
        tw(Pr, { y: -150 }, { y: -170 }, 0.30, "power3.out", 1.14);
        tw(Pr, { g: 1 }, { g: 0.7 }, 0.30, "power2.out", 1.14);
        // 2.50 la presse se relève hors champ avant le whip
        tw(Pr, { y: -170, g: 0.7 }, { y: -340, g: 0 }, 0.28, "power2.in", 2.50);

        // 0.52 « sublimation » : le fil arrive de la gauche et plonge dans la maille
        tw(T, { p: P_IN }, { p: P_DIVE }, 0.20, "power2.out", 0.50);
        ft(hin, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power3.out" }, 0.66);

        // 0.70 à 2.40 le motif réel du maillot apparaît dans la fibre en halo
        ft(ink, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 0.70);
        tw(H, { r: 0 }, { r: 300 }, 0.44, "power2.out", 0.70);
        // 1.14 « fixe » : le halo marque un temps (tassement)
        tw(H, { r: 300 }, { r: 318 }, 0.16, "power1.out", 1.14);
        // 1.82 « couleurs » : le halo atteint ESCHAU
        tw(H, { r: 318 }, { r: 520 }, 0.52, "power2.out", 1.30);
        tw(H, { r: 520 }, { r: 760 }, 0.58, "power2.out", 1.82);

        // 2.54 « fibre » : le fil ressort du tissu à droite et file vers la couture
        ft(hout, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power3.out" }, 2.50);
        ft(exitP, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 2.53);
        tw(X, { len: 0 }, { len: U_MID - U_OUT }, 0.30, "power3.out", 2.54);
        tw(X, { len: U_MID - U_OUT }, { len: U_END - U_OUT }, 0.16, "power2.in", 2.84);

        /* ---- la phrase de la voix : mot par mot, gris puis encre ; une boîte ---- */
        function sayWords(spans, list) {
          spans.forEach(function (w, i) {
            var st = Math.max(0, list[i][1] - 1 / 30), kw = list[i][2] === "box";
            ft(w, { y: 8, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, st);
            if (kw) ft(w, { opacity: 0 }, { opacity: 1, duration: 0.10, ease: "power2.out" }, st);
            else {
              ft(w, { opacity: 0 }, { opacity: 0.35, duration: 0.08, ease: "power2.out" }, st);
              ft(w, { opacity: 0.35 }, { opacity: 1, duration: 0.20, ease: "power1.out" }, st + 0.10);
            }
          });
        }
        sayWords(sp1, W1S);
        sayWords(sp2, W2S);
        ft(sp2[1].querySelector(".fx-box"), { scaleX: 0, scaleY: 1, rotation: 0, skewX: 0, skewY: 0 },
          { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0, skewY: 0, duration: 0.16, ease: "power3.out" }, 1.78);
        // chaque morceau sort : opacité 1 → 0, flou 0 → 6 px, 0,14 s
        ft(s1, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.40);
        ft(s2, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.84);

        // durée exacte de la séquence
        tl.set({}, {}, DUR);

        // première image = handoff_in, avant tout seek
        render();

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
</template>
