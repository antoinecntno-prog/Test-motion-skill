      // fraction où le fil passe à l'abscisse x (le fil W2 avance toujours vers la droite ici)
      function fracAtX(x) {
        var lo = fracAt(12000, 520), hi = 1, i, m;
        for (i = 0; i < 40; i++) { m = (lo + hi) / 2; if (thread.getPointAtLength(TL * m).x < x) lo = m; else hi = m; }
        return (lo + hi) / 2;
      }
      var P_IN = fracAt(10600, 600);     // handoff_in : fil tracé jusqu'à (10600, 600)
      var P_J = fracAt(12000, 520);      // sous le maillot (S11)
      var P_BOX = fracAtX(13700);        // il s'arrête au pied du carton (S12)
      var QB = thread.getPointAtLength(TL * P_BOX);

      $("nsvg").innerHTML = fxNeedle(150, "p08");

      /* ---- sous-titres (fxSubtitle du kit) ---- */
      function glue(a) { var n = a.nextSibling; if (n && n.nodeType === 3) n.parentNode.removeChild(n); }
      function wrap(el, spans, cls, extra) {
        var w = document.createElement("span"); w.className = cls;
        el.insertBefore(w, spans[0]);
        spans.forEach(function (s, i) { w.appendChild(s); if (i < spans.length - 1 && w.nextSibling && w.nextSibling.nodeType === 3) w.appendChild(w.nextSibling); });
        if (extra) w.insertAdjacentHTML("beforeend", extra);
        return w;
      }
      var W1S = [["La", 0.08], ["confection", 0.38], ["assemble", 0.90], ["chaque", 1.50, "kw"], ["maillot", 1.88, "kw"], [".", 1.88]];
      var W2S = [["Et", 2.53], ["vous", 2.68], ["êtes", 2.82], ["livrés", 3.04, "kw"], ["en", 3.44], ["moins", 3.80], ["d'un", 3.96], ["mois", 4.26], [".", 4.26]];
      var s1 = $("s1"), s2 = $("s2");
      var sp1 = fxSubtitle(s1, W1S), sp2 = fxSubtitle(s2, W2S);
      glue(sp1[4]); glue(sp2[7]);
      var kw1 = wrap(s1, [sp1[3], sp1[4]], "p08-kw", '<i class="fx-box" id="p08-box1"></i>');
      var kw2 = wrap(s2, [sp2[3]], "p08-kw", '<i class="fx-box" id="p08-box2"></i>');
      wrap(s2, [sp2[5], sp2[6], sp2[7]], "p08-pk", '<i class="fx-stroke" id="p08-stroke"></i>');

      /* ===================== état : proxies lus par UN seul onUpdate ===================== */
      var C = { x: 10900, y: 520, s: 1.3, b: 12 };                    // caméra (handoff_in : cam(10900, 520, 1.3) flou 12)
      var T = { p: P_IN, lk: 0 };                                       // le fil W2, le lien vers la ficelle
      var F = { o: 0, k: 1.1, b: 8, sy: 1, dx: -12, tx: 12 };           // le maillot à plat
      var G = { o: 0, k: 0.85, sy: 0.6, dx: 0, b: 0 };                  // le maillot plié (S11)
      var N = { o: 0, u: 0, h: 30, k: 3, b: 10, ey: -260, th: 0 };      // l'aiguille
      var S = { a: 0, b: 0, c: 0 };                                     // les trois points de couture
      var X = { o: 0, k: 1.1, b: 8, dx: 0, dy: 0, r: -2 };              // le carton
      var Jb = { o: 0, y: -300, sy: 1 };                                // le maillot qui tombe dans le carton
      var FL = { l: -0.7, r: -0.7, t: -0.7, b: -0.7 };                  // les rabats (négatif = ouverts vers l'extérieur)
      var R = { h: 0, v: 0, bow: 0, tail: 0 };                          // la ficelle
      var Lb = { o: 0, k: 3, b: 10, r: 14 };                            // l'étiquette
      var SK = { o: 0 };                                                // le papier de soie d'avant-plan

      var flat = $("flat"), flatimg = $("flatimg"), trim = $("trim"), fold = $("fold"), needle = $("needle"), nthread = $("nthread");
      var st = [$("st0"), $("st1"), $("st2")], box = $("box"), bj = $("bjersey"), link = $("link"), label = $("label"), silk = $("silk");
      var flaps = { l: $("fl"), r: $("fr"), t: $("ft"), b: $("fb") };
      var sh = $("sh"), sv = $("sv"), bow = $("bow"), tail = $("tail");
      // pointes de l'aiguille : la fin de chaque point de couture (coordonnées locales du maillot)
      var PT = [[331, 79.5], [339.8, 104], [348.5, 128.5]], FX0 = 11824, FY0 = 200;
      var ND = [Math.cos(112 * Math.PI / 180), Math.sin(112 * Math.PI / 180)];
      function blurF(v) { return v > 0.05 ? "blur(" + v.toFixed(2) + "px)" : "none"; }

      function render() {
        fxCam(world, cam, C.x, C.y, C.s, C.b);
        fxDrawThread(thread, T.p, FX.THREAD);

        // le maillot à plat : il se pose, l'emmanchure se ferme, il se plie
        flat.style.opacity = F.o;
        flat.style.transform = "scale(" + F.k.toFixed(4) + "," + (F.k * F.sy).toFixed(4) + ")";
        flat.style.filter = blurF(F.b);
        flatimg.style.transform = "translateX(" + F.dx.toFixed(2) + "px)";
        trim.style.transform = "translateX(" + F.tx.toFixed(2) + "px)";
        fxDrawThread(st[0], S.a); fxDrawThread(st[1], S.b); fxDrawThread(st[2], S.c);

        // le maillot plié glisse sur le fil vers le carton
        fold.style.opacity = G.o;
        fold.style.transform = "translateX(" + G.dx.toFixed(2) + "px) scale(" + G.k.toFixed(4) + "," + (G.k * G.sy).toFixed(4) + ")";
        fold.style.filter = blurF(G.b);

        // l'aiguille : pointe sur le point de couture courant, levée de h px
        var i0 = Math.min(1, Math.floor(N.u)), fr = N.u - i0, p0 = PT[i0], p1 = PT[Math.min(2, i0 + 1)];
        var tx = FX0 + p0[0] + (p1[0] - p0[0]) * fr, ty = FY0 + p0[1] + (p1[1] - p0[1]) * fr - N.h + N.ey;
        needle.style.opacity = N.o;
        needle.style.transform = "translate(" + tx.toFixed(2) + "px," + ty.toFixed(2) + "px) rotate(112deg) scale(" + N.k.toFixed(4) + ")";
        needle.style.filter = blurF(N.b);
        // son fil : du chas au dernier point piqué
        var ex = tx - 138 * N.k * ND[0], ey = ty - 138 * N.k * ND[1];
        var last = PT[Math.max(0, Math.min(2, Math.round(N.u)))], lx = FX0 + last[0], ly = FY0 + last[1];
        nthread.setAttribute("d", "M" + ex.toFixed(1) + " " + ey.toFixed(1) + " C " + (ex + 70).toFixed(1) + " " + (ey + 40).toFixed(1) + " " + (lx + 60).toFixed(1) + " " + (ly + 10).toFixed(1) + " " + lx.toFixed(1) + " " + ly.toFixed(1));
        nthread.style.opacity = N.th;

        // le carton
        box.style.opacity = X.o;
        box.style.transform = "translate(" + X.dx.toFixed(2) + "px," + X.dy.toFixed(2) + "px) rotate(" + X.r.toFixed(3) + "deg) scale(" + X.k.toFixed(4) + ")";
        box.style.filter = blurF(X.b);
        bj.style.opacity = Jb.o;
        bj.style.transform = "translateY(" + Jb.y.toFixed(2) + "px) scaleY(" + Jb.sy.toFixed(4) + ")";
        ["l", "r", "t", "b"].forEach(function (k) {
          var v = FL[k], el = flaps[k], horiz = (k === "l" || k === "r");
          el.style.transform = horiz ? "scaleX(" + v.toFixed(4) + ")" : "scaleY(" + v.toFixed(4) + ")";
          el.children[0].style.opacity = v < 0 ? 1 : 0;
          el.children[1].style.opacity = v < 0 ? 0 : 1;
        });
        fxDrawThread(sh, R.h); fxDrawThread(sv, R.v); fxDrawThread(bow, R.bow); fxDrawThread(tail, R.tail);
        label.style.opacity = Lb.o;
        label.style.transform = "rotate(" + Lb.r.toFixed(3) + "deg) scale(" + Lb.k.toFixed(4) + ")";
        label.style.filter = blurF(Lb.b);

        // le lien : le fil W2 monte du pied du carton jusqu'au bout gauche de la ficelle (suit le carton)
        var ra = X.r * Math.PI / 180, lxl = -380 * X.k, lyl = 2 * X.k;
        var bx = 14200 + X.dx + lxl * Math.cos(ra) - lyl * Math.sin(ra), by = 440 + X.dy + lxl * Math.sin(ra) + lyl * Math.cos(ra);
        link.setAttribute("d", "M" + QB.x.toFixed(1) + " " + QB.y.toFixed(1) + " C " + (QB.x + 70).toFixed(1) + " " + QB.y.toFixed(1) + " " + (bx - 60).toFixed(1) + " " + by.toFixed(1) + " " + bx.toFixed(1) + " " + by.toFixed(1));
        fxDrawThread(link, T.lk);

        // avant-plan : le papier de soie, parallaxe 1,5 autour du cadrage S12
        var fx = (14200 - C.x) * C.s * 1.5, fy = (470 - C.y) * C.s * 1.5;
        silk.style.opacity = SK.o;
        silk.style.transform = "translate(" + fx.toFixed(2) + "px," + fy.toFixed(2) + "px) rotate(-12deg)";
        silk.style.filter = "blur(" + (13 + C.b * 0.8).toFixed(2) + "px)";
      }

      /* ===================== la timeline unique, en pause ===================== */
      var tl = gsap.timeline({ paused: true, onUpdate: render });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }
      function tw(target, from, to, dur, ease, pos) { var o = {}, k; for (k in to) o[k] = to[k]; o.duration = dur; o.ease = ease; ft(target, from, o, pos); }

      /* ---- piste caméra ---- */
      // 0.00 à 0.30 fin du whip : départ à +6000 u/s (pente mesurée), arrêt doux sur cam(12000, 470, 1.2)
      var S11 = { x: 12000, y: 470, s: 1.2 }, kin = 6000 * 0.30 / (S11.x - 10900);
      var WHIP_IN = function (p) { return kin * p + (3 - 2 * kin) * p * p + (kin - 2) * p * p * p; };
      tw(C, { x: 10900, y: 520, s: 1.3 }, S11, 0.30, WHIP_IN, 0);
      tw(C, { b: 12 }, { b: 0 }, 0.30, "expo.out", 0);
      // dérive : suit l'aiguille (x +30 u/s)
      var S11D = { x: 12000 + 30 * 1.96, y: 470, s: 1.2 };
      tw(C, { x: 12000 }, { x: S11D.x }, 1.96, "none", 0.30);
      // 2.26 whip vers S12 : power2.in jusqu'au sommet (2.40, 61,8 % du trajet, vitesses égales), puis expo.out
      var S12 = { x: FX.FRAMING.S12[0], y: FX.FRAMING.S12[1], s: FX.FRAMING.S12[2] }, WF = 0.618, WM = {}, key;
      for (key in S12) WM[key] = S11D[key] + (S12[key] - S11D[key]) * WF;
      tw(C, S11D, WM, 0.14, "power2.in", 2.26);
      tw(C, WM, S12, 0.30, "expo.out", 2.40);
      tw(C, { b: 0 }, { b: 12 }, 0.14, "power2.in", 2.26);
      tw(C, { b: 12 }, { b: 0 }, 0.30, "expo.out", 2.40);
      // S12 : dérive x +20 u/s
      var S12D = { x: S12.x + 20 * 1.80 };
      tw(C, { x: S12.x }, S12D, 1.80, "none", 2.70);
      // 4.50 whip vers la droite (power2.in), flou 0 → 14 ; coupe franche à 4.65 au sommet du flou
      tw(C, { x: S12D.x }, { x: S12D.x + 900 }, 0.15, "power2.in", 4.50);
      tw(C, { b: 0 }, { b: 14 }, 0.15, "power2.in", 4.50);

      /* ---- scène 1 : la couture ---- */
      // le fil file sous le maillot
      tw(T, { p: P_IN }, { p: P_J }, 0.35, "expo.out", 0);
      // 0.15 le maillot à plat se pose (×1,1 flou 8 → net)
      tw(F, { o: 0 }, { o: 1 }, 0.04, "none", 0.15);
      tw(F, { k: 1.1, b: 8 }, { k: 1, b: 0 }, 0.12, "expo.out", 0.15);
      // 0.20 l'aiguille entre en haut, trop grande et floue (×3 flou 10 → net)
      tw(N, { o: 0 }, { o: 1 }, 0.05, "none", 0.20);
      tw(N, { k: 3, b: 10, ey: -260 }, { k: 1, b: 0, ey: 0 }, 0.20, "power3.out", 0.20);
      // 0.50, 1.00, 1.50 : trois piqûres ; à chaque montée la pointe se floute (elle vient vers l'objectif)
      [0.50, 1.00, 1.50].forEach(function (t0, i) {
        tw(N, { h: 30, b: i ? 3 : 0, k: i ? 1.05 : 1 }, { h: 0, b: 0, k: 1 }, 0.06, "power2.in", t0);
        tw(N, { h: 0, b: 0, k: 1 }, { h: 30, b: 3, k: 1.05 }, 0.10, "power3.out", t0 + 0.06);
        tw(S, { [["a", "b", "c"][i]]: 0 }, { [["a", "b", "c"][i]]: 1 }, 0.10, "power2.out", t0 + 0.06);
        if (i < 2) tw(N, { u: i }, { u: i + 1 }, 0.26, "power3.out", t0 + 0.18);
      });
      tw(N, { th: 0 }, { th: 1 }, 0.04, "none", 0.52);
      // 0.90 « assemble » : les deux bords de l'emmanchure se rapprochent
      tw(F, { dx: -12, tx: 12 }, { dx: 0, tx: 0 }, 0.30, "power3.out", 0.90);
      // 1.70 l'aiguille repart vers le haut (sortie rapide)
      tw(N, { ey: 0, b: 3 }, { ey: -520, b: 10 }, 0.16, "power2.in", 1.70);
      tw(N, { o: 1, th: 1 }, { o: 0, th: 0 }, 0.06, "none", 1.80);
      // 1.88 « maillot » : il se plie en deux puis en quatre, et devient le maillot plié
      tw(F, { sy: 1 }, { sy: 0.5 }, 0.12, "power2.in", 1.88);
      tw(F, { sy: 0.5 }, { sy: 0.25 }, 0.12, "power2.in", 2.00);
      tw(F, { o: 1 }, { o: 0 }, 0.05, "none", 2.10);
      tw(G, { o: 0 }, { o: 1 }, 0.05, "none", 2.08);
      tw(G, { k: 0.85, sy: 0.6 }, { k: 1, sy: 1 }, 0.14, "expo.out", 2.08);
      // 2.22 il glisse sur le fil vers le carton, plus lent que le whip ; il s'efface au sommet du flou
      tw(G, { dx: 0, b: 0 }, { dx: 700, b: 10 }, 0.18, "power2.in", 2.22);
      tw(G, { o: 1 }, { o: 0 }, 0.03, "none", 2.37);
      // le fil file jusqu'au pied du carton pendant le whip
      tw(T, { p: P_J }, { p: P_BOX }, 0.34, "power2.out", 2.26);

      /* ---- scène 2 : le carton, livré en moins d'un mois ---- */
      // le carton arrive par la droite avec le whip, se pose à 2.55 (×1,1 flou 8 → net)
      tw(X, { o: 0 }, { o: 1 }, 0.04, "none", 2.30);
      tw(X, { k: 1.1, b: 8 }, { k: 1, b: 0 }, 0.15, "expo.out", 2.55);
      tw(SK, { o: 0 }, { o: 0.95 }, 0.10, "none", 2.30);
      // 2.68 le maillot plié tombe dedans, tassement
      tw(Jb, { o: 0 }, { o: 1 }, 0.04, "none", 2.68);
      tw(Jb, { y: -300 }, { y: 0 }, 0.20, "power2.in", 2.68);
      tw(Jb, { sy: 1 }, { sy: 0.96 }, 0.05, "power2.out", 2.88);
      tw(Jb, { sy: 0.96 }, { sy: 1 }, 0.10, "power2.out", 2.93);
      // 3.04 « livrés » : les rabats se ferment (0,1 s chacun, 0,04 s d'écart)
      ["l", "r", "t", "b"].forEach(function (k, i) { var a = {}, b = {}; a[k] = -0.7; b[k] = 1; tw(FL, a, b, 0.10, "power2.inOut", 3.04 + i * 0.04); });
      // 3.20 le fil fait la ficelle : il entoure le carton en croix, puis noue une boucle
      tw(T, { lk: 0 }, { lk: 1 }, 0.08, "power2.out", 3.20);
      tw(R, { h: 0 }, { h: 1 }, 0.16, "power2.inOut", 3.26);
      tw(R, { v: 0 }, { v: 1 }, 0.16, "power2.inOut", 3.34);
      tw(R, { bow: 0 }, { bow: 1 }, 0.14, "power2.out", 3.48);
      // 3.44 l'étiquette arrive depuis la caméra et se colle
      tw(Lb, { o: 0 }, { o: 1 }, 0.05, "none", 3.44);
      tw(Lb, { k: 3, b: 10, r: 14 }, { k: 1, b: 0, r: 6 }, 0.20, "expo.out", 3.44);
      // 3.80 « moins » : le carton fait un petit saut de 8 px
      tw(X, { dy: 0 }, { dy: -8 }, 0.08, "power2.out", 3.80);
      tw(X, { dy: -8 }, { dy: 0 }, 0.12, "power2.in", 3.88);
      // 4.26 « mois » : le carton glisse vers la droite sur le fil ; la ficelle file hors du cadre
      tw(X, { dx: 0 }, { dx: 400 }, 0.30, "power2.in", 4.26);
      tw(R, { tail: 0 }, { tail: 1 }, 0.36, "power2.in", 4.26);

      /* ---- la phrase de la voix : mot par mot, gris puis encre ; une boîte par phrase, un trait ---- */
      function sayWords(spans, list) {
        spans.forEach(function (w, i) {
          var t0 = Math.max(0, list[i][1] - 1 / 30), kw = list[i][2] === "kw";
          ft(w, { y: 8, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, t0);
          if (kw) ft(w, { opacity: 0 }, { opacity: 1, duration: 0.10, ease: "power2.out" }, t0);
          else {
            ft(w, { opacity: 0 }, { opacity: 0.35, duration: 0.08, ease: "power2.out" }, t0);
            ft(w, { opacity: 0.35 }, { opacity: 1, duration: 0.20, ease: "power1.out" }, t0 + 0.10);
          }
        });
      }
      sayWords(sp1, W1S);
      sayWords(sp2, W2S);
      var BOXZ = { scaleX: 0, scaleY: 1, rotation: 0, skewX: 0, skewY: 0 };
      ft($("box1"), BOXZ, { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0, skewY: 0, duration: 0.16, ease: "power3.out" }, 1.46);
      ft($("box2"), BOXZ, { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0, skewY: 0, duration: 0.16, ease: "power3.out" }, 3.00);
      var stroke = $("stroke");
      gsap.set(stroke, { scaleX: 0, scaleY: 1, rotation: -1.2, skewX: 0, skewY: 0 });
      ft(stroke, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 3.80);
      ft(stroke, { scaleX: 0, scaleY: 1, rotation: -1.2, skewX: 0, skewY: 0 }, { scaleX: 1, scaleY: 1, rotation: -1.2, skewX: 0, skewY: 0, duration: 0.40, ease: "power2.out" }, 3.80);
      // la phrase sort (opacité 1 → 0, flou 0 → 6 px, 0,14 s)
      ft(s1, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.26);
      ft(s2, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 4.42);

      tl.set({}, {}, DUR);
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
