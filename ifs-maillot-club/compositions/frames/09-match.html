      // l'adversaire flou accompagne l'action, puis sort par la gauche pendant la poussée
      tw(OP, { x: -20 }, { x: 0 }, 2.60, "none", 0);
      tw(OP, { x: 0 }, { x: -620 }, 0.30, "power2.in", 2.60);

      /* ---- scène 2 : le rouge est resté rouge ---- */
      // 2.40 ses jambes se balancent (±6°, période 0,8 s, nombre fini de cycles)
      tw(SW, { a: 0 }, { a: 1 }, 0.30, "power2.out", 2.40);
      tw(SW, { ph: 0 }, { ph: (DUR - 2.40) / 0.8 }, DUR - 2.40, "none", 2.40);
      tw(SW, { a: 1 }, { a: 0.6 }, 1.75, "none", 2.70);
      // le fond se floute (profondeur de champ sur le dos)
      tw(DOF, { b: 0, lb: 14 }, { b: 5, lb: 22 }, 0.40, "power2.out", 2.60);
      // le ballon d'avant-plan retombe, flou, coupé par le bord droit
      ft(fball, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 2.62);
      tw(FB, { y: -360, r: 0 }, { y: 1300, r: 70 }, 0.95, "power2.in", 2.62);
      // 2.80 le nuancier arrive depuis la caméra (×3,2, flou 12 → net) et se pose contre le dos, à droite du 15
      tw(SWT, { o: 0 }, { o: 1 }, 0.06, "none", 2.80);
      tw(SWT, { k: 3.2, b: 12, r: -12 }, { k: 1, b: 0, r: -4 }, 0.22, "expo.out", 2.80);
      // 3.31 même teinte : un petit éclat blanc passe sur le maillot puis sur la pastille
      tw(SWT, { gx: -60 }, { gx: 190 }, 0.20, "power2.inOut", 3.31);
      tw(SWT, { go: 0 }, { go: 1 }, 0.06, "none", 3.31);
      tw(SWT, { go: 1 }, { go: 0 }, 0.06, "none", 3.45);
      // 3.97 « rouge » : le nuancier se tasse contre le tissu
      tw(SWT, { k: 1 }, { k: 0.98 }, 0.06, "power2.out", 3.97);
      tw(SWT, { k: 0.98 }, { k: 1 }, 0.14, "power2.out", 4.03);
      // 4.20 le brin rouge se détache du filet (effacé vers le haut) et file vers le haut à gauche
      tw(T, { u: LT }, { u: LA + LB }, 0.22, "power2.in", 4.20);
      ft(thF, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 4.22);
      tw(T, { f: 0 }, { f: 1 }, 0.53, "power2.in", 4.22);

      /* ---- la phrase de la voix : mot par mot, gris puis encre ; une boîte, un trait ---- */
      function sayWords(spans, list) {
        spans.forEach(function (w, j) {
          var st = Math.max(0, list[j][1] - 1 / 30), kw = list[j][2] === "box";
          ft(w, { y: 8, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, st);
          if (kw) ft(w, { opacity: 0 }, { opacity: 1, duration: 0.10, ease: "power2.out" }, st);
          else {
            ft(w, { opacity: 0 }, { opacity: 0.35, duration: 0.08, ease: "power2.out" }, st);
            ft(w, { opacity: 0.35 }, { opacity: 1, duration: 0.20, ease: "power1.out" }, st + 0.10);
          }
        });
      }
      sayWords(sp1, W1S);
      sayWords(sp2, W2S);
      var BOXZ = { scaleX: 0, scaleY: 1, rotation: 0, skewX: 0, skewY: 0 };
      ft(sp1[3].querySelector(".fx-box"), BOXZ, { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0, skewY: 0, duration: 0.16, ease: "power3.out" }, 1.27);
      ft(sp2[4].querySelector(".fx-box"), BOXZ, { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0, skewY: 0, duration: 0.16, ease: "power3.out" }, 3.93);
      var stroke = sp2[3].querySelector(".fx-stroke");
      gsap.set(stroke, { scaleX: 0, scaleY: 1, rotation: -1.2, skewX: 0, skewY: 0 });
      ft(stroke, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 3.69);
      ft(stroke, { scaleX: 0, scaleY: 1, rotation: -1.2, skewX: 0, skewY: 0 }, { scaleX: 1, scaleY: 1, rotation: -1.2, skewX: 0, skewY: 0, duration: 0.40, ease: "power2.out" }, 3.69);
      // la phrase sort (opacité 1 → 0, flou 0 → 6 px, 0,14 s)
      ft(s1, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.46);
      ft(s2, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 4.40);

      // durée exacte de la séquence
      tl.set({}, {}, DUR);

      // première image = handoff_in, avant tout seek
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
