        var d = "", i, r, R = [[-219, 120, 22], [-170, 104, 18], [-122, 90, 15], [-76, 78, 12], [-34, 70, 10]];
        function pt(row, i) { var a = Math.PI * i / 11, q = R[row]; return [1482 + q[1] * Math.cos(a), q[0] + q[2] * Math.sin(a)]; }
        for (r = 0; r < 4; r++) for (i = 0; i < 12; i++) {
          var a = pt(r, i), b = pt(r + 1, Math.min(11, i + 1)), c = pt(r + 1, Math.max(0, i - 1));
          d += "M" + a[0].toFixed(1) + " " + a[1].toFixed(1) + " L" + b[0].toFixed(1) + " " + b[1].toFixed(1) +
               " M" + a[0].toFixed(1) + " " + a[1].toFixed(1) + " L" + c[0].toFixed(1) + " " + c[1].toFixed(1) + " ";
        }
        $("gnet").setAttribute("d", d);
      })();

      /* ===================== W4 : géométrie (coordonnées monde = écran à cam(960, 540, 1)) ===================== */
      var world = $("world"), cam = $("cam"), thread = $("thread-path");
      var IK = 150 / 64;                                  // icône 150 px ; points du logo en unités 64
      var ICX = 693, ICY = 210;                           // position finale de l'icône (coin haut gauche)
      var EYE = [55.47 * IK, 12.02 * IK];                 // le chas, dans l'icône (px)
      var LOCKW = 282;                                    // demi-largeur du bloc logo + wordmark, depuis le bord gauche de l'icône

      // l'aiguille du logo : fxNeedle du kit (talon en haut à droite, pointe en bas à gauche, comme l'icône)
      var NL = 127, NW = NL * 0.045, needle = $("needle");
      needle.innerHTML = fxNeedle(NL, "p10") +
        '<clipPath id="p10-nclip"><path d="M0 0 C ' + NL * .25 + ' ' + (-NW) + ' ' + NL * .75 + ' ' + (-NW * .6) + ' ' + NL + ' 0 C ' + NL * .75 + ' ' + NW * .6 + ' ' + NL * .25 + ' ' + NW + ' 0 0 Z"/></clipPath>' +
        '<g clip-path="url(#p10-nclip)"><rect id="p10-glint" x="-16" y="-10" width="32" height="20" fill="url(#p10-glg)"/></g>';
      needle.querySelector("ellipse").setAttribute("fill", "none");   // le chas est un trou : on voit le fil au travers
      var glint = $("glint"), spark = $("spark");

      // la boucle du logo (icône, px), parcourue du coin haut gauche vers le chas
      function bez(a, b, c, e, n, out) {
        for (var k = 1; k <= n; k++) { var t = k / n, u = 1 - t;
          out.push([u * u * u * a[0] + 3 * u * u * t * b[0] + 3 * u * t * t * c[0] + t * t * t * e[0], u * u * u * a[1] + 3 * u * u * t * b[1] + 3 * u * t * t * c[1] + t * t * t * e[1]]); }
      }
      var CURL = [[8.5, 5.6]];
      bez([8.5, 5.6], [10.5, 7.6], [13.5, 9.4], [18, 10], 6, CURL);
      bez([18, 10], [25, 11], [30.6, 7.8], [30, 4.3], 10, CURL);
      bez([30, 4.3], [29.5, 1.3], [25, 1.8], [25.5, 5], 10, CURL);
      bez([25.5, 5], [26, 8.5], [31, 8.5], [36, 5.5], 10, CURL);
      bez([36, 5.5], [42, 1.5], [52, 2.5], [55.47, 12.02], 16, CURL);
      CURL = CURL.map(function (p) { return [p[0] * IK, p[1] * IK]; });

      // le fil hors de l'icône : du coin haut gauche de l'icône jusqu'au bord gauche (Catmull-Rom échantillonné)
      var A0 = [[20, 13], [-40, -26], [-170, -30], [-340, 26], [-540, 84], [-800, 64]];   // relatif à la position finale de l'icône
      var AW = [1, 1, 0.75, 0.45, 0.15, 0];               // part du déplacement de l'icône que suit chaque ancre (le bout gauche est fixe)
      var NS = 18, BASE = [], WTS = [];
      (function () {
        var i, k, t, a, b, c, e;
        for (i = 0; i < A0.length - 1; i++) {
          a = A0[Math.max(0, i - 1)]; b = A0[i]; c = A0[i + 1]; e = A0[Math.min(A0.length - 1, i + 2)];
          for (k = 0; k < NS; k++) { t = k / NS; var t2 = t * t, t3 = t2 * t;
            BASE.push([ICX + 0.5 * (2 * b[0] + (-a[0] + c[0]) * t + (2 * a[0] - 5 * b[0] + 4 * c[0] - e[0]) * t2 + (-a[0] + 3 * b[0] - 3 * c[0] + e[0]) * t3),
                       ICY + 0.5 * (2 * b[1] + (-a[1] + c[1]) * t + (2 * a[1] - 5 * b[1] + 4 * c[1] - e[1]) * t2 + (-a[1] + 3 * b[1] - 3 * c[1] + e[1]) * t3)]);
            WTS.push(AW[i] + (AW[i + 1] - AW[i]) * t);
          }
        }
        BASE.push([ICX + A0[A0.length - 1][0], ICY + A0[A0.length - 1][1]]); WTS.push(0);
      })();

      /* ---- sous-titres (fxSubtitle du kit) ---- */
      function glue(a) { var n = a.nextSibling; if (n && n.nodeType === 3) n.parentNode.removeChild(n); }
      var W1S = [["Contino", 0.74], ["Sport.", 1.05]];
      var W2S = [["Une", 1.62], ["qualité", 1.76], ["irréprochable", 2.20, "box"], [",", 2.20]];
      var W3S = [["livrée", 3.28], ["en", 3.80], ["moins", 4.08], ["d'un", 4.24], ["mois.", 4.38]];
      var s1 = $("s1"), s2 = $("s2"), s3 = $("s3");
      var sp1 = fxSubtitle(s1, W1S), sp2 = fxSubtitle(s2, W2S), sp3 = fxSubtitle(s3, W3S);
      glue(sp2[2]); sp2[2].classList.add("p10-kw");

      /* ===================== état : proxies lus par UN seul onUpdate ===================== */
      var G = { y: 120 };                                 // caméra W3 (handoff_in : cam(1480, 120, 1.15) flou 10)
      var C = { x: 909, y: 602, s: 1.0, b: 10 };          // caméra W4 ; dérive x +12 u/s jusqu'à cam(960, 540, 1.0) à 4.55
      var Z = { z: 1 };                                   // cran vers l'aiguille (point fixe : le chas)
      var L = { x: 834, y: 250, k: 1 };                   // bloc logo : coin haut gauche de l'icône, tassement
      var A = { k: 3, b: 12, o: 0 };                      // arrivée de l'icône depuis la caméra
      var T = { a: 0, b: 0 };                             // le fil : a = hors de l'icône, b = boucle du logo jusqu'au chas
      var W = { amp: 0, ph: -4 * Math.PI, pa: 0, pc: 1.15 };   // vague du fil ; pa/pc = la vague forte qui court vers le chas
      var N = { u: 0, o: 0 };                             // reflet de l'aiguille
      var S = { k: 0, o: 0 };                             // scintillement du chas
      var F = { o: 0, x: 0 };                             // boucle d'avant-plan

      var iback = $("iback"), ifront = $("ifront"), wm = $("wm"), loop = $("loop");

      function render() {
        fxCam(gworld, gcam, 1480, G.y, 1.15, 10);

        // le bloc logo : position, tassement autour de son centre
        var lcx = L.x + LOCKW, lcy = L.y + 75, k = L.k;
        var icx = lcx + (L.x + 75 - lcx) * k, icy = lcy + (L.y + 75 - lcy) * k;          // centre de l'icône
        var it = "translate(" + (icx - 75).toFixed(2) + "px," + (icy - 75).toFixed(2) + "px) scale(" + (k * A.k).toFixed(4) + ")";
        iback.style.transform = it; ifront.style.transform = it;
        iback.style.opacity = A.o; ifront.style.opacity = A.o;
        iback.style.filter = (A.b > 0.05 ? "blur(" + A.b.toFixed(2) + "px) " : "") + "drop-shadow(0px 22px 34px rgba(0,0,0,.5)) drop-shadow(0px 3px 8px rgba(0,0,0,.35))";
        ifront.style.filter = A.b > 0.05 ? "blur(" + A.b.toFixed(2) + "px)" : "none";
        wm.style.transform = "translate(" + (lcx + (L.x + 180 - lcx) * k).toFixed(2) + "px," + (lcy + (L.y + 16 - lcy) * k).toFixed(2) + "px) scale(" + k.toFixed(4) + ")";
        function ip(p) { return [icx + (p[0] - 75) * k, icy + (p[1] - 75) * k]; }   // point de l'icône → monde

        // caméra : cran vers l'aiguille, le chas reste fixe à l'écran
        var e = ip(EYE), z = Z.z;
        fxCam(world, cam, e[0] - (e[0] - C.x) / z, e[1] - (e[1] - C.y) / z, C.s * z, C.b);

        // le fil : bord gauche → coin de l'icône (vague) → boucle du logo → chas
        var dx = L.x - ICX, dy = L.y - ICY, n = BASE.length, pts = [], i, u, env, y;
        for (i = n - 1; i >= 0; i--) {
          u = i / (n - 1); env = Math.min(1, u * 3.2);
          y = BASE[i][1] + dy * WTS[i] + env * (W.amp * Math.sin(u * 2 * Math.PI * 1.7 - W.ph) + W.pa * Math.exp(-Math.pow((u - W.pc) / 0.09, 2)));
          pts.push([BASE[i][0] + dx * WTS[i], y]);
        }
        var lo = 0, lc = 0, d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1), q, j;
        for (j = 1; j < pts.length; j++) lo += Math.hypot(pts[j][0] - pts[j - 1][0], pts[j][1] - pts[j - 1][1]), d += " L" + pts[j][0].toFixed(1) + " " + pts[j][1].toFixed(1);
        var prev = pts[pts.length - 1];
        for (j = 1; j < CURL.length; j++) { q = ip(CURL[j]); lc += Math.hypot(q[0] - prev[0], q[1] - prev[1]); prev = q; d += " L" + q[0].toFixed(1) + " " + q[1].toFixed(1); }
        thread.setAttribute("d", d);
        fxDrawThread(thread, (T.a * lo + T.b * lc) / (lo + lc), FX.THREAD);   // tête mesurée sur le vrai chemin

        // reflet de l'aiguille, scintillement du chas
        glint.setAttribute("x", (N.u * (NL + 32) - 32).toFixed(2));
        glint.style.opacity = N.o;
        spark.setAttribute("transform", "translate(" + EYE[0].toFixed(2) + " " + EYE[1].toFixed(2) + ") rotate(" + (S.k * 45).toFixed(2) + ") scale(" + S.k.toFixed(4) + ")");
        spark.style.opacity = S.o;

        // avant-plan : la boucle floue (parallaxe 1,6)
        var cs = C.s * z, cx = e[0] - (e[0] - C.x) / z, cy = e[1] - (e[1] - C.y) / z;
        var fx = (960 - cx) * cs * 1.6 + F.x, fy = (540 - cy) * cs * 1.6, fk = Math.pow(cs, 1.6);
        loop.style.transform = "translate(" + fx.toFixed(2) + "px," + fy.toFixed(2) + "px) scale(" + fk.toFixed(4) + ")";
        loop.style.filter = "blur(" + (14 + C.b * 0.8).toFixed(2) + "px)";
        loop.style.opacity = F.o;
      }

      /* ===================== la timeline unique, en pause ===================== */
      var tl = gsap.timeline({ paused: true, onUpdate: render });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }
      function tw(target, from, to, dur, ease, pos) { var o = {}, kk; for (kk in to) o[kk] = to[kk]; o.duration = dur; o.ease = ease; ft(target, from, o, pos); }

      /* ---- piste caméra ---- */
      // 0.00 à 0.12 fin du tilt dans la salle : -2400 u/s en y, flou 10 ; au sommet du flou, le sol d'encre W4 prend le cadre
      tw(G, { y: 120 }, { y: 120 - 2400 * 0.12 }, 0.12, "none", 0);
      ["gground", "gscene"].forEach(function (id) { ft($(id), { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "none" }, 0.12); });
      ["ground", "scene", "fore"].forEach(function (id) { ft($(id), { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 0.12); });
      // 0.12 à 0.30 le tilt se pose (expo.out, même vitesse au raccord), flou 10 → 0
      tw(C, { y: 602, b: 10 }, { y: 540, b: 0 }, 0.18, "expo.out", 0.12);
      // 0.30 à 4.55 dérive x +12 u/s
      tw(C, { x: 909 }, { x: 960 }, DUR - 0.30, "none", 0.30);
      // 2.40 cran ×1 → ×1,06 vers l'aiguille, puis retour à ×1 par une dérive d'échelle jusqu'à 4.55
      tw(Z, { z: 1 }, { z: 1.06 }, 0.30, "expo.out", 2.40);
      tw(Z, { z: 1.06 }, { z: 1 }, DUR - 2.70, "none", 2.70);

      /* ---- le fil, l'icône, l'aiguille ---- */
      // 0.12 le fil traverse le cadre depuis le bord gauche vers le centre haut (0,4 s expo.out)
      tw(T, { a: 0 }, { a: 1 }, 0.40, "expo.out", 0.12);
      // 0.12 l'icône arrive depuis la caméra (×3 flou 12 → net, 0,22 s expo.out), en avance sur « IFS »
      tw(A, { o: 0 }, { o: 1 }, 0.06, "none", 0.12);
      tw(A, { k: 3, b: 12 }, { k: 1, b: 0 }, 0.22, "expo.out", 0.12);
      // 0.60 l'aiguille s'allume : un reflet la parcourt
      tw(N, { o: 0 }, { o: 1 }, 0.03, "none", 0.60);
      tw(N, { u: 0 }, { u: 1 }, 0.22, "power2.inOut", 0.60);
      tw(N, { o: 1 }, { o: 0 }, 0.04, "none", 0.80);
      // 0.80 le fil suit la boucle du logo et passe dans le chas (0,15 s) ; scintillement
      tw(T, { b: 0 }, { b: 1 }, 0.15, "power2.inOut", 0.80);
      tw(S, { k: 0, o: 0 }, { k: 1, o: 1 }, 0.10, "expo.out", 0.93);
      tw(S, { k: 1, o: 1 }, { k: 0.5, o: 0 }, 0.18, "power2.in", 1.03);
      // 1.00 « IFS » s'assemble lettre par lettre ; le bloc glisse à gauche pour se centrer
      tw(L, { x: 834 }, { x: ICX }, 0.40, "power3.out", 1.00);
      Array.prototype.forEach.call(wm.querySelectorAll(".p10-l"), function (el, i) {
        ft(el, { opacity: 0, scale: 1.3, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.22, ease: "expo.out" }, 1.00 + i * 0.05);
      });
      ft($("tag"), { opacity: 0, y: 10, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.18, ease: "power3.out" }, 1.15);
      // 1.25 le fil ondule (vague ±10 px qui court, 2 boucles de 1,65 s, finie à 4.55)
      tw(W, { amp: 0 }, { amp: 10 }, 0.50, "power1.inOut", 1.25);
      tw(W, { ph: -4 * Math.PI }, { ph: 0 }, DUR - 1.25, "none", 1.25);
      // 1.96 « irréprochable » : le logo se tasse
      tw(L, { k: 1 }, { k: 1.02 }, 0.06, "power2.out", 1.96);
      tw(L, { k: 1.02 }, { k: 1 }, 0.26, "power3.out", 2.02);
      // 2.96 « livrée » : une vague plus forte court le long du fil jusqu'au chas
      tw(W, { pa: 0 }, { pa: 20 }, 0.06, "none", 2.96);
      tw(W, { pc: 1.15 }, { pc: -0.1 }, 0.40, "power1.in", 2.96);
      tw(W, { pa: 20 }, { pa: 0 }, 0.06, "none", 3.32);
      // 3.40 le reflet repasse sur l'aiguille
      tw(N, { o: 0 }, { o: 1 }, 0.03, "none", 3.40);
      tw(N, { u: 0 }, { u: 1 }, 0.22, "power2.inOut", 3.40);
      tw(N, { o: 1 }, { o: 0 }, 0.04, "none", 3.60);
      // 3.82 « moins » : le fil se tend un instant
      tw(W, { amp: 10 }, { amp: 1.5 }, 0.10, "power2.out", 3.82);
      tw(W, { amp: 1.5 }, { amp: 10 }, 0.40, "power2.inOut", 3.95);
      // 4.26 le bloc logo remonte de 40 px pour laisser la place au bouton
      tw(L, { y: 250 }, { y: ICY }, 0.25, "power3.out", 4.26);

      /* ---- avant-plan : la boucle floue entre avec le sol d'encre et sort par la gauche avant la couture ---- */
      tw(F, { o: 0 }, { o: 0.85 }, 0.01, "none", 0.12);
      tw(F, { o: 0.85, x: 0 }, { o: 0, x: -160 }, 0.34, "power2.in", 3.96);

      /* ---- la phrase de la voix : mot par mot, gris puis encre ; une boîte ---- */
      function sayWords(spans, list) {
        spans.forEach(function (w, i) {
          var st = Math.max(0, list[i][1] - 1 / 30), kw = list[i][2] === "box";
          ft(w, { y: 8, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, st);
          if (kw) ft(w, { opacity: 0 }, { opacity: 1, duration: 0.10, ease: "power2.out" }, st);
          else {
            ft(w, { opacity: 0 }, { opacity: 0.35, duration: 0.08, ease: "power2.out" }, st);
            ft(w, { opacity: 0.35 }, { opacity: 1, duration: 0.20, ease: "power1.out" }, st + 0.10);
          }
        });
      }
      sayWords(sp1, W1S); sayWords(sp2, W2S); sayWords(sp3, W3S);
      var BOXZ = { scaleX: 0, scaleY: 1, rotation: 0, skewX: 0, skewY: 0 };
      ft(sp2[2].querySelector(".fx-box"), BOXZ, { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0, skewY: 0, duration: 0.16, ease: "power3.out" }, 2.16);
      // chaque morceau sort avant le suivant (opacité 1 → 0, flou 0 → 6 px, 0,14 s)
      ft(s1, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.46);
      ft(s2, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 3.12);
      // le dernier morceau tient jusqu'à la coupe : « mois. » arrive à 4.38, la séquence 11 enchaîne sur « Découvrez »

      // durée exacte de la séquence
      tl.set({}, {}, DUR);

      // première image = handoff_in, avant tout seek
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
