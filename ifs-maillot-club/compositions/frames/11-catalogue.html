      var letters = url.querySelectorAll("i");

      /* ===================== état : proxies lus par UN seul onUpdate ===================== */
      var C = { x: 960, y: 540, s: 1.0, g: 1 };          // caméra (handoff_in : cam(960, 540, 1.0) flou 0) ; g = croissance lente
      var F = { b: 0 };                                  // mise au point du fond (logo, fil)
      var W = { ph: 0, amp: 10 };                        // vague du fil A
      var T = { p: 0 };                                  // fil B
      var Bt = { o: 0, ci: 49.5 };                       // bouton : ouverture en inset
      var K = { cu: 0, ck: 1, dx: 0, dy: 0 };            // curseur
      var G = { u: 0, o: 0 };                            // reflet de l'aiguille
      var L = { o: 0 };                                  // boucle d'avant-plan
      var CUR0 = [2060, 830], CURC = [1460, 820];        // hors cadre en bas à droite → une seule courbe vers le bouton

      var back = $("back"), btn = $("btn"), cursor = $("cursor"), loop = $("loop"), tbSvg = $("tailB"), glintSvg = $("glint"), glintDot = $("glint-dot");

      function render() {
        fxCam(world, cam, C.x, C.y, C.s * C.g, 0);
        back.style.filter = F.b > 0.05 ? "blur(" + F.b.toFixed(2) + "px)" : "none";
        tailA.setAttribute("d", tailAD(W.ph, W.amp));
        tbSvg.style.opacity = T.p > 0.001 ? 1 : 0;
        fxDrawThread(tailB, T.p, FX.THREAD);

        btn.style.opacity = Bt.o;
        btn.style.clipPath = "inset(" + Bt.ci.toFixed(3) + "% 0% " + Bt.ci.toFixed(3) + "% 0% round 22px)";

        // le curseur : une seule courbe (x et y sur deux courbes de Bézier), puis une dérive de 8 px
        var t = K.cu, it = 1 - t;
        var cx = it * it * CUR0[0] + 2 * it * t * CURC[0] + t * t * CLICK[0] + K.dx, cy = it * it * CUR0[1] + 2 * it * t * CURC[1] + t * t * CLICK[1] + K.dy;
        cursor.style.transform = "translate(" + (cx - 3).toFixed(2) + "px," + (cy - 2).toFixed(2) + "px) scale(" + K.ck.toFixed(4) + ")";

        // reflet le long de l'aiguille (du talon vers le chas)
        glintSvg.style.opacity = G.o;
        glintDot.setAttribute("transform", "translate(" + (34 + 24 * G.u).toFixed(2) + " " + (55 - 46 * G.u).toFixed(2) + ") rotate(-62)");

        // avant-plan : parallaxe 1,6 autour du cadrage de la carte
        var s = C.s * C.g, fx = (960 - C.x) * s * 1.6, fy = (548 - C.y) * s * 1.6, fk = Math.pow(s, 1.6);
        loop.style.transform = "translate(" + fx.toFixed(2) + "px," + fy.toFixed(2) + "px) scale(" + fk.toFixed(4) + ")";
        loop.style.opacity = L.o;
        loop.style.filter = "blur(14px)";
      }

      /* ===================== la timeline unique, en pause ===================== */
      var tl = gsap.timeline({ paused: true, onUpdate: render });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }
      function tw(target, from, to, dur, ease, pos) { var o = {}, k; for (k in to) o[k] = to[k]; o.duration = dur; o.ease = ease; ft(target, from, o, pos); }

      /* ---- piste caméra ---- */
      // dérive x +12 u/s sur toute la séquence (déjà en cours au raccord)
      tw(C, { x: 960 }, { x: 960 + 12 * DUR }, DUR, "none", 0);
      // 0.00 à 0.20 cran ×1,0 → ×1,04 vers le bouton (expo.out) ; la mise au point passe du logo au bouton
      tw(C, { y: 540, s: 1.0 }, { y: 548, s: 1.04 }, 0.20, "expo.out", 0);
      tw(F, { b: 0 }, { b: 1.1 }, 0.30, "power2.out", 0.05);
      // 0.20 à 5.25 échelle +0,6 %/s
      tw(C, { g: 1 }, { g: 1 + 0.006 * (DUR - 0.20) }, DUR - 0.20, "none", 0.20);

      /* ---- le fil ondule (vague ±10 px, 3 cycles : boucle finie sur la durée) ---- */
      tw(W, { ph: 0 }, { ph: 2 * Math.PI * 3 }, DUR, "none", 0);

      /* ---- 0.00 le fil descend sous le logo et trace la ligne de 420 px ---- */
      tw(T, { p: 0 }, { p: 1 }, 0.30, "power2.inOut", 0);
      tw(L, { o: 0 }, { o: 0.8 }, 0.60, "power2.out", 0.30);

      /* ---- 0.30 la ligne s'ouvre en bouton (clip inset 49,5 % → 0) ---- */
      tw(Bt, { o: 0 }, { o: 1 }, 0.02, "none", 0.30);
      tw(Bt, { ci: 49.5 }, { ci: 0 }, 0.22, "power3.out", 0.30);
      ft($("halo"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.30);

      /* ---- 0.67 « notre » : l'URL s'écrit sous le bouton (0,015 s par lettre) ---- */
      Array.prototype.forEach.call(letters, function (el, i) {
        ft(el, { opacity: 0, y: 6, filter: "blur(3px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.12, ease: "power3.out" }, 0.67 + i * 0.015);
      });

      /* ---- 0.70 à 1.15 le curseur arrive en une courbe ; 1.10 clic direct ---- */
      ft(cursor, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 0.70);
      tw(K, { cu: 0 }, { cu: 1 }, 0.45, "power3.out", 0.70);
      tw(K, { ck: 1 }, { ck: 0.85 }, 0.06, "none", 1.10);
      tw(K, { ck: 0.85 }, { ck: 1 }, 0.14, "power3.out", 1.16);
      ft(btn, { scale: 1 }, { scale: 0.96, duration: 0.06, ease: "none" }, 1.10);
      ft(btn, { scale: 0.96 }, { scale: 1, duration: 0.40, ease: "power3.out" }, 1.16);
      // le bouton se remplit : accent-light → blanc → accent en 0,27 s
      ft($("bfL"), { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 1.10);
      ft($("bfW"), { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "power2.out" }, 1.15);
      ft($("bfW"), { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power2.in" }, 1.22);
      ft($("bfL"), { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power2.in" }, 1.22);
      // onde accent qui s'ouvre et s'efface ; halo derrière le bouton
      ft($("ripA"), { opacity: 1, scale: 0.4 }, { opacity: 0, scale: 4.2, duration: 0.70, ease: "power2.out" }, 1.10);
      ft($("ripB"), { opacity: 0.8, scale: 0.4 }, { opacity: 0, scale: 3.2, duration: 0.70, ease: "power2.out" }, 1.18);
      ft($("burst"), { opacity: 0, scale: 1 }, { opacity: 0.7, scale: 1.25, duration: 0.25, ease: "power2.out" }, 1.16);
      ft($("burst"), { opacity: 0.7, scale: 1.25 }, { opacity: 0.25, scale: 1.15, duration: 0.80, ease: "power2.inOut" }, 1.41);

      /* ---- 1.40 à 4.60 tenue vivante ---- */
      tw(K, { dx: 0, dy: 0 }, { dx: -7, dy: 4 }, 3.20, "sine.inOut", 1.40);
      // 2.80 l'aiguille brille une fois
      tw(G, { o: 0 }, { o: 0.9 }, 0.12, "power2.out", 2.80);
      tw(G, { u: 0 }, { u: 1 }, 0.55, "power2.inOut", 2.80);
      tw(G, { o: 0.9 }, { o: 0 }, 0.18, "power2.in", 3.17);
      // le halo du bouton respire une fois, lentement
      ft($("burst"), { opacity: 0.25 }, { opacity: 0.42, duration: 1.0, ease: "sine.inOut" }, 2.30);
      ft($("burst"), { opacity: 0.42 }, { opacity: 0.25, duration: 1.0, ease: "sine.inOut" }, 3.30);

      /* ---- la phrase de la voix : mot par mot, gris puis encre ; une boîte ---- */
      sp.forEach(function (w, i) {
        var st = Math.max(0, WS[i][1] - 1 / 30), kw = WS[i][2] === "box";
        ft(w, { y: 8, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, st);
        if (kw) ft(w, { opacity: 0 }, { opacity: 1, duration: 0.10, ease: "power2.out" }, st);
        else {
          ft(w, { opacity: 0 }, { opacity: 0.35, duration: 0.08, ease: "power2.out" }, st);
          ft(w, { opacity: 0.35 }, { opacity: 1, duration: 0.20, ease: "power1.out" }, st + 0.10);
        }
      });
      ft(sp[2].querySelector(".fx-box"), { scaleX: 0, scaleY: 1, rotation: 0, skewX: 0, skewY: 0 },
        { scaleX: 1, scaleY: 1, rotation: 0, skewX: 0, skewY: 0, duration: 0.16, ease: "power3.out" }, 0.93);

      /* ---- 4.60 fondu au noir, le seul du film (noir plein dès 5.20, dernière image) ---- */
      ft($("black"), { opacity: 0 }, { opacity: 1, duration: 0.60, ease: "power1.inOut" }, 4.60);

      // durée exacte de la séquence
      tl.set({}, {}, DUR);

      // première image = handoff_in, avant tout seek
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
