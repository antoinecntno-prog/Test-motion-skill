<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>IFS · Le fil rouge, référence exécutable</title>
<!--
  Référence exécutable du film IFS « Du mail au parquet », direction A « Le fil rouge » (voir ../frame.md).
  Source UNIQUE du code commun : chaque séquence copie MOT POUR MOT le bloc CSS et le kit JS ci-dessous.
  Seuls changements autorisés : « ../assets/ » devient « assets/ », et les id reçoivent le préfixe de la séquence.
  Ouvrir dans Chromium et appeler demo("W1", 3000, 500, 1.05, 0.6), demo("W2", 7600, 470, 1, 0.55),
  demo("gym"), demo("pivot"), demo("fin") pour voir les états de référence.
  Aucune dépendance réseau : le kit n'utilise pas GSAP ; les séquences animent avec GSAP et appellent le kit
  (fxCam, fxDrawThread) dans un seul onUpdate.
  Le kit JS se colle À L'INTÉRIEUR de la fonction immédiate de la séquence ((function () { … })();), jamais au niveau
  global : toutes les séquences vivent dans la même page assemblée et « const FX » déclaré deux fois la ferait planter.
  GSAP se charge en local : <script src="assets/vendor/gsap-3.14.2.min.js"></script> (le CDN est bloqué ici).
-->
<style>
  /* ===================== FIL IFS : début du bloc CSS à copier ===================== */
  @font-face { font-family: "Archivo"; font-weight: 700 900; font-stretch: 75% 100%; src: url("../assets/fonts/archivo-latin.woff2") format("woff2"); }
  @font-face { font-family: "Hanken Grotesk"; font-weight: 400 700; src: url("../assets/fonts/hanken-grotesk-latin.woff2") format("woff2"); }
  @font-face { font-family: "Pacifico"; src: url("../assets/fonts/studio-pacifico.woff2") format("woff2"); }
  .fx-layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  /* sols : encre (douleur, match, fin), papier (atelier), noir (pivot) */
  .fx-ink { background: repeating-linear-gradient(115deg, rgba(255,255,255,.028) 0 2px, transparent 2px 46px),
    radial-gradient(120% 90% at 50% 40%, #241B2B 0%, #1A1320 55%, #110C15 100%); }
  .fx-paper { background: repeating-linear-gradient(115deg, rgba(179,18,95,.05) 0 2px, transparent 2px 46px),
    linear-gradient(180deg, #FFFFFF 0%, #F7F3F6 100%); }
  .fx-black { background: #110C15; }
  .fx-grain { pointer-events: none; opacity: .05; mix-blend-mode: screen;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23g)'/></svg>"); }
  .fx-grain.paper { opacity: .03; mix-blend-mode: multiply; }
  /* kit caméra : #stage > #drift > #cam > #world (le monde fait la taille de ses stations) */
  .fx-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
  .fx-drift, .fx-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 540px; }
  .fx-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .fx-st { position: absolute; }                       /* une station : placée par son centre en coordonnées monde */
  .fx-thread { position: absolute; left: 0; top: 0; overflow: visible; }
  /* sous-titre : la phrase de la voix, bas centre (bande y 890 à 980), mot par mot */
  .fx-sub { position: absolute; left: 0; top: 896px; width: 1920px; text-align: center; font: 600 62px/74px "Hanken Grotesk", sans-serif;
    letter-spacing: -0.015em; color: #1A1320; white-space: nowrap; text-shadow: 0 2px 14px rgba(255,255,255,.8); }
  .fx-sub.dark { color: #F5EFF3; text-shadow: 0 2px 16px rgba(0,0,0,.6); }
  .fx-sw { display: inline-block; opacity: 0; position: relative; }
  .fx-box { position: absolute; left: -.14em; right: -.14em; top: .06em; bottom: .02em; background: #B3125F; border-radius: 3px;
    transform: scaleX(0); transform-origin: 0 50%; z-index: -1; }
  .fx-stroke { position: absolute; left: -2%; right: -4%; bottom: -8px; height: 7px; border-radius: 50%; transform: scaleX(0) rotate(-1.2deg);
    transform-origin: 0 50%; background: linear-gradient(90deg, transparent, #B3125F 12%, #B3125F 70%, transparent); }
  .fx-sub.dark .fx-stroke { background: linear-gradient(90deg, transparent, #FF7DBA 12%, #FF7DBA 70%, transparent); }
  .fx-type { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: grid; place-items: center;
    font: 800 84px/1.08 "Archivo"; font-stretch: 85%; letter-spacing: -.01em; color: #F5EFF3; }
  /* curseur */
  .fx-cursor { position: absolute; left: 0; top: 0; width: 46px; height: 58px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  .fx-ripple { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border: 4px solid rgba(179,18,95,.55); border-radius: 50%; opacity: 0; }
  /* ===================== FIL IFS : fin du bloc CSS à copier ===================== */
  html, body { margin: 0; background: #1A1320; }
  #frame { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
</style>
</head>
<body>
<div id="frame">
  <div class="fx-layer fx-ink" id="ground"></div>
  <div class="fx-stage"><div class="fx-drift" id="drift"><div class="fx-cam" id="cam"><div class="fx-world" id="world">
    <svg class="fx-thread" id="thread" width="16000" height="1080"><path id="threadPath" fill="none" stroke="#D62839" stroke-width="5" stroke-linecap="round"/></svg>
    <div id="stations"></div>
  </div></div></div></div>
  <div class="fx-layer fx-grain" id="grain"></div>
  <div class="fx-sub dark" id="sub"></div>
</div>
<script>
/* ===================== FIL IFS : début du kit JS à copier ===================== */
const FX = {
  W: 1920, H: 1080, THREAD: "#D62839", FADED: "#E8823A", ACCENT: "#B3125F", INK: "#1A1320",
  /* ancres du fil par monde (coordonnées monde) : la courbe passe par chacune, dans cet ordre */
  ANCHORS: {
    W1: [[560,250],[1500,600],[2400,640],[3150,420],[3700,700],[4500,660],[5100,700],[6000,650],[7000,620],[7800,560],[9000,640],[9920,380]],
    W2: [[-200,560],[700,640],[1800,620],[3200,700],[4600,640],[5400,520],[6500,660],[7600,700],[8800,640],[9800,470],[10600,600],[12000,520],[13200,660],[14200,560]]
  },
  /* cadrages de référence (frame.md) */
  FRAMING: {
    S1:[960,500,1.0], S2:[3000,500,1.05], S3:[5400,520,0.95], S4:[7800,480,1.1], S5:[10000,470,1.25],
    S6:[960,480,1.0], S7:[3200,470,0.95], S8:[5400,470,1.05], S9:[7600,470,1.0], S10:[9800,470,1.4], S11:[12000,470,1.2], S12:[14200,470,1.0]
  }
};
/* caméra : amène (x, y) du monde au centre du cadre à l'échelle s ; blur en px sur #cam */
function fxCam(world, cam, x, y, s, blur) {
  world.style.transform = `translate(${960 - x}px, ${540 - y}px)`;
  world.style.transformOrigin = `${x}px ${y}px`;
  cam.style.transform = `scale(${s})`;
  cam.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : "none";
}
/* Catmull-Rom → Bézier : chemin SVG lisse passant par toutes les ancres */
function fxThreadD(name) {
  const p = FX.ANCHORS[name]; let d = `M${p[0][0]} ${p[0][1]}`;
  for (let i = 0; i < p.length - 1; i++) {
    const a = p[Math.max(0, i - 1)], b = p[i], c = p[i + 1], e = p[Math.min(p.length - 1, i + 2)];
    const c1 = [b[0] + (c[0] - a[0]) / 6, b[1] + (c[1] - a[1]) / 6], c2 = [c[0] - (e[0] - b[0]) / 6, c[1] - (e[1] - b[1]) / 6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${c[0]} ${c[1]}`;
  }
  return d;
}
/* nœud (douleur, S3) : trois boucles serrées autour de (cx, cy), tension 0 → 1 les resserre */
function fxKnotD(cx, cy, tension) {
  const r = 46 - 26 * tension; let d = `M${cx - 120} ${cy}`;
  for (let k = 0; k < 3; k++) { const o = (k - 1) * r * 0.55;
    d += ` C${cx - 40 + o} ${cy - r * 1.6} ${cx + 40 + o} ${cy - r * 1.6} ${cx + o} ${cy}` +
         ` C${cx - 40 + o} ${cy + r * 1.6} ${cx + 40 + o} ${cy + r * 1.6} ${cx + 20 + o} ${cy}`; }
  return d + ` L${cx + 120} ${cy + 10}`;
}
/* dessine le fil : progress 0 → 1 de sa longueur (signature « le fil trace ») ; color THREAD ou FADED */
function fxDrawThread(pathEl, progress, color) {
  const L = pathEl.getTotalLength();
  pathEl.style.strokeDasharray = `${L} ${L}`;
  pathEl.style.strokeDashoffset = `${L * (1 - Math.max(0, Math.min(1, progress)))}`;
  if (color) pathEl.setAttribute("stroke", color);
  return pathEl.getPointAtLength(L * progress);       // la tête du fil (pour la caméra ou l'aiguille)
}
/* aiguille du logo IFS (len px), pointe vers la droite ; renvoie du SVG à placer dans un <svg> ;
   uid = préfixe de la séquence (« p04 »), pour que l'id du dégradé soit unique dans la page assemblée */
function fxNeedle(len, uid = "fx") {
  const w = len * 0.045;
  return `<defs><linearGradient id="${uid}NeedleG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A93A1"/><stop offset=".5" stop-color="#3C4452"/><stop offset="1" stop-color="#4A5260"/></linearGradient></defs>
    <path d="M0 0 C ${len * .25} ${-w} ${len * .75} ${-w * .6} ${len} 0 C ${len * .75} ${w * .6} ${len * .25} ${w} 0 0 Z" fill="url(#${uid}NeedleG)"/>
    <ellipse cx="${len * .08}" cy="0" rx="${len * .045}" ry="${w * .32}" fill="#110C15"/>`;
}
/* stickman (frame.md) : renvoie le SVG d'une pose, en coordonnées locales (tête en (0, -270), bassin en (0, 0)) */
const FX_POSES = {
  echauffement: { arms: [[[-30,-200],[-70,-130],[-60,-60]], [[30,-200],[80,-140],[110,-80]]], legs: [[[-20,0],[-40,90],[-45,180]], [[20,0],[50,90],[60,180]]], lean: 0 },
  attente:      { arms: [[[-30,-200],[-50,-120],[-45,-50]], [[30,-200],[50,-120],[45,-50]]], legs: [[[-20,0],[-25,90],[-30,180]], [[20,0],[25,90],[30,180]]], lean: 0 },
  telephone:    { arms: [[[-30,-200],[-50,-120],[-45,-50]], [[30,-200],[40,-140],[0,-170]]], legs: [[[-20,0],[-25,90],[-30,180]], [[20,0],[25,90],[30,180]]], lean: -4 },
  smash:        { arms: [[[-62,-226],[-120,-156],[-165,-98]], [[66,-252],[150,-315],[248,-383]]], legs: [[[17,-5],[-68,-5],[-110,57]], [[86,-17],[22,77],[-88,117]]], lean: -10 }
};
function fxStickman(pose, opts = {}) {
  const P = FX_POSES[pose], line = pts => "M" + pts.map(p => p.join(" ")).join(" L");
  const limbs = [...P.arms, ...P.legs].map(line).join(" ") + ` M${P.arms[0][0].join(" ")} L0 -215 L${P.arms[1][0].join(" ")} M${P.legs[0][0].join(" ")} L0 0 L${P.legs[1][0].join(" ")}`;
  const bib = opts.bib ? `<rect x="-62" y="-215" width="124" height="200" rx="10" fill="#6d6670" transform="rotate(${P.lean})"/>` : "";
  return `<g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="${limbs}" stroke="#fff" stroke-opacity=".55" stroke-width="30" style="filter:blur(2.2px)"/>
      <path d="${limbs}" stroke="#0d0a10" stroke-width="22"/>
      <path d="M0 -215 L0 0" stroke="#0d0a10" stroke-width="22" transform="rotate(${P.lean})"/></g>
    ${bib}<circle cx="${-12 + P.lean}" cy="-272" r="62" fill="#0d0a10" stroke="#fff" stroke-opacity=".75" stroke-width="4"/>`;
}
/* sous-titre mot par mot : words = [["Juin", 0.03, "box"], [",", ...]] ; renvoie les spans pour GSAP */
function fxSubtitle(el, words) {
  el.innerHTML = words.map(([w, , mark]) =>
    `<span class="fx-sw">${w}${mark === "box" ? '<i class="fx-box"></i>' : ""}${mark === "stroke" ? '<i class="fx-stroke"></i>' : ""}</span>`).join(" ");
  return [...el.querySelectorAll(".fx-sw")];
}
/* ===================== FIL IFS : fin du kit JS à copier ===================== */

/* démo (hors film) : états de référence */
function demo(world = "W1", x = 3000, y = 500, s = 1.05, progress = 0.6) {
  const g = document.getElementById("ground"), path = document.getElementById("threadPath"), st = document.getElementById("stations");
  st.innerHTML = ""; document.getElementById("sub").textContent = "";
  if (world === "W1" || world === "W2") {
    g.className = "fx-layer " + (world === "W1" ? "fx-ink" : "fx-paper");
    path.setAttribute("d", fxThreadD(world));
    fxDrawThread(path, progress, FX.THREAD);
    Object.entries(FX.FRAMING).filter(([k]) => (world === "W1") === (+k.slice(1) <= 5)).forEach(([k, [sx, sy]]) => {
      st.insertAdjacentHTML("beforeend", `<div class="fx-st" style="left:${sx - 160}px;top:${sy - 110}px;width:320px;height:220px;border:2px dashed ${world === "W1" ? "#5c5160" : "#C8BCC5"};border-radius:12px;color:${world === "W1" ? "#C8BCC5" : "#5E5360"};font:700 28px Hanken Grotesk;display:grid;place-items:center">${k}</div>`);
    });
    fxCam(document.getElementById("world"), document.getElementById("cam"), x, y, s, 0);
  } else if (world === "pivot") {
    g.className = "fx-layer fx-black"; path.setAttribute("d", "");
    st.innerHTML = `<svg style="position:absolute;left:0;top:0" width="1920" height="1080"><g transform="translate(420 380) rotate(-8)">${fxNeedle(520)}</g></svg>`;
    fxCam(document.getElementById("world"), document.getElementById("cam"), 960, 540, 1, 0);
    document.getElementById("sub").textContent = "";
  } else if (world === "gym" || world === "fin") {
    g.className = "fx-layer fx-ink"; path.setAttribute("d", "");
    st.innerHTML = `<svg style="position:absolute;left:0;top:0" width="1920" height="1080"><g transform="translate(1150 640)">${fxStickman(world === "gym" ? "smash" : "attente", { bib: world !== "gym" })}</g></svg>`;
    fxCam(document.getElementById("world"), document.getElementById("cam"), 960, 540, 1, 0);
  }
}
demo();
</script>
</body>
</html>
