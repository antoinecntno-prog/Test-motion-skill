<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>A3 · Le fil rouge · 39,3 s</title>
<link rel="stylesheet" href="_base.css">
<style>
.gym{position:absolute;inset:0;background:radial-gradient(90% 70% at 70% 20%,#3a2f45 0%,#1A1320 60%,#0f0b12 100%)}
/* projecteurs de la salle, flous au fond */
.light{position:absolute;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,#fff6e6 0,#ffe7b8 30%,transparent 70%);filter:blur(14px);opacity:.75}
/* parquet en perspective, bas du cadre */
.floor{position:absolute;left:-200px;right:-200px;top:640px;height:700px;transform:perspective(900px) rotateX(62deg);transform-origin:50% 0;
  background:repeating-linear-gradient(90deg,#b07a46 0 90px,#a46f3d 90px 180px,#b8834f 180px 270px);filter:blur(1.5px)}
.floor::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,11,18,.85),rgba(15,11,18,.2) 40%,rgba(15,11,18,.6))}
.court-line{position:absolute;left:-200px;right:-200px;top:700px;height:6px;background:#f2ede6;opacity:.55;filter:blur(1px)}
/* panier : planche, cercle orange, filet tracé par le fil rouge */
.board{position:absolute;left:1200px;top:40px;width:560px;height:340px;border:8px solid #f4f0f3;border-radius:6px;background:rgba(255,255,255,.07)}
.board::after{content:"";position:absolute;left:185px;top:160px;width:174px;height:124px;border:6px solid #f4f0f3}
.rim-back{position:absolute;left:1352px;top:382px;width:260px;height:44px;border:9px solid #b84d1d;border-radius:50%;clip-path:inset(0 0 50% 0)}
.rim-front{position:absolute;left:1352px;top:382px;width:260px;height:44px;border:9px solid #E8662B;border-radius:50%;clip-path:inset(50% 0 0 0)}
.net{position:absolute;left:1336px;top:396px;width:292px;height:220px}
/* ballon écrasé dans le cercle */
.ball{position:absolute;left:1405px;top:300px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f39a5a,#d9621f 55%,#9c3d0e);box-shadow:inset -10px -14px 24px rgba(0,0,0,.35)}
.ball::before,.ball::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid #2a1408}
.ball::before{clip-path:inset(0 48% 0 48%)} .ball::after{clip-path:inset(48% 0 48% 0)}
/* le joueur : stickman de dos qui porte le vrai maillot n° 15 et smashe */
.player{position:absolute;left:0;top:0;width:1920px;height:1080px}
.jersey{position:absolute;left:1028px;top:356px;width:250px;height:328px;background:url(../assets/img/maillot-dos-detoure.png) center/contain no-repeat;
  transform:rotate(14deg);transform-origin:50% 0;filter:drop-shadow(0 16px 22px rgba(0,0,0,.5))}
/* traînées du saut sous le joueur */
.streak{position:absolute;width:26px;border-radius:13px;background:linear-gradient(180deg,rgba(245,239,243,.0),rgba(245,239,243,.28));filter:blur(4px)}
/* filet qui bouge : avant-plan flou d'un autre joueur, coupé par le bord gauche */
.fg{position:absolute;left:-160px;top:180px;width:420px;height:760px;filter:blur(16px);opacity:.55}
</style></head><body>
<div class="stage">
  <div class="gym"></div>
  <div class="light" style="left:140px;top:30px"></div><div class="light" style="left:620px;top:-40px;width:120px;height:120px"></div>
  <div class="light" style="left:980px;top:10px;width:110px;height:110px"></div>
  <div class="floor"></div><div class="court-line"></div>
  <div class="board"></div>
  <div class="rim-back"></div>
  <!-- jambes et bras derrière le maillot -->
  <svg class="player" viewBox="0 0 1920 1080">
    <g stroke="#F5EFF3" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M1112 650 L1050 742 L1096 830"/>                 <!-- jambe gauche repliée -->
      <path d="M1196 668 L1170 770 L1238 812"/>                 <!-- jambe droite repliée -->
      <path d="M1060 420 L990 520 L948 610"/>                   <!-- bras gauche en balancier -->
      <path d="M1222 392 L1330 336 L1418 318"/>                 <!-- bras droit tendu vers le cercle -->
    </g>
    <circle cx="1170" cy="312" r="50" fill="#F5EFF3"/>          <!-- tête -->
  </svg>
  <div class="jersey"></div>
  <div class="ball"></div>
  <div class="rim-front"></div>
  <svg class="net" viewBox="0 0 292 220">
    <g fill="none" stroke="#D62839" stroke-width="4" stroke-linecap="round">
      <path d="M22 20 L70 200 M60 24 L100 205 M100 26 L130 208 M146 27 L146 210 M192 26 L162 208 M232 24 L192 205 M270 20 L222 200"/>
      <path d="M22 20 C 80 70 212 70 270 20 M38 80 C 100 120 192 120 254 80 M55 140 C 110 170 182 170 237 140 M70 200 C 120 214 172 214 222 200"/>
    </g>
  </svg>
  <!-- main sur le ballon, au-dessus du cercle -->
  <svg class="player" viewBox="0 0 1920 1080"><circle cx="1428" cy="316" r="22" fill="#F5EFF3"/></svg>
  <div class="streak" style="left:1080px;top:820px;height:70px"></div>
  <div class="streak" style="left:1200px;top:800px;height:80px"></div>
  <svg class="fg" viewBox="0 0 420 760"><g stroke="#F5EFF3" stroke-width="60" stroke-linecap="round" fill="none"><path d="M200 60 L260 360 L180 700"/><path d="M230 200 L380 320"/></g><circle cx="190" cy="0" r="90" fill="#F5EFF3"/></svg>
  <div class="sub dark">Samedi, le numéro <span class="box">15</span> monte au panier.</div>
</div>
</body></html>
