<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>A3 · Le fil rouge · 39,3 s</title>
<link rel="stylesheet" href="_base.css">
<style>
@font-face{font-family:"Pacifico";src:url(../assets/fonts/studio-pacifico.woff2) format("woff2")}
.gym{position:absolute;inset:0;background:radial-gradient(90% 70% at 60% 20%,#3a2f45 0%,#1A1320 60%,#0f0b12 100%)}
.light{position:absolute;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#fff6e6 0,#ffe7b8 30%,transparent 70%);filter:blur(14px);opacity:.8}
.floor{position:absolute;left:-300px;right:-300px;top:635px;height:700px;transform:perspective(900px) rotateX(58deg);transform-origin:50% 0;
  background:repeating-linear-gradient(90deg,#b07a46 0 90px,#a46f3d 90px 180px,#b8834f 180px 270px);filter:blur(1.2px)}
.floor::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,11,18,.7),rgba(15,11,18,.05) 45%,rgba(15,11,18,.35))}
.court-line{position:absolute;left:0;right:0;top:694px;height:6px;background:#f2ede6;opacity:.7}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px}
.fg{position:absolute;left:-150px;top:150px;width:420px;height:760px;filter:blur(16px);opacity:.5}
</style></head><body>
<div class="stage">
  <div class="gym"></div>
  <div class="light" style="left:150px;top:40px"></div>
  <div class="light" style="left:620px;top:-30px;width:130px;height:130px"></div>
  <div class="light" style="left:980px;top:10px;width:120px;height:120px"></div>
  <div class="floor"></div><div class="court-line"></div>

  <svg class="scene" viewBox="0 0 1920 1080">
    <defs>
      <filter id="rim" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <linearGradient id="steel" x1="0" x2="1"><stop offset="0" stop-color="#d9d6dc"/><stop offset=".5" stop-color="#f4f2f5"/><stop offset="1" stop-color="#b9b6bd"/></linearGradient>
      <radialGradient id="ballg" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#f39a5a"/><stop offset=".55" stop-color="#d9621f"/><stop offset="1" stop-color="#8f370c"/></radialGradient>
    </defs>

    <!-- poteau, bras et planche, vus de trois quarts -->
    <path d="M1745 380 L1880 470 L1880 1080" fill="none" stroke="url(#steel)" stroke-width="34" stroke-linejoin="round"/>
    <rect x="1590" y="-20" width="160" height="410" fill="#2b2533" stroke="#f4f2f5" stroke-width="12"/>
    <rect x="1615" y="130" width="64" height="150" fill="none" stroke="#f4f2f5" stroke-width="8"/>
    <!-- arrière du cercle -->
    <path d="M1362 276 A120 22 0 0 1 1602 276" fill="none" stroke="#a5461a" stroke-width="10"/>
    <path d="M1600 272 L1640 262 L1640 286" fill="#c4521d" stroke="#a5461a" stroke-width="6"/>

    <!-- le joueur : bras gauche (derrière), jambes, short -->
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <g stroke="#fff" stroke-opacity=".55" stroke-width="30" filter="url(#rim)">
        <path d="M1088 372 L1030 442 L985 500"/>
        <path d="M1168 640 L1082 640 L1040 702"/>
        <path d="M1230 632 L1172 722 L1062 762"/>
      </g>
      <g stroke="#0d0a10" stroke-width="22">
        <path d="M1088 372 L1030 442 L985 500"/>
        <path d="M1168 640 L1082 640 L1040 702"/>
        <path d="M1230 632 L1172 722 L1062 762"/>
      </g>
    </g>
    <circle cx="985" cy="502" r="17" fill="#0d0a10" stroke="#fff" stroke-opacity=".6" stroke-width="3"/>

    <!-- torse : short puis maillot dessinés, inclinés avec le corps -->
    <g transform="translate(1150 345) rotate(-10)">
      <path d="M-14 -16 L-12 4" stroke="#0d0a10" stroke-width="24" stroke-linecap="round"/>
      <path d="M-82 196 L82 196 L92 300 L12 304 L0 262 L-12 304 L-92 300 Z" fill="#DC2A2F" stroke="#0d0a10" stroke-width="4"/>
      <path d="M86 210 L94 296" stroke="#15151C" stroke-width="10"/><path d="M78 212 L86 296" stroke="#fff" stroke-width="3"/>
      <path d="M-86 210 L-94 296" stroke="#15151C" stroke-width="10"/><path d="M-78 212 L-86 296" stroke="#fff" stroke-width="3"/>
      <path d="M-92 300 L-12 304 M12 304 L92 300" stroke="#15151C" stroke-width="7"/>
      <!-- maillot dos : rouge, épaules noires, liseré, 15, Contino Sport -->
      <path d="M-50 -2 Q0 16 50 -2 L72 2 Q60 52 82 82 L80 216 L-80 216 L-82 82 Q-60 52 -72 2 Z" fill="#DC2A2F" stroke="#0d0a10" stroke-width="4"/>
      <path d="M-50 -2 Q0 16 50 -2 L72 2 Q66 26 68 40 Q0 52 -68 40 Q-66 26 -72 2 Z" fill="#15151C"/>
      <path d="M-80 204 L80 204 L80 216 L-80 216 Z" fill="#15151C"/>
      <g stroke="#15151C" stroke-width="3" opacity=".9"><path d="M-80 110 L-64 124 M-80 132 L-62 148 M-80 154 L-64 168 M80 110 L64 124 M80 132 L62 148 M80 154 L64 168"/></g>
      <text x="0" y="122" text-anchor="middle" font-family="Archivo" font-weight="900" font-stretch="75%" font-size="74" fill="#15151C" stroke="#a9aeb6" stroke-width="3" paint-order="stroke">15</text>
      <text x="-4" y="166" text-anchor="middle" font-family="Pacifico" font-size="25" fill="#fff">Contino</text>
      <text x="30" y="186" text-anchor="middle" font-family="Hanken Grotesk" font-weight="700" font-style="italic" font-size="13" fill="#fff" letter-spacing="1">SPORT</text>
    </g>

    <!-- tête et bras droit qui smashe (devant) -->
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M1216 345 L1300 282 L1398 214" stroke="#fff" stroke-opacity=".55" stroke-width="30" filter="url(#rim)"/>
      <path d="M1216 345 L1300 282 L1398 214" stroke="#0d0a10" stroke-width="22"/>
    </g>
    <circle cx="1138" cy="268" r="62" fill="#0d0a10" stroke="#fff" stroke-opacity=".75" stroke-width="4"/>

    <!-- ballon dans le cercle, main posée dessus -->
    <circle cx="1452" cy="232" r="62" fill="url(#ballg)"/>
    <g fill="none" stroke="#2a1408" stroke-width="3"><path d="M1452 170 L1452 294"/><path d="M1392 238 Q1452 252 1512 230"/><path d="M1408 190 Q1440 232 1418 282"/><path d="M1496 186 Q1468 232 1490 282"/></g>
    <circle cx="1400" cy="212" r="18" fill="#0d0a10" stroke="#fff" stroke-opacity=".6" stroke-width="3"/>

    <!-- filet blanc en losanges, un brin rouge : le fil -->
    <g id="net" fill="none" stroke-linecap="round"></g>
    <!-- avant du cercle -->
    <path d="M1362 276 A120 22 0 0 0 1602 276" fill="none" stroke="#E8662B" stroke-width="10"/>
  </svg>

  <svg class="fg" viewBox="0 0 420 760"><g stroke="#F5EFF3" stroke-width="60" stroke-linecap="round" fill="none"><path d="M200 60 L260 360 L180 700"/><path d="M230 200 L380 320"/></g><circle cx="190" cy="0" r="90" fill="#F5EFF3"/></svg>
  <div class="sub dark">Samedi, le numéro <span class="box">15</span> monte au panier.</div>
</div>
<script>
// filet : 12 points sur l'avant du cercle, 12 en bas, diagonales croisées = losanges ; le brin n° 5 est le fil rouge
const g=document.getElementById("net"),N=12,tp=[],bot=[];
for(let i=0;i<=N;i++){const a=Math.PI*(i/N);tp.push([1482-120*Math.cos(a),276+22*Math.sin(a)]);bot.push([1482-70*Math.cos(a),470+12*Math.sin(a)]);}
let d='';
const rows=4,pts=[];
for(let r=0;r<=rows;r++){const t=r/rows;pts.push(tp.map((p,i)=>[p[0]+(bot[i][0]-p[0])*t,p[1]+(bot[i][1]-p[1])*t]));}
for(let r=0;r<rows;r++)for(let i=0;i<N;i++){const a=pts[r][i],b=pts[r+1][i+1],c=pts[r][i+1],e=pts[r+1][i];d+=`M${a} L${b} M${c} L${e} `;}
const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('stroke','#f4f2f5');p.setAttribute('stroke-width','3.2');g.appendChild(p);
let r='';for(let k=0;k<rows;k++){const a=pts[k][k%2?5:4],b=pts[k+1][(k+1)%2?5:4];r+=(k?' L':'M')+a+' L'+b;}
const q=document.createElementNS('http://www.w3.org/2000/svg','path');q.setAttribute('d',r);q.setAttribute('stroke','#D62839');q.setAttribute('stroke-width','5');g.appendChild(q);
</script>
</body></html>
