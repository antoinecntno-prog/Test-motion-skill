<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>B1 · L'établi · 1,2 s</title>
<link rel="stylesheet" href="_base.css">
<style>
/* L'établi vu de dessus, encore éteint : bois sombre, lumière d'une seule lampe */
.bench{position:absolute;inset:0;background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 3px,transparent 3px 19px),
  repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 160px),
  radial-gradient(70% 80% at 52% 42%,#3b2c2a 0%,#241a1c 55%,#140f12 100%)}
/* Fenêtre de nouveau message, mise en page Outlook, contenu anonymisé */
.mail{position:absolute;left:470px;top:110px;width:980px;height:640px;background:#fff;border-radius:10px;overflow:hidden;
  box-shadow:0 50px 100px rgba(0,0,0,.6);transform:rotate(-1.5deg)}
.bar{height:56px;background:#0F6CBD;display:flex;align-items:center;padding:0 24px;color:#fff;font:600 21px "Hanken Grotesk"}
.bar span{margin-left:auto;opacity:.8;font-weight:500}
.tools{height:64px;border-bottom:1px solid #e1dfdd;display:flex;align-items:center;gap:18px;padding:0 24px}
.send{background:#0F6CBD;color:#fff;font:700 21px "Hanken Grotesk";padding:12px 28px;border-radius:4px;position:relative}
.send.pressed{background:#0b4f8a;transform:scale(.96)}
.tools i{font:500 19px "Hanken Grotesk";color:#605e5c;font-style:normal}
.row{display:flex;align-items:center;height:62px;border-bottom:1px solid #edebe9;padding:0 24px;font:500 22px "Hanken Grotesk";color:#323130}
.row b{width:96px;color:#605e5c;font-weight:500}
.chip{display:inline-flex;align-items:center;background:#f3f2f1;border-radius:4px;padding:6px 12px;font-weight:600}
.att{margin:20px 24px 0;display:inline-flex;align-items:center;gap:14px;border:1px solid #e1dfdd;border-radius:6px;padding:12px 18px;font:600 20px "Hanken Grotesk";color:#323130}
.xl{width:34px;height:40px;background:#1D6F42;border-radius:3px;color:#fff;font:800 18px "Archivo";display:grid;place-items:center}
.body{padding:22px 24px;font:400 23px/1.5 "Hanken Grotesk";color:#323130}
/* curseur qui vient de cliquer sur Envoyer, onde du clic */
.cur{position:absolute;left:575px;top:212px;width:46px;height:58px}
.ring{position:absolute;left:520px;top:180px;width:120px;height:120px;border:4px solid rgba(15,108,189,.55);border-radius:50%}
/* page de calendrier JUIN, très proche de la caméra, floue, coupée par le bord droit */
.juin{position:absolute;left:1500px;top:90px;width:620px;height:560px;background:#F4EFEC;border-radius:8px;transform:rotate(9deg) scale(1.3);
  filter:blur(10px);padding:40px 46px;box-shadow:0 40px 80px rgba(0,0,0,.5)}
.juin h2{font:900 110px "Archivo";font-stretch:80%;color:#1A1320}
/* traînée de l'enveloppe qui part déjà vers la droite */
.whoosh{position:absolute;left:1180px;top:150px;width:420px;height:70px;border-radius:40px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18));filter:blur(10px);transform:rotate(-8deg)}
</style></head><body>
<div class="stage">
  <div class="bench"></div>
  <div class="whoosh"></div>
  <div class="mail">
    <div class="bar">Nouveau message<span>Courrier</span></div>
    <div class="tools"><div class="send pressed">Envoyer</div><i>Joindre</i><i>Mise en forme</i></div>
    <div class="row"><b>À</b><span class="chip">Fournisseur textile</span></div>
    <div class="row"><b>Objet</b>Commande maillots · saison 2026</div>
    <div class="att"><div class="xl">X</div>Commande maillots 2026.xlsx</div>
    <div class="body">Bonjour,<br>voici notre commande de maillots pour la saison.<br><br>Basket Club Eschau</div>
  </div>
  <div class="ring"></div>
  <svg class="cur" viewBox="0 0 46 58"><path d="M3 2 L3 46 L14 35 L22 54 L30 50 L22 32 L38 32 Z" fill="#fff" stroke="#1A1320" stroke-width="3" stroke-linejoin="round"/></svg>
  <div class="juin"><h2>JUIN</h2></div>
  <div class="sub dark"><span class="box">Juin</span>, vous commandez les maillots du club.</div>
</div>
</body></html>
