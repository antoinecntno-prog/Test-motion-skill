<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>C1 · Le numéro 15 · 13,7 s</title>
<link rel="stylesheet" href="_base.css">
<style>
/* Hublot de machine à laver : on regarde le numéro à travers la vitre, dans le noir */
.door{position:absolute;left:330px;top:-60px;width:1260px;height:1000px;border-radius:50%;
  background:radial-gradient(circle,#2a2230 0 58%,#8b8790 59%,#d7d4da 62%,#77737c 66%,#2b2730 70%,#17121a 74%)}
.glass{position:absolute;left:470px;top:60px;width:980px;height:760px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 50% 55%,#2c2433,#120d16)}
/* le numéro, très gros, tourne avec le tambour (léger flou de rotation) */
.num{position:absolute;left:150px;top:-180px;width:720px;height:943px;background:url(../assets/img/maillot-dos-detoure.png) 50% 24%/240% auto no-repeat;
  transform:rotate(14deg);filter:blur(.6px) saturate(.75) brightness(.9)}
/* coin du 1 qui se décolle : rabat en relief avec son ombre portée */
.flap{position:absolute;left:470px;top:180px;width:150px;height:200px;background:linear-gradient(135deg,#1c1b24,#3a3946 55%,#9aa0aa 56%,#7c818b);
  clip-path:polygon(0 0,100% 0,100% 30%,40% 100%,0 72%);transform:rotate(-24deg) skewY(-8deg);box-shadow:0 0 0 #000;
  filter:drop-shadow(10px 18px 12px rgba(0,0,0,.55))}
.crack{position:absolute;left:420px;top:330px;width:300px;height:260px}
/* reflets et gouttes sur la vitre */
.spec{position:absolute;left:560px;top:110px;width:420px;height:160px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);transform:rotate(-18deg);filter:blur(6px)}
.drop{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,255,255,.06) 60%,transparent 70%)}
/* mousse en avant-plan bas, floue */
.foam{position:absolute;left:520px;top:600px;width:900px;height:260px;border-radius:50%;background:radial-gradient(closest-side,rgba(240,236,242,.75),rgba(240,236,242,0));filter:blur(18px)}
.ring-fg{position:absolute;left:-200px;top:-260px;width:760px;height:760px;border-radius:50%;border:70px solid #9d99a3;filter:blur(16px);opacity:.7}
</style></head><body>
<div class="stage ground-dark">
  <div class="door"></div>
  <div class="glass">
    <div class="num"></div>
    <div class="flap"></div>
    <svg class="crack" viewBox="0 0 300 260"><g stroke="#d9dce2" stroke-width="2.5" fill="none" opacity=".85">
      <path d="M40 20 L80 70 L70 120 L120 170 L110 230"/><path d="M80 70 L140 60 L190 100"/><path d="M120 170 L190 160 L240 210"/></g></svg>
    <div class="foam"></div>
  </div>
  <div class="spec"></div>
  <div class="drop" style="left:700px;top:520px;width:46px;height:52px"></div>
  <div class="drop" style="left:1180px;top:300px;width:30px;height:34px"></div>
  <div class="drop" style="left:1030px;top:640px;width:22px;height:24px"></div>
  <div class="ring-fg"></div>
  <div class="sub dark">Et le numéro se <span class="box">décolle</span> au premier lavage.</div>
</div>
</body></html>
