<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>C3 · Le numéro 15 · 41,1 s</title>
<link rel="stylesheet" href="_base.css">
<style>
.gym{position:absolute;inset:0;background:radial-gradient(80% 80% at 40% 30%,#3b2f46,#1A1320 60%,#0f0b12)}
.light{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff4e0,rgba(255,231,184,.4) 40%,transparent 70%);filter:blur(16px)}
/* le maillot, net, au centre gauche, porté par la lumière de la salle */
.jersey{position:absolute;left:300px;top:40px;width:620px;height:812px;background:url(../assets/img/maillot-face-noir-rouge-detoure.png) center/contain no-repeat;
  transform:rotate(-3deg);filter:drop-shadow(0 40px 50px rgba(0,0,0,.55))}
/* nuancier « rouge club » qui se pose contre le tissu : la même teinte, des mois après */
.swatch{position:absolute;left:880px;top:300px;width:330px;height:470px;background:#fff;border-radius:10px;box-shadow:0 30px 60px rgba(0,0,0,.5);transform:rotate(7deg);overflow:hidden}
.swatch .chip{height:310px;background:#E5322E}
.swatch .lbl{padding:20px 22px;font:800 30px "Archivo";font-stretch:85%;color:var(--ink)}
.swatch .lbl small{display:block;font:600 18px "Hanken Grotesk";color:var(--text-2);margin-top:6px}
.match{position:absolute;left:1240px;top:410px;font:900 92px/1 "Archivo";font-stretch:80%;color:var(--on-dark)}
.match small{display:block;font:600 24px "Hanken Grotesk";color:var(--on-dark-2);margin-top:12px;letter-spacing:.02em}
/* avant-plan : ballon flou coupé par le bord droit */
.ball{position:absolute;left:1600px;top:-120px;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f39a5a,#d9621f 55%,#9c3d0e);filter:blur(14px);opacity:.9}
</style></head><body>
<div class="stage">
  <div class="gym"></div>
  <div class="light" style="left:120px;top:20px;width:180px;height:180px"></div>
  <div class="light" style="left:1100px;top:-40px;width:140px;height:140px"></div>
  <div class="jersey"></div>
  <div class="swatch"><div class="chip"></div><div class="lbl">Rouge club<small>BAT validé</small></div></div>
  <div class="ball"></div>
  <div class="sub dark">Le rouge est <span class="stroke">resté</span> <span class="box">rouge</span>.</div>
</div>
</body></html>
